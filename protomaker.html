<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロトメーカー</title>
<style>
:root{--bg:#eef0f3;--line:#e3e6ea;--text:#1f2328;--sub:#667085;--accent:#2f6fed;--accent-soft:#eaf1fe;--danger:#d92d20;--ok:#12a150}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;vertical-align:-4px;margin-right:5px;overflow:visible}
svg.i .ff>*{fill:var(--if);transform:translate(1.3px,1.3px)}
svg.i.sm{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
svg.i.lg{width:24px;height:24px;vertical-align:-5px;margin-right:6px}
svg.i.solo{margin-right:0}
.primary svg.i .ff>*,.ck-btns button.on svg.i .ff>*,.pv-bar svg.i .ff>*,.av-bar svg.i .ff>*,.ftitle.on svg.i .ff>*{fill:rgba(255,255,255,.3)}
button{display:inline-flex;align-items:center;justify-content:center;}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;white-space:nowrap}
button:hover{background:#f5f7fa}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#255fd6}
button.danger{color:var(--danger)}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=color]{padding:2px;height:30px;width:44px;cursor:pointer;flex:none}
input[type=checkbox]{width:auto;margin:0}
#app{display:grid;grid-template-columns:232px 1fr 280px;grid-template-rows:52px 1fr;height:100vh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line);min-width:0;overflow-x:auto}
.brand{font-weight:800;color:var(--accent);margin-right:4px;white-space:nowrap}
.pname{width:130px!important;font-weight:600;flex:none}
#device{width:auto;flex:none}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px;flex:none}
.grow{flex:1}
.tg.on{background:var(--accent-soft);border-color:#b9cff8;color:#1d4fc4}
.menu{position:relative;flex:none}
.menu summary{display:flex;align-items:center;list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:5px 10px;white-space:nowrap;background:#fff}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:fixed;right:10px;top:46px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;z-index:50;min-width:210px}
.menu-pop button{border:none;text-align:left;justify-content:flex-start}
#left,#right{background:#fff;overflow-y:auto;min-height:0}
#left{border-right:1px solid var(--line);padding:10px}
#right{border-left:1px solid var(--line);padding:12px}
.ph-title{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--sub);font-size:12px;margin:4px 0 8px}
.ph-title button{padding:2px 8px;font-size:12px}
#scrList{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-height:min(40vh,340px);overflow-y:auto;padding:2px;border-bottom:1px solid var(--line);padding-bottom:8px}
.si{display:flex;gap:8px;align-items:center;padding:5px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.si:hover{background:#f5f7fa}
.si.on{background:var(--accent-soft);border-color:#b9cff8}
.si .no{font-size:11px;color:var(--sub);width:14px;text-align:right;flex:none}
.si .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.si .st{font-size:10px;background:var(--ok);color:#fff;border-radius:4px;padding:0 4px;flex:none}
.thumb{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;flex:none;background:#fff;pointer-events:none}
.thumb .screen{position:absolute;left:0;top:0}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#tools button{display:flex;align-items:center;justify-content:flex-start;gap:6px;padding:6px 7px;font-size:12px;text-align:left;overflow:hidden}
#tools .ic{width:20px;display:flex;flex:none}
#tools .ic svg.i{margin-right:0}
#tools .lbl2{grid-column:1/-1;font-size:11px;color:var(--sub);margin-top:8px}
#center{position:relative;min-width:0;min-height:0}
#stage{position:absolute;inset:0;overflow:auto}
#wrap{position:relative;margin:96px auto 90px}
.screen{position:relative;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.scrn{position:absolute;overflow:visible;box-shadow:0 6px 24px rgba(16,24,40,.14)}
.scrn.grid{background-image:radial-gradient(circle,#c9ced6 1px,transparent 1.3px);background-size:8px 8px}
.ftitle{position:absolute;pointer-events:auto;font-size:12px;font-weight:700;color:#475467;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;padding:2px 6px;border-radius:5px;line-height:18px}
.ftitle:hover{background:#fff}
.ftitle.on{color:#fff;background:var(--accent)}
.fcur{position:absolute;outline:2px solid #9bbaf5;outline-offset:3px;pointer-events:none}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.ldrag{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:6}
.lh{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--accent),0 2px 6px rgba(0,0,0,.2);pointer-events:auto;cursor:crosshair}
.lh:hover{transform:scale(1.2)}
.scrn.drop{outline:4px solid var(--accent);outline-offset:4px}
.si.drop{outline:2px solid var(--accent);background:var(--accent-soft)}
.fold{position:absolute;border-top:2px dashed #f79009;pointer-events:none}
.fold span{position:absolute;right:0;top:-19px;font-size:10px;color:#b54708;background:#fffaeb;padding:0 5px;border-radius:3px;white-space:nowrap}
.pin{position:absolute;font-size:10px;background:#fff;border:1px solid #fdb022;color:#b54708;border-radius:4px;padding:0 4px;white-space:nowrap}
#viewbar{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:2}
.vrow2{display:flex;gap:6px;align-items:center;margin-left:14px;position:relative}
.vrow2.nolink{margin-left:0}
.vrow2.nolink::before{display:none}
.vrow2::before{content:'';position:absolute;left:-10px;top:-8px;width:8px;height:22px;border-left:2px solid #a6e0bd;border-bottom:2px solid #a6e0bd;border-bottom-left-radius:6px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.seg button{border:none;padding:4px 10px;font-size:12px;border-radius:6px;background:transparent}
.seg button.on{background:var(--accent);color:#fff}
#viewbar button#bArrange{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.seg.sub{background:#ecfdf3;border-color:#a6e0bd;align-items:center}
.seg.sub button{color:#067a3c}
.seg.sub button:hover{background:#d1fadf}
.seg.sub button.on{background:#12a150;color:#fff}
.seglbl{font-size:11px;font-weight:700;color:#067a3c;padding:0 6px 0 4px}
#mapview{position:absolute;inset:0;display:none;background:#f6f7f9}
#mapview .mp-body{height:100%;grid-template-columns:1fr}
#mapview .mp-canvas{margin-top:60px}
.node.cur{box-shadow:0 0 0 3px #9bbaf5}
.author{font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap;padding:3px 6px;border-radius:6px;flex:none;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.author:hover{background:#f5f7fa}
.author.empty{color:#b54708;background:#fffaeb}
.arow{display:grid;grid-template-columns:1.2fr .8fr 1.6fr;gap:8px}
.req{color:var(--danger);font-weight:700}
#ovl{position:absolute;inset:0;pointer-events:none}
.el{position:absolute;display:flex;align-items:center;overflow:hidden;line-height:1.35;white-space:pre-wrap;word-break:break-word;user-select:none;-webkit-user-select:none}
.el .tx{display:block;max-width:100%;padding:0 6px}
.t-text{align-items:flex-start}
.t-text .tx{width:100%;padding:0}
.t-input .tx{padding:0 12px;width:100%}
.t-input input{all:unset;box-sizing:border-box;width:100%;height:100%;padding:0 12px;font:inherit;color:#1f2328;text-align:inherit}
.t-image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.t-image.ph{justify-content:center!important}
.t-image.ph svg{position:absolute;inset:0;width:100%;height:100%}
.t-image.ph .tx{position:relative;background:rgba(255,255,255,.85);border-radius:4px;font-size:12px!important;color:#667085;padding:1px 6px}
#world .el{cursor:move}
#wrap.flow .scrn{cursor:grab}
#wrap.flow .scrn .el{cursor:move}
.el.editing,.el.editing .tx{user-select:text;-webkit-user-select:text;cursor:text}
.el.editing{outline:2px solid var(--accent);overflow:visible;z-index:5}
.el.editing .tx{outline:none;min-width:1em;min-height:1.2em}
.sel-box{position:absolute;border:1.5px solid var(--accent)}
.hd{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;pointer-events:auto}
.sz{position:absolute;background:var(--accent);color:#fff;font-size:10px;padding:0 5px;border-radius:4px;white-space:nowrap}
.lk-box{position:absolute;border:1.5px dashed #7aa2f7;border-radius:3px}
.lk-tag{position:absolute;background:#2f6fed;color:#fff;font-size:10px;padding:1px 7px;border-radius:9px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tap{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;opacity:.7}
.tap.miss{background:#f04438;box-shadow:0 0 0 3px rgba(240,68,56,.25)}
.tap.hit{background:#2f6fed}
.mq{position:absolute;border:1px solid var(--accent);background:rgba(47,111,237,.08);pointer-events:none}
#zoombar{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#zoombar button{padding:3px 9px}
#zVal{width:46px;text-align:center;font-size:12px;color:var(--sub)}
.pt{font-size:15px;font-weight:800;margin-bottom:6px}
.pt .sub{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.sec{font-size:11px;font-weight:700;color:var(--sub);margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.sec.first{border-top:none;padding-top:0;margin-top:8px}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
.f>.fl{font-size:11px;color:var(--sub)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 input{padding:5px 4px}
.crow{display:flex;align-items:center;gap:6px}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns button{font-size:12px;padding:4px 9px}
.btns.grid3{display:grid;grid-template-columns:repeat(3,1fr)}
.hint{font-size:11px;color:var(--sub);margin:-2px 0 8px}
.tipbox{margin-top:16px;background:#f7f8fa;border-radius:8px;padding:10px;font-size:12px;color:#475467}
.tipbox ul{margin:4px 0 0;padding-left:18px}
.conn{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.conn .lbl{font-size:11px;color:var(--sub);width:100%}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#f2f4f7;border:1px solid var(--line)}
button.chip:hover{background:var(--accent-soft)}
.chip.back{color:var(--sub)}
.none{font-size:12px;color:#98a2b3}
.badge{font-size:12px;background:#e7f6ec;color:#067a3c;border-radius:6px;padding:4px 8px}
#modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:100%;overflow:auto;padding:20px 22px}
.mbox h2{margin:0 0 8px;font-size:18px}
.lead{color:#475467;margin:0 0 14px}
.mfoot{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
#modal.m-pv{padding:0;background:#1b1e24}
.m-pv .mbox{width:100vw;height:100vh;max-height:none;border-radius:0;padding:0;background:#1b1e24;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.pv-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#111318}
.pv-bar button{background:#2a2e37;border-color:#3a3f4b;color:#fff}
.pv-bar button:hover{background:#353a45}
.pv-bar button.danger{background:#b42318;border-color:#b42318}
.pv-name{font-weight:700}
.pv-task{background:#fff7e6;color:#5c3b00;padding:10px 14px;display:flex;gap:10px;align-items:center}
.pv-timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.pv-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.device{background:#0b0c0f;padding:12px;border-radius:44px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 2px #2b2f38}
.d-tablet{border-radius:30px;padding:16px}
.d-pc{border-radius:10px;padding:26px 6px 6px;position:relative}
.d-pc::before{content:'';position:absolute;left:12px;top:9px;width:9px;height:9px;border-radius:50%;background:#f04438;box-shadow:15px 0 #f79009,30px 0 #12b76a}
.vp{position:relative;overflow:hidden;border-radius:32px;background:#fff}
.d-tablet .vp{border-radius:16px}
.d-pc .vp{border-radius:3px}
.layer{position:absolute;inset:0;overflow:hidden;background:#fff}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.layer .screen{position:absolute;left:0;top:0;transform-origin:0 0}
.pvmode .el{pointer-events:none;cursor:default}
.pvmode .el.link,.pvmode .t-input{pointer-events:auto}
.pvmode .el.link{cursor:pointer}
.screen.fixlayer{background:transparent!important;pointer-events:none}
.fixlayer .el{pointer-events:auto}
.el.link::after{content:'';position:absolute;inset:0;background:rgba(47,111,237,.25);border:2px solid #2f6fed;border-radius:inherit;opacity:0;transition:opacity .15s;pointer-events:none}
.flash .el.link::after,.showhot .el.link::after{opacity:1}
.pv-hint{text-align:center;font-size:12px;color:#8a909c;padding:8px}
.m-map .mbox{width:min(1240px,100%);height:min(840px,100%);display:flex;flex-direction:column;padding:0}
.mp-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mp-head h2{margin:0}
.mp-body{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.mp-area{overflow:auto;background:#f6f7f9;background-image:radial-gradient(circle,#dde1e7 1px,transparent 1px);background-size:16px 16px}
.mp-canvas{position:relative}
.mp-svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;background:#fff;border:1.5px solid #d0d5dd;border-radius:10px;padding:0 6px 6px;cursor:grab;box-shadow:0 2px 6px rgba(16,24,40,.06);user-select:none;-webkit-user-select:none;touch-action:none}
.node.start{border-color:var(--ok);border-width:2px}
.node.warn{border-color:#f79009}
.node .nh{font-size:12px;font-weight:700;padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-side{border-left:1px solid var(--line);overflow:auto;padding:14px}
.chk-item{display:block;width:100%;text-align:left;white-space:normal;margin-bottom:6px;font-size:12px;line-height:1.5;border-radius:8px;padding:8px 10px}
.chk-item.warn{border-color:#fedf89;background:#fffaeb}
.chk-item.info{background:#f8f9fb}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat3 div,.stats div{background:#f7f8fa;border-radius:10px;padding:8px;text-align:center}
.stat3 b,.stats b{display:block;font-size:19px}
.stat3 span,.stats span{font-size:11px;color:var(--sub)}
.edge-lbl{font-size:11px;fill:#344054;paint-order:stroke;stroke:#f6f7f9;stroke-width:4px}
.res{display:inline-block;font-weight:800;padding:4px 12px;border-radius:999px;background:#f2f4f7;margin:8px 0 2px}
.res.ok{background:#dcfae6;color:#067a3c}
.res.ng{background:#fee4e2;color:#b42318}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.arr{color:var(--sub)}
.ins{margin:0;padding-left:18px;color:#344054}
.ins li{margin-bottom:4px}
.rmeta{color:var(--sub);font-size:12px}
.rtask{background:#f7f8fa;border-radius:8px;padding:8px 10px;margin-top:8px}
.m-res .mbox{width:min(660px,100%)}
.m-list .mbox{width:min(1000px,100%)}
.m-help .mbox{width:min(680px,100%)}
.m-ai .mbox{width:min(1180px,100%);height:min(860px,100%);display:flex;flex-direction:column;padding:0}
.ai-body{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
.ai-form{overflow:auto;padding:16px 18px;border-right:1px solid var(--line)}
.ai-form textarea{font-size:12.5px}
.ai-prev{display:flex;flex-direction:column;min-height:0;background:#f7f8fa}
.ai-prev pre{flex:1;margin:0;overflow:auto;padding:16px 18px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"BIZ UDGothic",monospace;white-space:pre-wrap;word-break:break-word;color:#1f2328}
.ai-ptitle{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);background:#fff}
.ai-warn{font-size:12px;background:#fffaeb;color:#93370d;border:1px solid #fedf89;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.ai-ok{font-size:12px;background:#ecfdf3;color:#067a3c;border:1px solid #a6e0bd;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.ai-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.ai-tabs{display:flex;gap:4px;background:#f2f4f7;border-radius:10px;padding:3px;margin-left:12px}
.ai-tabs button{border:none;background:transparent;padding:6px 14px;font-size:13px;border-radius:7px;color:#475467}
.ai-tabs button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ck-body{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.ck-list{overflow:auto;padding:14px 18px}
.ck-side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;background:#f7f8fa;display:flex;flex-direction:column;gap:10px}
.ck-cat{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.ck-cat:first-child{margin-top:0}
.ck-cat .n{font-weight:400}
.ck-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff}
.ck-item.ok{background:#f3fbf6;border-color:#b7e4c7}
.ck-item.ng{background:#fff6f5;border-color:#fdb4ad}
.ck-row{display:flex;gap:10px;align-items:flex-start}
.ck-text{flex:1;font-size:13px;line-height:1.55;padding-top:3px}
.ck-text .sub{display:block;font-size:11.5px;color:var(--sub)}
.ck-btns{display:flex;gap:4px;flex:none}
.ck-btns button{padding:3px 10px;font-size:12px;border-radius:999px}
.ck-btns button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck-btns button.ng.on{background:var(--danger);border-color:var(--danger);color:#fff}
.ck-note{margin-top:6px}
.ck-note input{font-size:12.5px}
.ck-prog{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#e4e7ec}
.ck-prog i{display:block}
.ck-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ck-stat div{background:#fff;border-radius:8px;padding:6px;text-align:center;border:1px solid var(--line)}
.ck-stat b{display:block;font-size:18px}
.ck-stat span{font-size:11px;color:var(--sub)}
.ck-side pre{margin:0;flex:1;min-height:160px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.6 ui-monospace,Menlo,Consolas,"BIZ UDGothic",monospace;white-space:pre-wrap;word-break:break-word}
.ck-other{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.lg-body{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
.lg-list{overflow:auto;padding:14px 18px}
.lg-side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;background:#f7f8fa;display:flex;flex-direction:column;gap:10px}
.lg-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;position:relative}
.lg-card::before{content:'';position:absolute;left:-11px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lg-list{border-left:0}
.lg-tl{border-left:2px solid #c9d7f5;padding-left:14px;margin-left:4px}
.lg-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lg-h b{font-size:15px}
.lg-h .d{font-size:12px;color:var(--sub)}
.lg-nums{font-size:12px;color:#475467;margin-bottom:6px}
.lg-sec{font-size:11.5px;font-weight:700;color:var(--sub);margin:8px 0 3px}
.lg-card ul{margin:0;padding-left:18px;font-size:12.5px}
.lg-card li{margin-bottom:2px}
.lg-card .txt{font-size:12.5px;white-space:pre-wrap}
.lg-chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px 4px 0;background:#fff;border:1px solid var(--line);border-radius:8px}
.lg-chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--sub)}
.lg-chart i{display:block;width:70%;max-width:34px;background:var(--ok);border-radius:4px 4px 0 0}
.lg-empty{color:var(--sub);font-size:13px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:16px}
.prd{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin:0 0 10px;break-inside:avoid;font-size:11.5px}
.prd h3{margin:0 0 4px;font-size:13px}
.prd ul{margin:2px 0 4px;padding-left:18px}
.prd p{margin:2px 0;white-space:pre-wrap}
.prd .lb{font-weight:700;color:#444}
.pchart{display:flex;align-items:flex-end;gap:8px;height:80px;border-bottom:1px solid #999;margin:4px 0 14px;padding:0 6px}
.pchart div{flex:1;text-align:center;font-size:10px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.pchart i{display:block;margin:0 auto;width:60%;background:#12a150}
.ck-app{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.ck-app .fn{font-size:13px;font-weight:700;word-break:break-all}
.ck-app .meta{font-size:11px;color:var(--sub);margin:2px 0 8px}
.lg-app{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#f2f6ff;border:1px solid #d6e2fb;border-radius:8px;padding:6px 8px;margin:4px 0 2px;font-size:12px}
.lg-app b{font-size:12.5px}
.lg-app button{padding:2px 9px;font-size:11.5px}
#appview{position:fixed;inset:0;z-index:150;background:#1b1e24;color:#fff;display:flex;flex-direction:column}
#appview[hidden]{display:none}
.av-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#111318;flex-wrap:wrap}
.av-bar button,.av-bar select{background:#2a2e37;border:1px solid #3a3f4b;color:#fff;border-radius:7px;padding:5px 10px;width:auto}
.av-panes{flex:1;display:flex;gap:28px;justify-content:center;align-items:center;min-height:0;padding:14px}
.av-pane{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.av-pane select{color:#1f2328;background:#fff;width:auto;max-width:90%}
#appview.dock{left:auto;width:min(460px,42vw);border-left:1px solid #333;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
#appview.dock .av-panes{padding:8px}
body.avdock #modal{justify-content:flex-start;padding-right:calc(min(460px,42vw) + 12px)}
.av-pane .lb{font-size:13px;font-weight:700}
.av-pane .lb span{font-weight:400;color:#a9b0bd;margin-left:6px}
.av-frame{background:#0b0c0f;padding:10px;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 2px #2b2f38}
.av-frame.pc{border-radius:10px;padding:6px}
.av-vp{position:relative;overflow:hidden;border-radius:22px;background:#fff}
.av-frame.pc .av-vp{border-radius:3px}
.av-vp iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.av-note{font-size:12px;color:#8a909c;text-align:center;padding:0 0 10px}
@media (max-width:860px){.lg-body{grid-template-columns:1fr}.lg-side{border-left:none;border-top:1px solid var(--line)}}
@media (max-width:860px){.ck-body{grid-template-columns:1fr}.ck-side{border-left:none;border-top:1px solid var(--line)}}
@media (max-width:860px){.ai-body{grid-template-columns:1fr}.ai-form{border-right:none;border-bottom:1px solid var(--line);max-height:45vh}}
table.tl{width:100%;border-collapse:collapse;font-size:12px}
.tl th,.tl td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tl td.task{max-width:260px}
.tl th{color:var(--sub);font-weight:600;background:#f9fafb}
.tl tr.rowc:hover td{background:#f5f8ff;cursor:pointer}
.tl button{padding:2px 8px;font-size:11px}
.help h3{font-size:14px;margin:14px 0 6px}
.help ol,.help ul{margin:0;padding-left:20px}
.help li{margin-bottom:3px}
kbd{background:#f2f4f7;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;font-family:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.show{opacity:1}
.pmdlg{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.pmdlg>div{background:#fff;color:#1f2328;border-radius:14px;max-width:580px;width:100%;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:14px}
.pmdlg h3{margin:0 0 8px;font-size:17px}.pmdlg p{margin:6px 0;line-height:1.6}
.pmdlg .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.pmdlg button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid #c9ced6;background:#fff;cursor:pointer}
.pmdlg button.pri{background:#2f6fed;border-color:#2f6fed;color:#fff}
.pmdlg textarea{width:100%;height:80px;font:12px monospace;margin-top:6px;box-sizing:border-box}
#dlbar{position:fixed;right:16px;bottom:16px;z-index:350;background:#fff8e6;border:1px solid #e8b44a;border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;max-width:92vw;font-size:13px;color:#1f2328}
#dlbar.show{display:flex;gap:10px;align-items:center}
#dlbar button{font:inherit;padding:5px 10px;border-radius:7px;border:1px solid #c9ced6;background:#fff;cursor:pointer}
#frameWarn{position:fixed;left:0;right:0;top:0;z-index:380;background:#fff1e6;border-bottom:2px solid #e8833a;color:#7a3d10;padding:8px 16px;line-height:1.6;font-size:13px;display:flex;gap:10px;align-items:center}
#frameWarn button{margin-left:auto;font:inherit;padding:3px 10px;border-radius:7px;border:1px solid #e8833a;background:#fff;cursor:pointer}
#print{display:none}
#print h1{font-size:20px;margin:0 0 6px}
.pconcept{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin:8px 0 14px;font-size:12px}
.pconcept p{margin:2px 0;white-space:pre-wrap}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{display:flex;gap:10px;border:1px solid #ccc;border-radius:8px;padding:8px;break-inside:avoid;font-size:11px}
.pcard h3{font-size:13px;margin:0 0 4px}
.pcard p{margin:0 0 4px;white-space:pre-wrap}
.phead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:8px}
.pauthor{font-size:14px;font-weight:700;text-align:right}
.pfoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#modal,#toast,#dlbar,#frameWarn,.pmdlg{display:none!important}
  #print{display:block}
  .pfoot{display:block;position:fixed;bottom:0;left:0;right:0;font-size:9px;color:#555;text-align:right;border-top:1px solid #ccc;padding-top:2px;background:#fff}
  .pgrid{padding-bottom:20px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

    <button id="bResults" title="ユーザーテストの記録"><i data-ic="results"></i>結果</button>

        <button id="mOpen"><i data-ic="open"></i>開く（.json / 設計書.md）</button>
        <button id="mPrint"><i data-ic="print"></i>印刷・PDF（画面一覧）</button>
        <button id="mHelp"><i data-ic="help"></i>使い方</button>
      </div>
    </details>
  </header>
  <aside id="left">
    <div class="ph-title">画面 <button id="bAddScr">＋ 追加</button></div>

    <div class="ph-title">パーツ（クリックで追加）</div>
    <div id="tools"></div>

  </main>
  <aside id="right"><div id="props"></div></aside>
</div>

<div id="print"></div>

let lastDL=null;
function download(text,name,type){
  lastDL={text,name,type};
  try{const b=new Blob([text],{type});
    if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(b,name);}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);}

  showDLBar('ファイルが保存されませんでしたか？');

}

  <textarea readonly></textarea>
  <div class="r"><button data-a="cp">内容をコピー</button><button class="pri" data-a="close">閉じる</button></div>`);

function renderEl(el,mode){
  const d=document.createElement('div');d.className='el t-'+el.type;
  const st=d.style;st.left=el.x+'px';st.top=el.y+'px';st.width=el.w+'px';st.height=el.h+'px';
  st.background=el.fill||'transparent';st.border=el.stroke?`${el.strokeW}px solid ${el.stroke}`:'none';
  st.borderRadius=el.type==='ellipse'?'50%':el.radius+'px';st.color=el.color;st.fontSize=el.fontSize+'px';st.fontWeight=el.bold?'700':'400';
  st.justifyContent={left:'flex-start',center:'center',right:'flex-end'}[el.align]||'center';st.textAlign=el.align;
  const tx=()=>{const sp=document.createElement('span');sp.className='tx';sp.textContent=el.text;return sp;};
  if(el.type==='image'){
    if(el.src){const im=new Image();im.src=el.src;im.draggable=false;d.appendChild(im);}
    else{d.classList.add('ph');d.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0L100,100M100,0L0,100" stroke="#b8bec8" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';d.appendChild(tx());}
  }else if(el.type==='input'&&mode==='preview'){const i=document.createElement('input');i.placeholder=el.text;d.appendChild(i);}
  else d.appendChild(tx());
  return d;
}
function thumb(s,w,maxH){
  const W=devW(),H=sH(s),k=w/W;const box=document.createElement('div');box.className='thumb';
  box.style.width=w+'px';box.style.height=Math.round(Math.min(H*k,maxH||1e9))+'px';
  const inner=document.createElement('div');inner.className='screen';
  inner.style.cssText=`width:${W}px;height:${H}px;transform:scale(${k});transform-origin:0 0;background-color:${s.bg}`;
  s.els.forEach(el=>inner.appendChild(renderEl(el,'thumb')));box.appendChild(inner);return box;
}

function startDrag(e,mode,hk){
  const b=snapshot(),orig={};sel.forEach(id=>{const el=E(id);if(el)orig[id]={x:el.x,y:el.y,w:el.w,h:el.h};});
  const sx=e.clientX,sy=e.clientY,single=sel.length===1;
  const sn=(v,ev)=>(P.grid&&!ev.altKey)?Math.round(v/8)*8:Math.round(v);
  const mv=ev=>{const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
    if(mode==='move'){sel.forEach(id=>{const el=E(id),o=orig[id];if(!el||!o)return;if(single){el.x=sn(o.x+dx,ev);el.y=sn(o.y+dy,ev);}else{el.x=o.x+sn(dx,ev);el.y=o.y+sn(dy,ev);}});}
    else{const el=E(sel[0]),o=orig[sel[0]];if(!el)return;let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
      if(hk.includes('w'))x1=Math.min(sn(o.x+dx,ev),x2-4);if(hk.includes('e'))x2=Math.max(sn(o.x+o.w+dx,ev),x1+4);

/* ---------- 遷移の解析 ---------- */
function outs(id){const s=S(id);if(!s)return[];return[...new Set(s.els.filter(e=>e.link&&e.link!=='__back'&&S(e.link)&&e.link!==id).map(e=>e.link))];}
function reachable(){const r=new Set([P.start]),q=[P.start];while(q.length)outs(q.shift()).forEach(t=>{if(!r.has(t)){r.add(t);q.push(t);}});return r;}
function shortest(a,b){if(a===b)return 0;const d={[a]:0},q=[a];while(q.length){const id=q.shift();for(const t of outs(id))if(d[t]===undefined){d[t]=d[id]+1;if(t===b)return d[t];q.push(t);}}return null;}
function edges(){const m=new Map();P.screens.forEach(s=>s.els.forEach(e=>{if(e.link&&e.link!=='__back'&&S(e.link)&&e.link!==s.id){const k=s.id+'>'+e.link;if(!m.has(k))m.set(k,{from:s.id,to:e.link,labels:[]});m.get(k).labels.push((e.text||TYPE_JA[e.type]).split('\n').join(' ').slice(0,12));}}));return[...m.values()];}
function designChecks(){
  const res=[],reach=reachable(),touch=P.device!=='pc';
  if(!P.author.name.trim())res.push({lv:'info',act:'concept',msg:'企画の「氏名」が未入力です。ここをクリックして入力しましょう。'});
  if(!P.concept.target.trim()||!P.concept.problem.trim())res.push({lv:'info',act:'concept',msg:'企画メモ（だれの・どんな困りごと）が未記入です。ここをクリックして書きましょう。'});
  P.screens.forEach(s=>{
    if(!reach.has(s.id))res.push({sid:s.id,lv:'warn',msg:`「${s.name}」はスタート画面からたどり着けません。どこかの部品からリンクしましょう。`});
    const hasOut=s.els.some(e=>e.link&&(e.link==='__back'||S(e.link)));
    if(!hasOut&&P.screens.length>1)res.push({sid:s.id,lv:'warn',msg:`「${s.name}」は行き止まりです。次へ進む・戻る手段を用意しましょう（ゴールの画面なら問題ありません）。`});
    const dead=s.els.filter(e=>e.type==='button'&&!e.link);
    if(dead.length)res.push({sid:s.id,eid:dead[0].id,lv:'info',msg:`「${s.name}」に、押しても何も起きないボタンが${dead.length}個あります。`});
    if(touch){const sm=s.els.filter(e=>e.link&&Math.min(e.w,e.h)<44);if(sm.length)res.push({sid:s.id,eid:sm[0].id,lv:'info',msg:`「${s.name}」に、指で押すには小さい部品が${sm.length}個あります（目安は縦横44以上）。`});}
    const tiny=s.els.filter(e=>e.text&&e.type!=='image'&&e.fontSize<12);
    if(tiny.length)res.push({sid:s.id,eid:tiny[0].id,lv:'info',msg:`「${s.name}」に、文字が小さすぎる部品があります（12未満）。`});
    if(!s.purpose.trim())res.push({sid:s.id,lv:'info',msg:`「${s.name}」の「この画面の目的」が未記入です。`});
  });
  return res;
}

const AI_FIELDS=[
  ['states','状態（うまくいかないとき・場合分け）','例：\n・課題が1件もないとき：「まだ課題がありません」と表示し、追加ボタンを大きく出す\n・課題名が空のまま「登録する」を押したとき：入力欄の下に赤字で「課題名を入れてください」\n・締切を過ぎた課題：一覧の下にまとめて灰色で表示'],
  ['data','扱うデータ（項目・種類・保存場所）','例：\n課題1件＝課題名（文字列・必須）、締切日（日付・必須）、メモ（文字列・任意）、終わったか（はい/いいえ）\n保存場所：その端末のブラウザの中（localStorage）。他の人とは共有しない'],
  ['env','動かす環境と作り方','例：スマホのブラウザで使う。HTML・CSS・JavaScriptの1つのファイルで作る。インターネットにつながっていなくても使える'],
  ['extra','その他の要望・AIへの注意','例：コードには日本語で説明のコメントを付けてほしい']

function aiText(t){return String(t||'').replace(/\s*\n\s*/g,' ').trim();}
function aiPos(el,s,box){
  const W=devW(),H=sH(s);
  const hz=(x,w,BX,BW)=>{if(el.type==='text'&&el.w>=BW*.5)return {left:'左寄せ',center:'中央',right:'右寄せ'}[el.align]||'中央';const c=(x+w/2-BX)/BW;return w>=BW*.8?'横幅いっぱい':c<.34?'左寄り':c<.67?'中央':'右寄り';};
  if(box)return hz(el.x,el.w,box.x,box.w);
  const cy=(el.y+el.h/2)/H;
  if(el.fix==='top')return '画面上部に固定';if(el.fix==='bottom')return '画面下部に固定';
  const v=cy<.2?'上部':cy<.4?'上の方':cy<.6?'中ほど':cy<.8?'下の方':'下部';
  return v+'・'+hz(el.x,el.w,0,W);
}
function aiLabel(el,s){
  const t=aiText(el.text);if(t)return t;
  const txt=s.els.filter(e=>e!==el&&e.text&&e.x>=el.x-1&&e.y>=el.y-1&&e.x+e.w<=el.x+el.w+1&&e.y+e.h<=el.y+el.h+1).sort((a,b)=>a.y-b.y||a.x-b.x)[0];
  return txt?aiText(txt.text):'';
}
function aiName(el,s){
  const t=aiText(el.text),W=devW();
  if(el.type==='rect'&&!t){
    if(el.fix==='top'&&el.w>=W*.9)return 'ヘッダー（画面上部の帯）';
    if(el.fix==='bottom'&&el.w>=W*.9)return 'タブバー（画面下部の帯）';
    const l=aiLabel(el,s);return l?`「${l}」のまとまり（カード）`:'枠（まとまり）';
  }
  if(el.type==='rect'&&el.link)return `押せる文字「${t}」`;
  return null;
}
function aiDesc(el,s,box){
  const t=aiText(el.text);let d=aiName(el,s);if(!d)
  switch(el.type){
    case'button':d=`ボタン「${t}」`;break;
    case'input':d=`入力欄（薄い文字「${t}」）`;break;
    case'text':d=`テキスト「${t}」`;break;
    case'image':d=el.src?`画像${t?`（${t}）`:''}`:`画像を置く場所${t?`（${t}）`:''}`;break;
    case'ellipse':d=t?`円「${t}」`:'円';break;
    default:d=`四角形「${t}」`;
  }
  if(el.type==='text'&&el.fontSize>=20&&[...t].length>1)d+='（見出し）';
  const parts=[aiPos(el,s,box)];
  if(el.link==='__back')parts.push(`押すと前の画面に戻る（${TRANS[el.trans]||'横にスライド'}）`);
  else if(el.link&&S(el.link))parts.push(`押すと「${S(el.link).name}」へ移動（${TRANS[el.trans]||'横にスライド'}）`);
  if(el.note&&el.note.trim())parts.push('設計メモ：'+aiText(el.note));
  return `${d} — ${parts.join('／')}`;
}
function aiTree(s){
  const els=s.els,W=devW(),H=sH(s);
  const keep=el=>!(['rect','ellipse'].includes(el.type)&&!aiText(el.text)&&!el.link&&!(el.note||'').trim());
  const isBox=el=>el.type==='rect'&&el.w*el.h<W*H*.9;
  const inside=(a,b)=>a!==b&&a.x>=b.x-1&&a.y>=b.y-1&&a.x+a.w<=b.x+b.w+1&&a.y+a.h<=b.y+b.h+1&&a.w*a.h<b.w*b.h;
  const par=new Map();
  els.forEach((el,i)=>{let best=null;els.forEach((b,j)=>{if(j<i&&isBox(b)&&inside(el,b)&&(!best||b.w*b.h<best.w*best.h))best=b;});if(best)par.set(el.id,best.id);});
  const kids=id=>els.filter(e=>par.get(e.id)===id);
  const order=a=>a.slice().sort((p,q)=>(Math.abs(p.y-q.y)<12?p.x-q.x:p.y-q.y));
  const lines=[];
  const byId=id=>els.find(e=>e.id===id);
  const walk=(list,depth,box)=>order(list).forEach(el=>{
    const ch=kids(el.id),show=keep(el)||ch.some(c=>keep(c)||kids(c.id).length);
    if(!show)return;
    lines.push('  '.repeat(depth)+'- '+aiDesc(el,s,box));walk(ch,depth+1,el);
  });
  walk(els.filter(e=>!par.has(e.id)),0,null);
  return lines;
}

  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return top?top[0]:null;
}

/* ---------- 設計書（.md）から読み込む ---------- */
function parseAIMarkdown(md){
  md=String(md).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const lines=md.split('\n');
  const h1=lines.find(l=>/^#\s+アプリ設計書[：:]/.test(l));
  if(!h1)throw new Error('notmd');
  const p=newProject();p.screens=[];p.map={};
  p.name=h1.replace(/^#\s+アプリ設計書[：:]\s*/,'').trim()||'無題';
  const blank=v=>{v=String(v||'').trim();return /^（未記入）$/.test(v)?'':v;};
  // 大見出しごとに分ける
  const sec={};let curH=null;
  lines.forEach(l=>{const m=l.match(/^##\s+(.+?)\s*$/);if(m&&!l.startsWith('###')){curH=m[1];sec[curH]=[];return;}if(curH)sec[curH].push(l);});
  const body=k=>{const key=Object.keys(sec).find(x=>x.startsWith(k));return key?sec[key]:null;};
  const text=k=>{const b=body(k);return b?blank(b.join('\n').trim()):'';};
  // 作成者
  const au=lines.find(l=>/^作成者[：:]/.test(l));
  if(au){let s=au.replace(/^作成者[：:]\s*/,'').trim();const c=s.match(/^(\d年\d+組)\s*/);if(c){p.author.cls=c[1];s=s.slice(c[0].length);}
    const n=s.match(/^(\d+)番\s*/);if(n){p.author.no=n[1];s=s.slice(n[0].length);}p.author.name=s.trim();}
  // 端末
  const req=(body('AIへのお願い')||[]).join('\n'),look=(body('見た目')||[]).join('\n');
  const dk=Object.keys(DEVICES).find(k=>req.includes(DEVICES[k].label+'（')||look.includes('対象の端末：'+DEVICES[k].label));
  p.device=dk||'phone';
  const W=DEVICES[p.device].w,DH=DEVICES[p.device].h;
  // 企画
  const kb=body('企画')||[];let inF=false;const feats=[];
  kb.forEach(l=>{let m;
    if((m=l.match(/^-\s*だれのためのアプリか[：:]\s*(.*)$/))){p.concept.target=blank(m[1]);inF=false;}
    else if((m=l.match(/^-\s*解決する困りごと[：:]\s*(.*)$/))){p.concept.problem=blank(m[1]);inF=false;}
    else if(/^-\s*主な機能[：:]/.test(l)){inF=true;const r=l.replace(/^-\s*主な機能[：:]\s*/,'');if(blank(r))feats.push(r.trim());}
    else if(inF&&(m=l.match(/^\s+-\s+(.*)$/))){if(blank(m[1]))feats.push(m[1].trim());}
  });
  p.concept.features=feats.map(x=>'・'+x).join('\n');
  // 設計
  p.spec.states=text('状態');p.spec.data=text('扱うデータ');p.spec.env=text('動かす環境');p.spec.extra=text('その他の要望');
  // 画面一覧（目的のもと）
  const rows=(body('画面一覧')||[]).filter(l=>/^\|/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim())).filter(r=>r.length>=3&&/^\d+$/.test(r[0]));
  const stripStart=n=>n.replace(/（スタート画面）\s*$/,'').trim();
  // 各画面
  const detail=body('各画面のくわしい内容')||[];
  const blocks=[];let b=null;

  m.querySelector('#ckStat').innerHTML=`<div class="ck-stat"><div><b style="color:var(--ok)">${ok}</b><span>OK</span></div><div><b style="color:var(--danger)">${ng}</b><span>ちがう</span></div><div><b>${rest}</b><span>未確認</span></div></div>
    <div class="ck-prog"><i style="width:${ok/n*100}%;background:var(--ok)"></i><i style="width:${ng/n*100}%;background:var(--danger)"></i></div>`;
  const fp=buildFixPrompt(items);
  m.querySelector('#ckFix').textContent=fp||(rest?'「× ちがう」を付けた項目や「その他、気づいたこと」があると、ここにAIへの修正依頼文ができます。':'すべてOKです。設計どおりのアプリができました。次はユーザーテストで、利用者にとって使いやすいかを確かめましょう。');
  m.querySelector('[data-a=fixcopy]').disabled=!fp;
}


/* ---------- アプリの版 ---------- */
const kb=n=>n<1024?n+'B':(n/1024).toFixed(n<10240?1:0)+'KB';
function appSize(h){return new Blob([h]).size;}
function appVersions(){
  const v=[];P.log.forEach((r,i)=>{if(r.app)v.push({id:r.id,label:`第${i+1}回の版`,name:r.app.name,html:r.app.html,date:r.date});});
  if(P.appCur&&!(v.length&&v[v.length-1].html===P.appCur.html))v.push({id:'cur',label:'確認中のファイル',name:P.appCur.name,html:P.appCur.html});
  return v;
}
function appShim(html){
  const shim=`<script>(function(){function M(){var d={};return{getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[String(k)]=String(v)},removeItem:function(k){delete d[String(k)]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}
['localStorage','sessionStorage'].forEach(function(n){try{window[n].length}catch(e){try{Object.defineProperty(window,n,{value:M(),configurable:true})}catch(_){}}});})();<\/script>`;
  if(/<head[^>]*>/i.test(html))return html.replace(/<head[^>]*>/i,m=>m+shim);
  if(/<html[^>]*>/i.test(html))return html.replace(/<html[^>]*>/i,m=>m+shim);
  return shim+html;
}
function openAppViewer(ids,dock){
  const vers=appVersions();if(!vers.length){toast('読み込まれたアプリがありません');return;}
  const av=$('#appview');let sel=ids&&ids.length?ids.filter(id=>vers.some(v=>v.id===id)):[vers[vers.length-1].id];if(!sel.length)sel=[vers[vers.length-1].id];
  const opts=cur=>vers.map(v=>`<option value="${v.id}"${v.id===cur?' selected':''}>${esc(v.label)}（${esc(v.name)}）</option>`).join('');
  const close=()=>{av.hidden=true;av.innerHTML='';av.classList.remove('dock');document.body.classList.remove('avdock');window.removeEventListener('resize',draw);};
  const draw=()=>{
    if(av.hidden)return;
    av.classList.toggle('dock',!!dock);document.body.classList.toggle('avdock',!!dock);if(dock&&sel.length>1)sel=[sel[sel.length-1]];
    av.innerHTML=dock?`<div class="av-bar"><b>アプリを動かす</b><div class="grow"></div><button data-av="reload">${ico('reload')}最初から</button><button data-av="big">${ico('expand')}大きく</button><button data-av="close" title="閉じる">${ico('close','solo')}</button></div>
      <div class="av-panes">${sel.map((id,i)=>`<div class="av-pane"><div class="av-frame${P.device==='pc'?' pc':''}"><div class="av-vp"><iframe sandbox="allow-scripts allow-forms allow-modals" title="アプリ"></iframe></div></div></div>`).join('')}</div>
      <div class="av-note">左のチェックリストを見ながら操作できます。<br>ここで入力したデータは、閉じると消えます。</div>`
    :`<div class="av-bar"><b>アプリを動かす</b><span style="color:#a9b0bd;font-size:12px">${sel.length>1?'左右で版を比べています':''}</span><div class="grow"></div>
      ${sel.length>1?'':`<button data-av="cmp"${vers.length<2?' disabled':''}>${ico('compare')}別の版と並べる</button>`}${sel.length>1?'<button data-av="one">1つだけ表示</button>':''}<button data-av="reload">${ico('reload')}最初から</button><button data-av="close">${ico('close')}閉じる</button></div>
      <div class="av-panes">${sel.map((id,i)=>`<div class="av-pane"><select data-pane="${i}">${opts(id)}</select><div class="av-frame${P.device==='pc'?' pc':''}"><div class="av-vp"><iframe sandbox="allow-scripts allow-forms allow-modals" title="アプリ"></iframe></div></div></div>`).join('')}</div>
      <div class="av-note">プロトメーカーの中で動かしています。ここで入力したデータは、閉じると消えます。</div>`;
    const panes=av.querySelector('.av-panes'),W=devW(),H=devH(),pad=P.device==='pc'?12:20;
    const k=Math.min(1,(panes.clientWidth/sel.length-40-pad)/W,(panes.clientHeight-50-pad)/H);
    av.querySelectorAll('.av-pane').forEach((p,i)=>{const v=vers.find(x=>x.id===sel[i])||vers[vers.length-1],vp=p.querySelector('.av-vp'),fr=p.querySelector('iframe');
      vp.style.width=Math.round(W*k)+'px';vp.style.height=Math.round(H*k)+'px';fr.style.width=W+'px';fr.style.height=H+'px';fr.style.transform=`scale(${k})`;fr.srcdoc=appShim(v.html);
      const se=p.querySelector('select');if(se)se.onchange=e=>{sel[i]=e.target.value;draw();};});
    av.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{const a=b.dataset.av;
      if(a==='close')close();
      if(a==='big'){dock=false;draw();}
      if(a==='reload')draw();
      if(a==='one'){sel=[sel[sel.length-1]];draw();}
      if(a==='cmp'){const o=vers.filter(v=>v.id!==sel[0]);sel=[o.length?(vers.findIndex(v=>v.id===sel[0])>0?vers[vers.findIndex(v=>v.id===sel[0])-1].id:o[0].id):sel[0],sel[0]];draw();}});
  };
  av.hidden=false;window.addEventListener('resize',draw);draw();
}
function loadAppFile(f,m){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const html=String(r.result);
    if(!/<(html|body|script|div|!doctype)/i.test(html)){alert('HTMLファイルとして読み込めませんでした。AIが作った .html ファイルを選んでください。');return;}
    const sz=appSize(html);if(sz>1.5*1024*1024&&!confirm(`このファイルは${kb(sz)}あり、作品のファイルが大きくなります。読み込みますか？`))return;
    P.appCur={name:f.name,html,size:sz,loaded:new Date().toISOString()};renderCkApp(m);toast(`「${f.name}」を読み込みました`);};
  r.readAsText(f);
}
function renderCkApp(m){
  const box=m.querySelector('#ckApp'),a=P.appCur;
  box.innerHTML=a?`<div class="ck-app"><div class="fn">${ico('file')}${esc(a.name)}</div><div class="meta">${kb(a.size||appSize(a.html))}・${fmtDate(a.loaded||new Date().toISOString())}に読み込み</div><div class="btns"><button class="primary" data-a="appopen">${ico('play')}動かして確認する</button><button data-a="appload">別のファイルにする</button></div></div>`
    :`<div class="ck-app"><div class="meta" style="margin-top:0">AIが作った .html ファイルを読み込むと、ここで動かしながら確認でき、記録するときにその版が保存されます。</div><button class="primary" data-a="appload">${ico('open')}HTMLファイルを読み込む</button></div>`;
  $('#fApp').onchange=e=>{loadAppFile(e.target.files[0],m);e.target.value='';};
  box.querySelectorAll('[data-a=appload]').forEach(b=>b.onclick=()=>$('#fApp').click());
  const o=box.querySelector('[data-a=appopen]');if(o)o.onclick=()=>openAppViewer(['cur'],true);
}

/* ---------- 改良の記録 ---------- */
function recordCheck(m){
  const items=checkItems(),ok=items.filter(i=>ckGet(i.key).st==='ok'),ng=items.filter(i=>ckGet(i.key).st==='ng');
  if(!ok.length&&!ng.length&&!(P.checkNote||'').trim()){toast('チェックを付けるか、気づいたことを書いてから記録してください');return;}
  const lastApp=[...P.log].reverse().find(r=>r.app);
  if(!P.appCur){if(!confirm('確認したアプリのHTMLファイルが読み込まれていません。\nこのまま記録すると、この回のアプリの版は保存されません。記録しますか？'))return;}
  else if(lastApp&&lastApp.app.html===P.appCur.html){if(!confirm(`読み込まれているファイルは、前回記録した版と同じ内容です。\nAIに直してもらった新しいファイルを読み込みましたか？\n\n「OK」でこのまま記録、「キャンセル」で戻ります。`))return;}
  P.log.push({id:uid(),date:new Date().toISOString(),total:items.length,ok:ok.length,ng:ng.length,
    ngItems:ng.map(i=>({cat:i.cat,text:i.text,note:ckGet(i.key).note||''})),app:P.appCur?{name:P.appCur.name,html:P.appCur.html,size:P.appCur.size||appSize(P.appCur.html)}:null,other:(P.checkNote||'').trim(),prompt:buildFixPrompt(items),reflect:''});
  const n=P.log.length;
  if(confirm(`第${n}回の確認として記録しました${P.appCur?`（アプリの版「${P.appCur.name}」も保存）`:''}。\n\nAIに直してもらったあと、もう一度確認できるように、チェックと「気づいたこと」を空にしますか？\n（「キャンセル」を押すと、そのまま残します）`)){P.check={};P.checkNote='';P.appCur=null;m.querySelector('#ckOther').value='';renderCkApp(m);}
  renderCheck(m);toast(`「③ 改良の記録」に第${n}回として追加しました`);
}

    ${r.app?`<div class="lg-app">${ico('file','solo')}<b>${esc(r.app.name)}</b><span style="color:var(--sub)">${kb(r.app.size||appSize(r.app.html))}</span><div class="grow"></div><button data-run>${ico('play','sm')}動かす</button>${i>0&&P.log.slice(0,i).some(x=>x.app)?`<button data-cmp>${ico('compare','sm')}前の版と比べる</button>`:''}<button data-dl>${ico('download','sm')}ファイルを書き出す</button></div>`:'<div class="lg-app" style="background:#f7f8fa;border-color:var(--line);color:var(--sub)">この回のアプリの版は保存されていません</div>'}

    ${r.ngItems.length?`<div class="lg-sec">設計とちがった点</div><ul>${r.ngItems.map(x=>`<li>【${esc(x.cat)}】${esc(x.text)}${x.note?`<br><span style="color:var(--sub)">→ 実際は：${esc(x.note)}</span>`:''}</li>`).join('')}</ul>`:''}

  L.querySelectorAll('.lg-card').forEach(c=>{const r=P.log.find(x=>x.id===c.dataset.id);
    c.querySelector('[data-ref]').addEventListener('input',e=>{r.reflect=e.target.value;});

    const dl=c.querySelector('[data-dl]');if(dl)dl.onclick=()=>{download(r.app.html,r.app.name.replace(/\.html?$/i,'')+`_第${P.log.indexOf(r)+1}回.html`,'text/html');toast('書き出しました（ダウンロードフォルダを確認）');};
    const cp=c.querySelector('[data-cmp]');if(cp)cp.onclick=()=>{const prev=[...P.log.slice(0,P.log.indexOf(r))].reverse().find(x=>x.app);openAppViewer([prev.id,r.id]);};
    c.querySelector('[data-del]').onclick=()=>{if(confirm('この回の記録を削除しますか？')){P.log=P.log.filter(x=>x!==r);renderLog(m);}};});
  m.querySelector('#lgChart').innerHTML=P.log.length?`<div class="lg-chart">${P.log.map((r,i)=>{const p=r.total?Math.round(r.ok/r.total*100):0;return `<div><span>${p}%</span><i style="height:${Math.max(2,p*.6)}px"></i><span>第${i+1}回</span></div>`;}).join('')}</div>`:'<div class="hint" style="margin:0">記録が増えると、ここに変化が表示されます。</div>';
}
function buildLogMarkdown(){
  const L=[`# 改良の記録：${P.name||'無題のアプリ'}`,''];const as=authorStr();if(as)L.push(`作成者：${as}`,'');
  L.push('## 企画','',`- だれのため：${aiText(P.concept.target)||'（未記入）'}`,`- 困りごと：${aiText(P.concept.problem)||'（未記入）'}`,'');
  L.push('## 確認の経過','','| 回 | 日時 | OK | ちがう | 未確認 |','| --- | --- | --- | --- | --- |');
  P.log.forEach((r,i)=>L.push(`| 第${i+1}回 | ${fmtDate(r.date)} | ${r.ok}/${r.total} | ${r.ng} | ${r.total-r.ok-r.ng} |`));
  P.log.forEach((r,i)=>{L.push('',`## 第${i+1}回の確認（${fmtDate(r.date)}）`,'');
    if(r.ngItems.length){L.push('設計とちがった点：');r.ngItems.forEach(x=>L.push(`- 【${x.cat}】${x.text}${x.note?`（実際は：${aiText(x.note)}）`:''}`));L.push('');}
    if(r.other)L.push('その他、気づいたこと：',r.other,'');
    if(r.app)L.push(`確認したアプリ：${r.app.name}`,'');
    L.push('振り返り：',(r.reflect||'').trim()||'（未記入）');});
  const T=P.tests;if(T.length){const g=T.filter(t=>t.success!==null);L.push('','## ユーザーテスト','',`- テスト回数：${T.length}回`,`- ゴール到達率：${g.length?Math.round(g.filter(t=>t.success).length/g.length*100)+'%':'—'}`);}
  L.push('','## 全体のまとめ','',(P.logSummary||'').trim()||'（未記入）');
  return L.join('\n');
}

const NW=170;
function autoLayout(){
  const lv={[P.start]:0},q=[P.start];while(q.length){const id=q.shift();outs(id).forEach(t=>{if(lv[t]===undefined){lv[t]=lv[id]+1;q.push(t);}});}
  let maxL=0;Object.values(lv).forEach(l=>maxL=Math.max(maxL,l));const cols={};
  P.screens.forEach(s=>{const l=lv[s.id]===undefined?maxL+1:lv[s.id];(cols[l]=cols[l]||[]).push(s.id);});
  const nh=34+Math.min(Math.round((NW-12)*devH()/devW()),240),res={};
  Object.entries(cols).forEach(([l,ids])=>ids.forEach((id,i)=>res[id]={x:40+(+l)*(NW+140),y:40+i*(nh+60)}));return res;
}

function drawMap(m){
  const cv=m.querySelector('.mp-canvas');cv.querySelectorAll('.node').forEach(n=>n.remove());
  P.screens.forEach((s,i)=>{const p=P.map[s.id];const n=document.createElement('div');
    n.className='node'+(s.id===cur?' cur':'')+(s.id===P.start?' start':'');n.style.left=p.x+'px';n.style.top=p.y+'px';n.style.width=NW+'px';n.dataset.id=s.id;
    n.innerHTML=`<div class="nh">${s.id===P.start?ico('flag','sm'):''}${i+1}. ${esc(s.name)}</div>`;n.appendChild(thumb(s,NW-12,240));
    n.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();if(cur!==s.id){cur=s.id;sel=[];renderScreens();renderProps();m.querySelectorAll('.node').forEach(x=>x.classList.toggle('cur',x.dataset.id===s.id));}const b=snapshot(),ox=p.x,oy=p.y,sx=e.clientX,sy=e.clientY;n.setPointerCapture(e.pointerId);n.style.cursor='grabbing';
      n.onpointermove=ev=>{p.x=Math.max(0,Math.round(ox+ev.clientX-sx));p.y=Math.max(0,Math.round(oy+ev.clientY-sy));n.style.left=p.x+'px';n.style.top=p.y+'px';drawEdges(m);};
      n.onpointerup=()=>{n.onpointermove=null;n.onpointerup=null;n.style.cursor='';commit(b);};});
    n.addEventListener('dblclick',()=>{cur=s.id;setView('single');});cv.appendChild(n);});
  drawEdges(m);

function drawEdges(m){
  const cv=m.querySelector('.mp-canvas'),svg=m.querySelector('.mp-svg'),box={};let mw=0,mh=0;
  cv.querySelectorAll('.node').forEach(n=>{const p=P.map[n.dataset.id];box[n.dataset.id]={x:p.x,y:p.y,w:n.offsetWidth,h:n.offsetHeight};mw=Math.max(mw,p.x+n.offsetWidth);mh=Math.max(mh,p.y+n.offsetHeight);});
  const W=mw+200,H=mh+200;cv.style.width=W+'px';cv.style.height=H+'px';svg.setAttribute('width',W);svg.setAttribute('height',H);
  let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f6fed"/></marker></defs>';
  edges().forEach(ed=>{const a=box[ed.from],b=box[ed.to];if(!a||!b)return;const off=ed.from<ed.to?-8:8,acx=a.x+a.w/2,bcx=b.x+b.w/2;
    const y1=a.y+a.h/2+off,y2=b.y+b.h/2+off;let x1,x2,c1,c2;
    if(Math.abs(acx-bcx)<a.w*.6){x1=a.x+a.w;x2=b.x+b.w;const d=60+Math.abs(y2-y1)*.15;c1=x1+d;c2=x2+d;}
    else if(bcx>acx){x1=a.x+a.w;x2=b.x;const d=Math.max(40,(x2-x1)*.45);c1=x1+d;c2=x2-d;}
    else{x1=a.x;x2=b.x+b.w;const d=Math.max(40,(x1-x2)*.45);c1=x1-d;c2=x2+d;}
    h+=`<path d="M${x1},${y1} C${c1},${y1} ${c2},${y2} ${x2},${y2}" fill="none" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#ah)" opacity=".85"/>`;
    const mx=(x1+3*c1+3*c2+x2)/8,my=(y1+y2)/2,l=[...new Set(ed.labels)].join('／');
    h+=`<text class="edge-lbl" x="${mx}" y="${my-5}" text-anchor="middle">${esc(l.length>20?l.slice(0,20)+'…':l)}</text>`;});
  svg.innerHTML=h;
}

  $('#fOpen').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const txt=String(r.result).replace(/^\uFEFF/,'');let info=null;
      try{if(/^\s*[\{\[]/.test(txt))P=norm(JSON.parse(txt));else{const res=parseAIMarkdown(txt);P=norm(res.p);info=res.info;}
        undoS=[];redoS=[];cur=P.start;sel=[];LAY=null;saveLocal();renderAll();fit();if(info)showMdImportResult(info);else toast('読み込みました');}
      catch(err){console.error(err);alert('ファイルを読み込めませんでした。\nこのツールで保存した .json ファイルか、「AIで作る」で書き出した設計書（.md）を選んでください。');}};
    r.readAsText(f);e.target.value='';};
  $('#bAddScr').onclick=addScreen;
  $('#zOut').onclick=()=>setZoom(zoom/1.2);$('#zIn').onclick=()=>setZoom(zoom*1.2);$('#zFit').onclick=fitAll;
  const st=$('#stage');
  st.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1));}},{passive:false});
  st.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;if(editingId&&e.target.closest('[contenteditable]'))return;
    const hd=e.target.closest('.hd'),lh=e.target.closest('.lh'),ft=e.target.closest('.ftitle'),elD=e.target.closest('.el'),scD=e.target.closest('.scrn');
    const id=elD&&elD.dataset.id,sid=scD&&scD.dataset.sid;
    if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
    e.preventDefault();
    const wh=e.target.closest('.whit');
    if(wh){const t=wh.dataset.sid,eid=wh.dataset.eid;if(S(t)&&S(t).els.some(q=>q.id===eid)){if(cur!==t){cur=t;renderScreens();}sel=[eid];renderOverlay();renderProps();startLinkDrag(e);return;}}
    if(lh&&sel.length===1){startLinkDrag(e);return;}
    if(hd&&sel.length===1){startDrag(e,'resize',hd.dataset.h);return;}
    const switchTo=t=>{if(t&&t!==cur){cur=t;sel=[];renderScreens();renderOverlay();renderProps();}};
    if(ft){switchTo(ft.dataset.sid);if(sel.length){sel=[];renderOverlay();renderProps();}startScreenDrag(e,ft.dataset.sid);return;}
    switchTo(sid);
    if(id&&E(id)){
      if(e.shiftKey){sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];renderOverlay();renderProps();if(!sel.includes(id))return;}
      else if(!sel.includes(id)){sel=[id];renderOverlay();renderProps();}
      startDrag(e,'move');return;}
    if(sid&&view!=='single'&&!e.shiftKey){if(sel.length){sel=[];renderOverlay();renderProps();}startScreenDrag(e,sid);return;}
    startMarquee(e);
  });
  $('#world').addEventListener('dblclick',e=>{const d=e.target.closest('.el');if(!d)return;const el=E(d.dataset.id);if(!el)return;if(el.type==='image'){pickImage(el.id);return;}startEdit(el,d);});
  st.addEventListener('dragover',e=>e.preventDefault());
  st.addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(!f)return;const r=$('#wrap').getBoundingClientRect();
    const n=document.elementFromPoint(e.clientX,e.clientY),sc=n&&n.closest('.scrn');if(sc&&sc.dataset.sid!==cur){cur=sc.dataset.sid;sel=[];}
    const O=OF(cur),cx=(e.clientX-r.left)/zoom-O.x,cy=(e.clientY-r.top)/zoom-O.y;readImage(f,(u,w,h)=>addImageEl(u,w,h,cx,cy));});
  document.addEventListener('paste',e=>{if(!$('#modal').hidden)return;const t=e.target;if((t.matches&&t.matches('input,textarea,select'))||t.isContentEditable)return;
    const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(f=>f.type.startsWith('image/'));e.preventDefault();
    if(f)readImage(f,(u,w,h)=>addImageEl(u,w,h,devW()/2,200));else paste();});
  document.addEventListener('keydown',e=>{
    if(!$('#appview').hidden&&!$('#appview').classList.contains('dock')){if(e.key==='Escape'){const b=$('#appview [data-av=close]');if(b)b.click();}return;}
    if(!$('#modal').hidden){if(e.key==='Escape'){if(pv&&pv.test&&!pv.done)return;closeModal();}return;}
    const t=e.target;if((t.matches&&t.matches('input,textarea,select'))||t.isContentEditable)return;
    const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(mod&&k==='y'){e.preventDefault();redo();return;}
    if(mod&&k==='c'){copySel();return;}
    if(mod&&k==='v')return;
    if(mod&&k==='d'){e.preventDefault();dup();return;}
    if(mod&&k==='a'){e.preventDefault();sel=curS().els.map(x=>x.id);renderOverlay();renderProps();return;}
    if(mod&&k==='s'){e.preventDefault();saveFile();return;}
    if(e.key==='Delete'||e.key==='Backspace'){if(sel.length){e.preventDefault();delSel();}return;}
    if(e.key==='Escape'){sel=[];renderOverlay();renderProps();return;}
    if(e.key==='Enter'&&sel.length===1){const el=E(sel[0]),d=$('#world').querySelector(`[data-id="${el.id}"]`);if(d&&el.type!=='image'){e.preventDefault();startEdit(el,d);}return;}
    const ar={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k];
    if(ar&&sel.length){e.preventDefault();const s=e.shiftKey?8:1;change(()=>sel.map(E).filter(Boolean).forEach(el=>{el.x+=ar[0]*s;el.y+=ar[1]*s;}));}
  });
}

let first=false;
try{const s=localStorage.getItem(LS);if(s)P=norm(JSON.parse(s));}catch(e){P=null;}
if(!P){P=newProject();first=true;}
hydrateIcons();cur=P.start;renderTools();wire();renderAll();requestAnimationFrame(fit);

$('#dlbar [data-a=x]').onclick=()=>{$('#dlbar').classList.remove('show');$('#dlbar').dataset.mode='';};
if(IN_FRAME){const w=document.createElement('div');w.id='frameWarn';w.innerHTML='<span><b>プレビュー画面の中で開かれています。</b>この状態では保存や印刷ができないことがあります。ファイルをいったんパソコンに保存してから、ChromeやEdgeで直接開いてください。</span><button>閉じる</button>';w.querySelector('button').onclick=()=>w.remove();document.body.appendChild(w);}
})();
