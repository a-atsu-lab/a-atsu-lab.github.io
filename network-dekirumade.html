<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネットワークができるまで（ポップ版）</title>
<style>
:root{
  --bg:#fff6e3; --paper:#ffffff; --ink:#23253a; --sub:#5b5f78; --line:#ece2cc; --line2:#d6c9ad;
  --teal:#2f8cff; --teal-l:#e2efff; --coral:#ff5470; --coral-l:#ffe4e9; --gold:#ffb81c; --gold-l:#fff0c9;
  --green:#14a874; --green-l:#d9f5e9; --gray:#9aa0b5;
  --L0:#4f7dff; --L1:#14b3a3; --L2:#ff9f1c; --L3:#ff5470; --L4:#9b5de5;
  --o:#23253a; --sh:4px 4px 0 var(--o); --sh2:3px 3px 0 var(--o);
  --sp:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"M PLUS Rounded 1c","Kosugi Maru","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;line-height:1.7;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:"BIZ UDGothic","Consolas","Menlo",monospace}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--teal);display:grid;place-items:center;flex:none}
.brand .logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand .t1{font-weight:700;font-size:16px;line-height:1.3;white-space:nowrap}
.brand .t2{font-size:12px;color:var(--sub);line-height:1.3;white-space:nowrap}
.prog{flex:1;display:flex;gap:4px;align-items:center;min-width:120px}
.prog button{flex:1;height:8px;border:none;border-radius:4px;background:var(--line);cursor:pointer;padding:0;position:relative}
.prog button.done{background:#b9d3d1}
.prog button.cur{background:var(--teal)}
.prog button:hover::after{content:attr(data-t);position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;z-index:50}
.tools{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--sub)}
.tools button{white-space:nowrap}
.tools select,.tools button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}

/* ---------- layout ---------- */
.wrap{flex:1;display:flex;min-height:0}
main{flex:1;overflow:auto;overflow-x:hidden;padding:22px 28px 30px;min-width:0}
aside{width:270px;flex:none;border-left:1px solid var(--line);background:#faf7f0;overflow:auto;padding:16px 14px}
footer{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--paper);border-top:1px solid var(--line)}
footer button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 22px;cursor:pointer;font-weight:700;white-space:nowrap}
.navbtns{display:flex;gap:8px;flex:none}
footer button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
footer button:disabled{opacity:.35;cursor:default}
#where{flex:1;font-size:13px;color:var(--sub);text-align:left}
#where .dots{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
#where .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block}
#where .dots i.on{background:var(--teal)}

/* ---------- slide ---------- */
.slide{max-width:1060px;margin:0 auto;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.chno{font-size:13px;color:var(--sub);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:2px 12px;border-radius:999px}
.tag.p{background:var(--coral-l);color:var(--coral)}
.tag.s{background:var(--teal-l);color:var(--teal)}
.tag.t{background:var(--gold-l);color:#9a6f1c}
.tag.c{background:var(--green-l);color:var(--green)}
h2{font-size:26px;margin:4px 0 14px;line-height:1.4}
.lead{font-size:17px;margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.muted{color:var(--sub)}
.small{font-size:13px}
b.em{color:var(--teal)}
b.ng{color:var(--coral)}

/* problem */
.say{display:flex;gap:16px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--coral);border-radius:14px;padding:16px 20px;margin-top:14px}
.say .face{width:52px;height:52px;flex:none}
.say p{margin:0;font-size:18px}
.say p+p{margin-top:8px}
.era{display:inline-block;font-size:13px;color:var(--sub);background:#efe9dc;border-radius:6px;padding:1px 10px;margin-top:10px}

/* solve */
.solve{display:grid;grid-template-columns:minmax(240px,1fr) 1.6fr;gap:18px;align-items:start}
.tech{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--teal);border-radius:16px;padding:18px 20px}
.tech .name{font-size:28px;font-weight:700;line-height:1.35}
.tech .yr{display:inline-block;margin:8px 0 6px;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-l);border-radius:6px;padding:1px 10px}
.tech .def{font-size:16px;margin:6px 0 0}
.tech .lay{margin-top:12px;font-size:12px;color:#fff;display:inline-block;padding:2px 10px;border-radius:6px}
.points{display:grid;gap:12px}
.pt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px}
.pt .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;margin-top:2px}
.pt p{margin:0}
.fig{margin-top:16px}
.story{margin-top:14px;font-size:14px;background:#f1ece0;border-radius:12px;padding:10px 16px;color:#4b5260}
.story b{color:var(--ink)}

/* try */
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
.ctrl input[type=text],.ctrl input:not([type]),.ctrl select{border:1px solid var(--line2);border-radius:8px;padding:4px 10px;background:#fff}
.ctrl input[type=range]{vertical-align:middle;accent-color:var(--teal)}
.go{background:var(--gold);color:#fff;border:none;border-radius:999px;padding:6px 18px;font-weight:700;cursor:pointer}
.go:hover{filter:brightness(1.05)}
.go.sub{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.go:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:5px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.panel h4{margin:0 0 6px;font-size:13px;color:var(--sub)}
.log{max-height:150px;overflow:auto;font-size:14px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border-bottom:none;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}

/* network canvas */
.net{position:relative;width:100%;background:
  radial-gradient(circle, #e7e1d3 1px, transparent 1.2px) 0 0/18px 18px, var(--paper);
  border:1px solid var(--line);border-radius:16px;overflow:visible;max-height:max(220px,40vh)}
.net>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.net line{stroke:#b9b2a2;stroke-width:3;stroke-linecap:round}
.net line.tap{stroke-dasharray:3 6;stroke:var(--coral);stroke-width:2}
.net line.air,.net.air line{stroke-dasharray:2 7;stroke:var(--L0)}
.net line.hot{stroke:var(--teal)}
.node{position:absolute;transform:translate(-50%,calc(-27px*var(--k,1)));display:flex;flex-direction:column;align-items:center;z-index:2;text-align:center;pointer-events:none}
.node .ic{width:calc(54px*var(--k,1));height:calc(54px*var(--k,1));border-radius:calc(14px*var(--k,1));background:#fff;border:2px solid var(--line2);display:grid;place-items:center;color:var(--ink);transition:all .25s;pointer-events:auto}
.node .ic svg{width:calc(32px*var(--k,1));height:calc(32px*var(--k,1));fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.node .ic svg .f{fill:currentColor;stroke:none}
.node .nl{font-size:calc(12.5px*var(--t,1));font-weight:700;margin-top:3px;line-height:1.3;white-space:nowrap;background:rgba(255,253,248,.85);padding:0 4px;border-radius:4px}
.node .ns{font-size:calc(11.5px*var(--t,1));color:var(--sub);line-height:1.3;white-space:nowrap;background:rgba(255,253,248,.85);padding:0 4px;border-radius:4px}
.node.off .ic{opacity:.4;border-style:dashed}
.node.off .nl{color:var(--gray)}
.node.ok .ic{border-color:var(--green);background:var(--green-l);color:var(--green)}
.node.ngf .ic{border-color:var(--gray);background:#eee;color:var(--gray)}
.node.alert .ic{border-color:var(--coral);background:var(--coral-l);color:var(--coral)}
.node.room{transform:translate(-50%,-50%)}
.node.room .ic{width:auto;height:auto;padding:calc(4px*var(--k,1)) calc(10px*var(--k,1));border-radius:10px;font-weight:700;font-size:calc(14px*var(--t,1));white-space:nowrap}
.node.down .ic{background:#e9e6e0;border-color:var(--gray);color:var(--gray)}
.node.clickable .ic{cursor:pointer}
.area{position:absolute;border:2px dashed #cfc7b6;border-radius:16px;background:rgba(255,255,255,.35)}
.area span{position:absolute;top:4px;left:10px;font-size:calc(12px*var(--t,1));color:var(--sub);font-weight:700}
.plabel{position:absolute;transform:translate(-50%,-50%);font-size:calc(11px*var(--t,1));color:var(--sub);background:var(--paper);padding:0 4px;border-radius:4px;z-index:1}
.pkt{position:absolute;transform:translate(-50%,-50%);z-index:6;background:var(--gold);color:#fff;font-size:calc(12px*var(--t,1));font-weight:700;line-height:1.35;padding:calc(3px*var(--t,1)) calc(9px*var(--t,1));border-radius:8px;white-space:nowrap;box-shadow:0 2px 6px rgba(60,40,0,.18);pointer-events:none;text-align:center}
.pkt.bit{padding:0;width:calc(20px*var(--t,1));height:calc(20px*var(--t,1));display:grid;place-items:center;border-radius:5px;font-size:calc(12px*var(--t,1))}
.pkt.b1{background:var(--teal)}
.pkt.b0{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.pkt.ack{background:var(--green);font-size:calc(11px*var(--t,1))}
.pkt.blue{background:var(--L0)}
.pkt.tealp{background:var(--L1)}
.pkt.red{background:var(--coral)}
.pkt.purple{background:var(--L4)}
.pkt.gray{background:var(--gray)}
.pkt.lock{background:#3b4558}
.pkt.copy{background:var(--coral);opacity:.9}
.bub{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:calc(12.5px*var(--t,1));line-height:1.4;padding:calc(5px*var(--t,1)) calc(10px*var(--t,1));border-radius:10px;white-space:nowrap;z-index:8;animation:pop .2s ease}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.bub.ok{background:var(--green)}.bub.ok::after{border-top-color:var(--green)}
.bub.ng{background:var(--coral)}.bub.ng::after{border-top-color:var(--coral)}
.bub.g{background:var(--gray)}.bub.g::after{border-top-color:var(--gray)}
.bub.below{bottom:auto;top:calc(100% + 4px)}
.bub.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}
.load{width:calc(60px*var(--k,1));height:7px;background:#e8e2d5;border-radius:4px;margin-top:3px;overflow:hidden}
.load i{display:block;height:100%;background:var(--green);transition:width .2s}
.load i.mid{background:var(--gold)}.load i.hi{background:var(--coral)}

/* specific */
.bitsline{font-size:15px;margin:10px 0 4px}
.bitsline code{background:#f1ece0;padding:2px 8px;border-radius:6px;letter-spacing:.05em}
.big{font-size:22px;color:var(--teal)}
.mactbl{width:100%;border-collapse:collapse;font-size:14px}
.mactbl td,.mactbl th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
.mactbl tr.new td{background:var(--gold-l)}
.np{color:#2c6f8f;font-weight:700}
.hp{color:var(--coral);font-weight:700}
.ipfig{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.iprow{font-size:32px;font-weight:700;letter-spacing:.03em;padding-bottom:26px;line-height:1.25}
.ipp{position:relative;display:inline-block;border-bottom:4px solid currentColor}
.ipp small{position:absolute;left:0;top:100%;margin-top:4px;font-size:13px;letter-spacing:0;white-space:nowrap}
.ipd{display:inline-block;padding:0 2px}
.bin{font-size:13px;margin-top:8px;color:var(--sub)}
.term{background:#1f2630;color:#d6e2e0;font-family:"BIZ UDGothic","Consolas",monospace;font-size:13.5px;border-radius:12px;padding:12px 14px;min-height:150px;max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:12px}
.term .cmd{color:#f2c36b}.term .bad{color:#ff9d84}.term .good{color:#9fe0b5}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.slot{min-width:64px;border:2px dashed var(--line2);border-radius:10px;padding:2px 8px;font-size:15px;text-align:center;background:#fff}
.slot i{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.slot.fill{border-style:solid;border-color:var(--teal);background:var(--teal-l)}
.slot.miss{border-color:var(--coral);background:var(--coral-l)}
.cmp{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden;font-size:15px}
.cmp th,.cmp td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.cmp th{background:#f1ece0}
.urlfig{font-size:22px;font-family:"BIZ UDGothic","Consolas",monospace;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;overflow-x:auto}
.urlfig span{display:inline-block;padding:0 2px;border-bottom:4px solid}
.urlfig .u1{border-color:var(--L2)}.urlfig .u2{border-color:var(--L1)}.urlfig .u3{border-color:var(--L3)}
.urlleg{display:flex;gap:18px;font-size:13px;margin-top:8px;flex-wrap:wrap;font-family:inherit}
.urlleg i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:6px}
.http{display:grid;grid-template-columns:1.2fr 1fr .9fr;gap:12px;align-items:stretch}
.browser{background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:260px}
.browser .bar{background:#efebe2;padding:6px 10px;font-size:13px;font-family:"BIZ UDGothic","Consolas",monospace;border-bottom:1px solid var(--line)}
.browser .bar b{color:var(--green)}
.browser .view{flex:1;padding:14px;font-size:14px}
.browser .view h3{margin:0 0 6px;font-size:20px}
.wire{display:flex;flex-direction:column;gap:8px;justify-content:center}
.msg{background:#fff;border:1px solid var(--line2);border-radius:10px;font-size:12px;padding:6px 10px;white-space:pre-wrap;font-family:"BIZ UDGothic","Consolas",monospace;line-height:1.5}
.msg.req{border-left:5px solid var(--L3)}
.msg.res{border-left:5px solid var(--L1)}
.msg .h{font-family:inherit;font-weight:700;font-size:11px;color:var(--sub)}
.srv{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.srv.hl{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-l)}
.srv ul{margin:4px 0;padding-left:18px}
.eye{font-family:"BIZ UDGothic","Consolas",monospace;word-break:break-all}
.eye div{padding:3px 0;border-bottom:1px dashed var(--line)}
.eye .plain{color:var(--coral);font-weight:700}
.eye .ciph{color:#56607a}
.addr{font-family:"BIZ UDGothic","Consolas",monospace;font-size:13px;background:#efebe2;border-radius:8px;padding:4px 10px;display:inline-block}
.stat{display:flex;gap:16px;font-size:15px}
.stat b{font-size:20px}

/* check */
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.qh{display:flex;gap:12px;align-items:flex-start;background:#e7f0e6;padding:14px 20px;border-bottom:1px solid #d3e3d2}
.qmark{flex:none;width:36px;height:36px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;font-size:19px}
.quiz .q{font-size:18px;font-weight:700;margin:4px 0 0}
.opts{display:grid;gap:8px;padding:14px 20px}
.opts button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:16px;transition:transform .15s,border-color .15s}
.opts .ol{flex:none;width:30px;height:30px;border-radius:8px;background:#f1ece0;display:grid;place-items:center;font-weight:700;color:var(--sub)}
.opts button:hover:not(:disabled){border-color:var(--green);transform:translateX(3px)}
.opts button.right{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;opacity:1}
.opts button.right .ol{background:#fff;color:var(--green)}
.opts button.wrong{background:var(--coral-l);border-color:var(--coral);color:#8e3c27;opacity:1}
.opts button.wrong .ol{background:var(--coral);color:#fff}
.opts button:disabled{cursor:default;opacity:.5}
.opts button.right:disabled,.opts button.wrong:disabled{opacity:1}
.result{margin:0 20px;display:flex;align-items:center;gap:16px;border-radius:14px;padding:12px 20px;color:#fff;animation:pop2 .4s cubic-bezier(.2,1.5,.4,1)}
.result.ok{background:var(--green)}
.result.ng{background:var(--coral)}
.result .rmark{flex:none;font-size:34px;font-weight:700;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;line-height:1}
.result b{font-size:26px;display:block;line-height:1.3}
.result small{font-size:14px}
@keyframes pop2{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.exp{margin:12px 20px 18px;font-size:15.5px;background:#f6f3ec;border-left:6px solid var(--green);border-radius:8px;padding:10px 14px}
.quiz.ng .exp{border-left-color:var(--coral)}
.teaser{margin-top:22px;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fdf1eb,#f9dfd3);border:2px solid var(--coral);border-radius:18px;padding:16px 20px;box-shadow:0 4px 0 #e6b29f}
.teaser .tface{width:60px;height:60px;flex:none}
.teaser .tb{flex:1}
.teaser .h{display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:15px;padding:3px 16px;border-radius:999px}
.teaser p{margin:8px 0 0;font-size:19px;line-height:1.65}
.tnext{flex:none;background:var(--coral);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:15px}
.tnext:hover{filter:brightness(1.07)}
.teaser.pulse{animation:tp 1.1s ease 2}
@keyframes tp{50%{transform:translateY(-3px);box-shadow:0 7px 0 #e6b29f,0 0 0 8px rgba(207,103,75,.15)}}
.face svg,.tface svg{width:100%;height:100%;display:block}
/* pause */
.net,.http{cursor:pointer;position:relative}
.net::after{content:"図をクリックで一時停止";position:absolute;right:10px;bottom:6px;font-size:11px;color:#aaa294;pointer-events:none;z-index:1}
body.paused .net::after{content:"一時停止中（クリックで再開）";color:var(--gold);font-weight:700}
body.paused .net,body.paused .http{outline:3px solid var(--gold);outline-offset:2px;border-radius:16px}
.dropmark{position:absolute;transform:translate(-50%,-190%);font-size:calc(12px*var(--t,1));font-weight:700;color:var(--coral);z-index:7;pointer-events:none;white-space:nowrap}

/* hero */
.hero{max-width:900px;margin:10px auto}
.kicker{display:inline-block;background:var(--coral-l);color:var(--coral);font-weight:700;border-radius:999px;padding:3px 14px;font-size:14px}
.hero h1{font-size:34px;line-height:1.45;margin:12px 0}
.hero>p{font-size:17px}
.flow{list-style:none;padding:0;margin:18px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.flow li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15px;cursor:pointer;position:relative}
.flow li:hover{border-color:var(--teal)}
.flow li span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;margin-right:6px}
.flow li small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.how{font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.hint{font-size:13px;color:var(--sub)}

/* sidebar */
aside h3{font-size:14px;margin:0 0 4px}
aside .sub{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.stack{display:flex;flex-direction:column-reverse;gap:6px}
.lay{border-radius:12px;padding:8px 10px;background:#fff;border:1px solid var(--line)}
.lay .ln{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.lay .ln i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lay .lr{font-size:11px;color:var(--sub);margin:1px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;border:1px dashed var(--line2);color:#b3ab9b;background:#faf8f3;cursor:default}
.chip.lit{color:#fff;border-style:solid;cursor:pointer}
.chip.now{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(46,124,131,.25)}}
.extra{margin-top:10px}

/* summary */
.bigstack{display:flex;flex-direction:column-reverse;gap:8px}
.bigstack .lay{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:12px 16px;border-left:8px solid}
.bigstack .lay .ln{font-size:15px}
.bigstack .lay .lr{font-size:13px}
.bigstack .chip{font-size:14px;padding:3px 12px}
.scenes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.scenes span{font-size:13px;border-radius:999px;padding:2px 12px;background:#fff;border:1px solid var(--line)}
.scenes span.on{color:#fff;border-color:transparent}
.cap{min-height:56px;font-size:17px;margin:12px 0 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 16px;border-left:6px solid var(--teal)}
.tl{position:relative;margin:6px 0 0 8px;padding-left:22px;border-left:3px solid var(--line2)}
.tl .ti{position:relative;padding:5px 0 5px}
.tl .ti::before{content:"";position:absolute;left:-30px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--c,var(--teal));border:3px solid var(--bg)}
.tl .y{display:inline-block;width:88px;font-weight:700;color:var(--sub);font-size:14px}
.tl .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;margin-right:6px;vertical-align:1px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw span{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:1px 10px;background:#fff;color:var(--sub)}
.kw span.used{background:var(--teal);border-color:var(--teal);color:#fff}
textarea{width:100%;min-height:170px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:#fff;font-size:16px;line-height:1.7}

/* menu */
#menu{position:fixed;inset:0;background:rgba(39,48,62,.35);z-index:100;display:flex;justify-content:flex-end}
#menu[hidden]{display:none}
#menu .box{width:min(420px,92vw);background:var(--paper);height:100%;overflow:auto;padding:18px 20px}
#menu .box h3{margin:0 0 10px}
#menu .item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
#menu .item:hover{background:#f1ece0}
#menu .item.cur{border-color:var(--teal)}
#menu .item .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
#menu .item small{display:block;color:var(--sub);font-size:12px}


/* =========================================================
   ポップデザイン（上書き）
   ========================================================= */
body{background:radial-gradient(circle,#ffdf9e 1.7px,transparent 2px) 0 0/24px 24px,var(--bg)}
header{background:#ffd23f;border-bottom:3px solid var(--o)}
.brand .logo{background:var(--coral);border:2.5px solid var(--o);box-shadow:var(--sh2);border-radius:12px;transform:rotate(-6deg)}
.brand .t1{font-size:18px;font-weight:800;letter-spacing:.02em}
.brand .t2{color:var(--ink)}
.prog button{height:12px;border:2px solid var(--o);background:#fff;border-radius:7px}
.prog button.done{background:#7cc4ff}
.prog button.cur{background:var(--coral);transform:scaleY(1.25)}
.tools{color:var(--ink);font-weight:700}
.tools select,.tools button{border:2.5px solid var(--o);box-shadow:var(--sh2);border-radius:12px;font-weight:700;background:#fff}
.tools button:active{transform:translate(3px,3px);box-shadow:none}
.tools button.fs{background:var(--teal);border-color:var(--o);color:#fff}
aside{background:#fffdf5;border-left:3px solid var(--o)}
aside h3{font-size:16px}
footer{background:#fff;border-top:3px solid var(--o)}
footer button{border:2.5px solid var(--o);box-shadow:var(--sh2);transition:transform .1s,box-shadow .1s}
footer button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--o)}
footer button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
footer button.primary{background:var(--coral);border-color:var(--o)}
#where{color:var(--ink);font-weight:700}
#where .dots i{width:10px;height:10px;border:2px solid var(--o);background:#fff}
#where .dots i.on{background:var(--coral)}

.slide{animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.chno{color:var(--ink)}
.tag{border:2px solid var(--o);padding:2px 14px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--o)}
.tag.p{background:var(--coral);color:#fff}
.tag.s{background:var(--teal);color:#fff}
.tag.t{background:var(--gold);color:var(--ink)}
.tag.c{background:var(--green);color:#fff}
h2{display:inline-block;font-size:29px;font-weight:800;background:linear-gradient(transparent 58%,#ffe066 58%);padding:0 6px;margin:8px 0 16px}
.card,.say,.tech,.pt,.ctrl,.panel,.ipfig,.urlfig,.cap,.srv,.browser{border:2.5px solid var(--o);box-shadow:var(--sh);border-radius:18px}
.say{background:#fff3f5;border-left:2.5px solid var(--o)}
.say p{font-size:19px}
.era{background:#fff;border:2px dashed var(--o);border-radius:10px;color:var(--ink)}
.tech{background:linear-gradient(#e2efff 0,#e2efff 100%);border-top:2.5px solid var(--o)}
.tech .name{font-weight:800}
.tech .yr{background:#fff;border:2px solid var(--o);color:var(--ink);border-radius:999px}
.tech .lay{border:2px solid var(--o);border-radius:999px}
.pt .n{background:var(--coral);border:2px solid var(--o)}
.pt:nth-child(2) .n{background:var(--teal)}
.pt:nth-child(3) .n{background:var(--gold);color:var(--ink)}
.story{background:#fff;border:2.5px dashed var(--o);border-radius:16px;color:var(--ink)}
.ctrl{background:#fffbea}
.ctrl input[type=text],.ctrl input:not([type]),.ctrl select{border:2px solid var(--o);border-radius:10px}
.go{background:var(--gold);color:var(--ink);border:2.5px solid var(--o);box-shadow:var(--sh2);font-weight:800;transition:transform .1s,box-shadow .1s}
.go:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--o);filter:none}
.go:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.go.sub{background:#fff;border:2.5px solid var(--o)}
.seg{border:2.5px solid var(--o);box-shadow:var(--sh2)}
.seg button{font-weight:700}
.seg button.on{background:var(--teal);color:#fff}
.panel h4{color:var(--ink);font-size:14px}
.net{border:2.5px solid var(--o);box-shadow:var(--sh);border-radius:20px;
  background:linear-gradient(#e7f1ff 1.5px,transparent 1.5px) 0 0/24px 24px,linear-gradient(90deg,#e7f1ff 1.5px,transparent 1.5px) 0 0/24px 24px,#fbfdff}
.net line{stroke:#a7b0d0;stroke-width:4}
.node .ic{border:2.5px solid var(--o);box-shadow:3px 3px 0 var(--o);border-radius:calc(16px*var(--k,1));background:#fff}
.node .nl{background:#fff;border:1.5px solid var(--o);border-radius:8px;padding:0 6px;margin-top:5px}
.node .ns{background:rgba(255,255,255,.9)}
.node.ok .ic{border-color:var(--o);background:#c8f2df;color:var(--green)}
.node.alert .ic{border-color:var(--o);background:#ffd3dc;color:var(--coral)}
.node.ngf .ic{border-color:var(--o)}
.node.room .ic{background:#fff6d6}
.area{border:2.5px dashed #8f97bd;background:rgba(255,255,255,.55);border-radius:18px}
.pkt{background:#ffc93c;color:var(--ink);border:2px solid var(--o);border-radius:11px;box-shadow:2px 2px 0 var(--o)}
.pkt.b1,.pkt.ack,.pkt.blue,.pkt.tealp,.pkt.red,.pkt.purple,.pkt.gray,.pkt.lock,.pkt.copy{color:#fff}
.pkt.b0{background:#fff;color:var(--teal);border:2px solid var(--o)}
.bub{border-radius:12px;font-weight:700;border:2px solid var(--o)}
.load{border:1.5px solid var(--o);height:9px}
.term{border:2.5px solid var(--o);box-shadow:var(--sh);border-radius:16px;background:#22243a}
.slot{border:2px dashed var(--o);border-radius:12px}
.slot.fill{border-style:solid;border-color:var(--o);background:#d6ecff}
.cmp{border:2.5px solid var(--o);box-shadow:var(--sh);border-collapse:separate;border-spacing:0;border-radius:16px}
.cmp th{background:#ffe066}
.cmp th,.cmp td{border:none;border-bottom:1.5px solid var(--line2);border-right:1.5px solid var(--line2)}
.browser .bar{background:#ffe066;border-bottom:2.5px solid var(--o)}
.msg{border:2px solid var(--o);box-shadow:2px 2px 0 var(--o)}
.srv.hl{background:#fff6d6;box-shadow:0 0 0 4px var(--gold),var(--sh)}
.addr{border:2px solid var(--o);background:#fff}
.mactbl tr.new td{background:#ffe066}

.quiz{border:2.5px solid var(--o);box-shadow:5px 5px 0 var(--o);border-radius:20px}
.qh{background:#d9f5e9;border-bottom:2.5px solid var(--o)}
.qmark{border:2.5px solid var(--o);border-radius:12px;transform:rotate(-6deg)}
.quiz .q{font-weight:800}
.opts button{border:2.5px solid var(--o);box-shadow:var(--sh2);transition:transform .1s,box-shadow .1s}
.opts .ol{border:2px solid var(--o);background:#ffe066;color:var(--ink)}
.opts button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--o);border-color:var(--o)}
.opts button.right{border-color:var(--o)}
.opts button.wrong{border-color:var(--o)}
.result{border:2.5px solid var(--o);box-shadow:var(--sh)}
.exp{border:2px solid var(--o);border-left:8px solid var(--green);background:#fff}
.teaser{background:repeating-linear-gradient(-45deg,#fff3f5 0 14px,#ffe8ec 14px 28px);border:2.5px solid var(--o);box-shadow:5px 5px 0 var(--o);border-radius:20px}
.teaser .h{border:2px solid var(--o);transform:rotate(-2deg)}
.tnext{border:2.5px solid var(--o);box-shadow:var(--sh2)}
.tnext:active{transform:translate(3px,3px);box-shadow:none}
@keyframes tp{50%{transform:translateY(-4px) rotate(-.5deg)}}
body.paused .net,body.paused .http{outline:4px solid var(--gold)}

.hero h1{font-size:38px;font-weight:800;line-height:1.5}
.hero h1{background:linear-gradient(transparent 62%,#ffe066 62%);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero>p:first-of-type{margin-top:18px}
.kicker{background:var(--coral);color:#fff;border:2.5px solid var(--o);box-shadow:var(--sh2);transform:rotate(-3deg);font-size:15px}
.hero .kicker{display:table;margin-bottom:14px}
.flow li{border:2.5px solid var(--o);box-shadow:var(--sh2);border-radius:16px;transition:transform .12s,box-shadow .12s;background:#fff}
.flow li:nth-child(odd){transform:rotate(-1deg)}.flow li:nth-child(even){transform:rotate(1deg)}
.flow li:hover{transform:translate(-2px,-3px) rotate(0);box-shadow:5px 6px 0 var(--o);border-color:var(--o)}
.flow li span{border:2px solid var(--o);width:26px;height:26px}
.lay{border:2px solid var(--o);border-radius:14px;box-shadow:2px 2px 0 var(--o)}
.chip{border-radius:999px}
.chip.lit{border:1.5px solid var(--o)!important;font-weight:700}
.scenes span{border:2px solid var(--o);font-weight:700}
.tl{border-left:3px solid var(--o)}
.tl .ti::before{border:2.5px solid var(--o)}
.tl .k{border:2px solid var(--o)}
.kw span{border:2px solid var(--o);font-weight:700}
textarea{border:2.5px solid var(--o);box-shadow:var(--sh);border-radius:16px}
#menu .box{border-left:3px solid var(--o)}
#menu .item .k{border:2px solid var(--o)}
#menu .item.cur{border:2px solid var(--o);background:#fff6d6}

[hidden]{display:none!important}
/* 「でも、まだ困ることが…」は確認問題のあとに登場 */
.teaser{display:none}
.teaser.show{display:flex;animation:teaserIn .7s cubic-bezier(.2,1.35,.4,1) both}
@keyframes teaserIn{0%{opacity:0;transform:translateY(40px) scale(.94) rotate(-1deg)}100%{opacity:1;transform:none}}
.tech .yr{border-radius:14px;line-height:1.6;padding:3px 12px}

/* ---------- 授業モード：スライド風アニメーション ---------- */
.bld{opacity:0;transform:translateY(28px) scale(.97);transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.35,.4,1)}
.bld.in{opacity:1;transform:none}
@keyframes prFade{from{opacity:0}}
@keyframes prDrop{from{opacity:0;transform:translateY(-18px) rotate(-6deg) scale(.8)}}
@keyframes prLeft{from{opacity:0;transform:translateX(-40px)}}
@keyframes prUp{from{opacity:0;transform:translateY(30px)}}
@keyframes prZoom{from{opacity:0;transform:scale(.85)}}
@keyframes prPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}}
body.present .slide{animation:prFade .35s ease both}
body.present .shead .tag{animation:prDrop .55s .05s cubic-bezier(.2,1.5,.4,1) both}
body.present .shead .chno{animation:prFade .4s both}
body.present h2{animation:prLeft .55s .12s cubic-bezier(.2,1.2,.4,1) both}
body.present .solve .tech{animation:prZoom .6s .3s cubic-bezier(.2,1.4,.4,1) both}
body.present .slide>.lead,body.present .slide>.ctrl{animation:prUp .5s .25s both}
body.present .slide>.net,body.present .slide>#sc,body.present .slide>[id^="n"]{animation:prUp .6s .35s both}
body.present .slide>.row2:not(.bld),body.present .slide>.http,body.present .slide>.term{animation:prUp .6s .45s both}
body.present .quiz{animation:prZoom .55s .25s cubic-bezier(.2,1.3,.4,1) both}
body.present .opts button{animation:prUp .45s both}
body.present .opts button:nth-child(1){animation-delay:.5s}
body.present .opts button:nth-child(2){animation-delay:.62s}
body.present .opts button:nth-child(3){animation-delay:.74s}
body.present .opts button:nth-child(4){animation-delay:.86s}
body.present .result{animation:prPop .5s cubic-bezier(.2,1.5,.4,1) both}
body.present .hero .kicker{animation:prDrop .6s cubic-bezier(.2,1.5,.4,1) both}
body.present .hero h1{animation:prFade .7s .15s both}
body.present .hero>p{animation:prUp .55s .35s both}
body.present .flow li{animation:prPop .5s cubic-bezier(.2,1.4,.4,1) both}
body.present .flow li:nth-child(1){animation-delay:0.58s}
body.present .flow li:nth-child(2){animation-delay:0.66s}
body.present .flow li:nth-child(3){animation-delay:0.74s}
body.present .flow li:nth-child(4){animation-delay:0.82s}
body.present .flow li:nth-child(5){animation-delay:0.90s}
body.present .flow li:nth-child(6){animation-delay:0.98s}
body.present .flow li:nth-child(7){animation-delay:1.06s}
body.present .flow li:nth-child(8){animation-delay:1.14s}
body.present .flow li:nth-child(9){animation-delay:1.22s}
body.present .flow li:nth-child(10){animation-delay:1.30s}

body.present .hero .how{animation:prUp .5s 1.4s both}
body.present .hero .hint{animation:prFade .5s 1.6s both}
body.present .tl .ti{animation:prLeft .45s both}
body.present .tl .ti:nth-child(1){animation-delay:0.32s}
body.present .tl .ti:nth-child(2){animation-delay:0.44s}
body.present .tl .ti:nth-child(3){animation-delay:0.56s}
body.present .tl .ti:nth-child(4){animation-delay:0.68s}
body.present .tl .ti:nth-child(5){animation-delay:0.80s}
body.present .tl .ti:nth-child(6){animation-delay:0.92s}
body.present .tl .ti:nth-child(7){animation-delay:1.04s}
body.present .tl .ti:nth-child(8){animation-delay:1.16s}
body.present .tl .ti:nth-child(9){animation-delay:1.28s}
body.present .tl .ti:nth-child(10){animation-delay:1.40s}
body.present .tl .ti:nth-child(11){animation-delay:1.52s}
body.present .tl .ti:nth-child(12){animation-delay:1.64s}
body.present .tl .ti:nth-child(13){animation-delay:1.76s}

body.present .scenes span{animation:prPop .4s both}
body.present .kw span{animation:prPop .4s .3s both}
@media (max-width:980px){
  aside{display:none}
  .solve{grid-template-columns:1fr}
  .http{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr}
  .brand .t2{display:none}
  .bigstack .lay{grid-template-columns:1fr}
}
@media (max-width:640px){
  .net{max-height:max(260px,56vh)}
  .net::after{font-size:10px}
  header{flex-wrap:wrap;gap:8px 12px;padding:8px 14px}
  .brand{flex:1}
  .prog{order:3;flex-basis:100%}
  footer{padding:8px 12px;gap:10px}
  #where{font-size:12px}
  footer button{padding:9px 16px}
  .teaser{flex-wrap:wrap}.tnext{width:100%}
  main{padding:14px}
  .row2{grid-template-columns:1fr}
  h2{font-size:21px}
  .hero h1{font-size:25px}
  .tools label{display:none}
}
/* ---------- 授業モード（全画面） ---------- */
.tools button.fs{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
body.present aside{display:none}
body.present header{padding:6px 16px}
body.present .brand .t2{display:none}
body.present main{overflow:hidden;padding:14px 20px;position:relative}
body.present .slide{width:980px;max-width:none;margin:0;transform-origin:0 0;animation:none}
body.present .net{max-height:330px}
body.present .lead{font-size:19px}
body.present h2{font-size:30px}
body.present .say p{font-size:21px}
body.present .pt p{font-size:17.5px}
body.present .tech .def{font-size:17.5px}
body.present .quiz .q{font-size:21px}
body.present .opts button{font-size:18.5px;padding:7px 12px}
body.present .teaser p{font-size:20px}
body.present .exp{font-size:17px}
body.present .ctrl{font-size:16px;margin-bottom:10px;padding:8px 14px}
body.present .panel{font-size:15px}
body.present .log{max-height:110px}
body.present .term{max-height:170px;min-height:120px;font-size:15px}
body.present .cap{font-size:19px}
body.present .story{font-size:15.5px}
body.present footer{padding:6px 16px}
body.present footer button{padding:6px 20px}
@media print{
  header,footer,aside,.noprint{display:none!important}
  body{background:#fff;display:block}
  main{overflow:visible;padding:0}
  .wrap{display:block}
  textarea{border:1px solid #999;min-height:0;height:auto}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.3 11l9.3-4M7.3 13l9.3 4"/></svg></div>
    <div><div class="t1">ネットワークができるまで</div><div class="t2">「困った！」から生まれた技術をたどる</div></div>
  </div>
  <nav class="prog" id="prog"></nav>
  <div class="tools">
    <label>動きの速さ
      <select id="speed"><option value="0.4">ゆっくり</option><option value="0.6" selected>ふつう</option><option value="1">はやい</option></select>
    </label>
    <button id="menuBtn">もくじ</button>
    <button id="fsBtn" class="fs">全画面で授業</button>
  </div>
</header>
<div class="wrap">
  <main id="stage"></main>
  <aside id="side"></aside>
</div>
<footer>
  <div id="where"></div>

let SPEED=0.6, RUN=0, ANIMS=[], BUSY=false, PAUSED=false;
const $=(r,s)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sleep(ms){const r=RUN;return new Promise((res,rej)=>{let left=ms/SPEED,last=performance.now();
  (function tick(){if(r!==RUN)return rej(new Error('stop'));const now=performance.now();if(!PAUSED)left-=now-last;last=now;if(left<=0)res();else setTimeout(tick,Math.min(40,Math.max(5,left)));})();});}
function track(an){ANIMS.push(an);if(PAUSED)an.pause();an.finished.then(()=>{const i=ANIMS.indexOf(an);if(i>=0)ANIMS.splice(i,1);},()=>{});return an;}
function setPause(v){PAUSED=v;ANIMS.forEach(a=>{try{v?a.pause():a.play()}catch(e){}});document.body.classList.toggle('paused',v);}
function alive(r){return r===RUN}
function act(fn){
  return async(...a)=>{
    if(BUSY) return; BUSY=true; const r=RUN;
    try{await fn(...a)}catch(e){if(e&&e.message!=='stop'&&e.name!=='AbortError')console.error(e)}
    finally{if(r===RUN)BUSY=false}
  };
}
function quiet(p){return p.catch(e=>{if(e&&e.message!=='stop'&&e.name!=='AbortError')console.error(e)})}

function makeNet(el,nodes,links,ratio){
  el.classList.add('net'); ratio=ratio||'16/6'; el.style.aspectRatio=ratio; el.innerHTML='';
  const [rw,rh]=ratio.split('/').map(Number);
  const fit=()=>{const w=el.clientWidth; if(!w) return;
    const k=Math.max(.5,Math.min(1,w/860));          // アイコンの縮小率
    const t=Math.max(.74,Math.min(1,w/760));         // 文字の縮小率（読める大きさは保つ）
    el.style.setProperty('--k',k.toFixed(3)); el.style.setProperty('--t',t.toFixed(3));
    const tall=w<760?Math.min(1.9,760/w):1;          // 幅がせまいときは図を縦にのばす
    el.style.aspectRatio=`${rw}/${(rh*tall).toFixed(2)}`;};
  if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe(el);}
  fit();
  const N={};
  nodes.forEach(n=>N[n.id]=n);
  let svg='<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
  links.forEach(([a,b,c])=>{svg+=`<line x1="${N[a].x}" y1="${N[a].y}" x2="${N[b].x}" y2="${N[b].y}" class="${c||''}" data-l="${a}-${b}" vector-effect="non-scaling-stroke"/>`});
  svg+='</svg>';
  el.insertAdjacentHTML('beforeend',svg);
  nodes.forEach(n=>{
    const d=document.createElement('div');
    d.className='node '+(n.cls||'');
    d.style.left=n.x+'%'; d.style.top=n.y+'%';
    d.innerHTML=`<div class="ic">${n.text||(n.icon?IC[n.icon]:'')}</div>${n.label?`<div class="nl">${n.label}</div>`:''}${n.sub?`<div class="ns">${n.sub}</div>`:''}`;
    el.appendChild(d); n.el=d;
  });
  return {
    el,N,
    node:id=>N[id].el,
    fly:(path,opt)=>fly(el,N,path,opt||{}),
    line:(a,b)=>el.querySelector(`[data-l="${a}-${b}"],[data-l="${b}-${a}"]`),
    label:(x,y,t)=>{const d=document.createElement('div');d.className='plabel';d.style.left=x+'%';d.style.top=y+'%';d.innerHTML=t;el.appendChild(d);return d;}
  };
}
async function fly(el,N,path,opt){
  const p=document.createElement('div');
  p.className='pkt '+(opt.cls||''); p.innerHTML=opt.label||'';
  const P=id=>typeof id==='string'?N[id]:id;
  let a=P(path[0]);
  p.style.left=a.x+'%'; p.style.top=a.y+'%';
  el.appendChild(p);
  try{
    for(let i=1;i<path.length;i++){
      const b=P(path[i]);
      const dur=(Array.isArray(opt.dur)?opt.dur[i-1]:(opt.dur||800))/SPEED;
      const an=p.animate([{left:a.x+'%',top:a.y+'%'},{left:b.x+'%',top:b.y+'%'}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
      track(an);
      await an.finished;
      a=b;
      if(opt.onHop) await opt.onHop(path[i],i);
    }
  }finally{ if(!opt.keep) p.remove(); }
  return p;
}
function bubble(nodeEl,html,cls,ms){
  const b=document.createElement('div');
  b.className='bub '+(cls||''); b.innerHTML=html;
  nodeEl.appendChild(b);
  sleep(ms||1700).then(()=>b.remove(),()=>b.remove());
  return b;
}
function flash(nodeEl,cls,ms){nodeEl.classList.add(cls);sleep(ms||1200).then(()=>nodeEl.classList.remove(cls),()=>nodeEl.classList.remove(cls));}
async function drop(net,x,y,label,cls){
  const p=document.createElement('div');p.className='pkt '+(cls||'');p.innerHTML=label;p.style.left=x+'%';p.style.top=y+'%';net.el.appendChild(p);
  const mk=document.createElement('div');mk.className='dropmark';mk.textContent='落ちた！';mk.style.left=x+'%';mk.style.top=y+'%';net.el.appendChild(mk);
  const an=track(p.animate([
    {top:y+'%',transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},
    {top:(y+6)+'%',transform:'translate(-50%,-50%) rotate(-10deg)',opacity:1,offset:.25},
    {top:'112%',transform:'translate(-50%,-50%) rotate(50deg)',opacity:0}],{duration:1200/SPEED,easing:'cubic-bezier(.5,0,.9,.5)',fill:'forwards'}));
  try{await an.finished;}finally{p.remove();sleep(500).then(()=>mk.remove(),()=>mk.remove());}
}
function logTo(el,html){const d=document.createElement('div');d.innerHTML=html;el.appendChild(d);el.scrollTop=el.scrollHeight;}

add(1,'try','文字を1つ、となりに送ってみよう',`
<p class="lead">文字を入れて「送る」を押そう。文字が<b>0と1</b>に変わって運ばれ、相手のところで文字に戻る様子が見られます。</p>

</div>
<div id="n1"></div>

<div class="bitsline" id="o1"></div>`,el=>{
  const N=makeNet($(el,'#n1'),[{id:'a',x:10,y:45,icon:'pc',label:'あなたのPC'},{id:'b',x:90,y:45,icon:'pc',label:'友だちのPC'}],[['a','b']],'16/3.6');

  const ci=$(el,'#c1'); let comp=false;

  const P={A:{x:13,y:18,mac:'0A',port:1},B:{x:87,y:18,mac:'0B',port:2},C:{x:13,y:78,mac:'0C',port:3},D:{x:87,y:78,mac:'0D',port:4}};

  const N=makeNet($(el,'#n2'),nodes,[['S','A'],['S','B'],['S','C'],['S','D']],'16/7');
  for(const k in P) N.label((50+P[k].x)/2+(P[k].x<50?4:-4),(48+P[k].y)/2,'ポート'+P[k].port);
  let mode='hub', table={}, newPort=null;
  const tb=$(el,'#tb2'), log=$(el,'#log2');
  const draw=()=>{
    N.node('S').querySelector('.nl').textContent=mode==='hub'?'ハブ':'スイッチ';
    if(mode==='hub'){tb.innerHTML='<span class="muted">ハブは表を持たない（全員に配るだけ）</span>';return;}
    tb.innerHTML='<table class="mactbl"><tr><th>ポート</th><th>その先にいるMAC</th></tr>'+[1,2,3,4].map(p=>`<tr class="${p===newPort?'new':''}"><td>${p}</td><td>${table[p]?'…'+table[p]:'<span class="muted">？（まだ知らない）</span>'}</td></tr>`).join('')+'</table>';
  };
  draw();
  seg($(el,'#m2'),v=>{mode=v;draw();});
  $(el,'#r2').onclick=()=>{if(BUSY)return;table={};newPort=null;draw();log.innerHTML='<div>スイッチの記憶を消しました</div>';};
  $(el,'#b2').onclick=act(async()=>{
    const s=$(el,'#s2').value,d=$(el,'#d2').value;

    if(log.querySelector('.muted'))log.innerHTML='';
    const lab=`宛先 …${P[d].mac}<br>送信元 …${P[s].mac}`;
    await N.fly([s,'S'],{label:lab,dur:700});
    let targets, msg;
    const others=Object.keys(P).filter(k=>k!==s);
    if(mode==='switch'){
      const learned=table[P[s].port]!==P[s].mac;
      table[P[s].port]=P[s].mac; newPort=learned?P[s].port:null; draw();
      const known=Object.keys(table).find(p=>table[p]===P[d].mac);
      if(known){targets=[d];msg=`スイッチ：宛先 …${P[d].mac} はポート${known}の先にいると知っている → <b class="em">そこだけに送る</b>`;}
      else{targets=others;msg=`スイッチ：宛先 …${P[d].mac} の場所をまだ知らない → しかたなく全員に送る`;}
      if(learned)msg+=`（ついでに「…${P[s].mac} はポート${P[s].port}」と<b>覚えた</b>）`;
    }else{targets=others;msg='ハブ：宛先を見ずに、全員にコピーして配る';}
    logTo(log,msg);
    await Promise.all(targets.map(t=>N.fly(['S',t],{label:lab,dur:700}).then(()=>{
      if(t===d){bubble(N.node(t),'自分宛て！受け取る','ok');flash(N.node(t),'ok');}
      else{bubble(N.node(t),'ちがう…捨てる','g');flash(N.node(t),'ngf');}
    })));
    if(targets.length>1)logTo(log,`→ 関係ない ${targets.length-1}台にも届いてしまった`);
    await sleep(500);
  });
});

add(5,'try','パケットを落とすネットワークで送ってみよう',`

</div>
<div id="n5"></div>
<div class="row2">
  <div class="panel"><h4 id="sh5">受け取る側（パケットの番号ごとの箱）</h4><div class="slots" id="slots5"></div><div id="res5" style="margin-top:8px;font-size:16px"></div></div>
  <div class="panel"><h4>何が起きた？</h4><div class="log" id="log5"><div class="muted">「送る」を押してみよう</div></div></div>
</div>`,el=>{
  const N=makeNet($(el,'#n5'),[{id:'s',x:8,y:50,icon:'pc',label:'送る側'},{id:'c',x:50,y:50,icon:'cloud',label:'混雑したネットワーク'},{id:'r',x:92,y:50,icon:'pc',label:'受け取る側'}],[['s','c'],['c','r']],'16/4');
  let mode='tcp';
  seg($(el,'#m5'),v=>{mode=v;$(el,'#sh5').textContent=v==='tcp'?'受け取る側（パケットの番号ごとの箱）':'受け取る側（届いた順に並ぶ）';});
  const loss=$(el,'#loss5'); loss.oninput=()=>$(el,'#lv5').textContent=loss.value+'%';
  const slots=$(el,'#slots5'),res=$(el,'#res5'),log=$(el,'#log5');
  $(el,'#b5').onclick=act(async()=>{
    const text=($(el,'#msg5').value||'ネットワーク').slice(0,24);
    const parts=text.match(/.{1,3}/gu); const n=parts.length;
    const got=new Array(n).fill(null); const order=[]; let sent=0,rounds=0; const p=loss.value/100; const t0=performance.now();
    log.innerHTML=''; res.innerHTML='';
    slots.innerHTML=mode==='tcp'?parts.map((_,i)=>`<div class="slot" data-i="${i}"><i>${i+1}番</i><span>　</span></div>`).join(''):'';
    logTo(log,`「${esc(text)}」を ${n}個のパケットに分けて、${mode.toUpperCase()}で送る`);
    let pending=[...Array(n).keys()];
    while(pending.length&&rounds<12){
      rounds++;
      if(rounds>1)logTo(log,`${pending.map(i=>i+1).join('・')}番の「届いたよ」が来ない → <b>もう一度送る（再送）</b>`);
      await Promise.all(pending.map((i,k)=>(async()=>{
        await sleep(k*230); sent++;
        const lab=`${i+1}｜${parts[i]}`;
        await N.fly(['s','c'],{label:lab,dur:650});
        if(Math.random()<p){const mx=rnd(56,80);await N.fly(['c',{x:mx,y:50}],{label:lab,dur:(mx-50)*22});await drop(N,mx,50,lab);return;}
        await sleep(Math.random()*650);
        await N.fly(['c','r'],{label:lab,dur:650});
        order.push(i+1);
        if(mode==='tcp'){
          if(got[i]===null){got[i]=parts[i];const sl=slots.querySelector(`[data-i="${i}"]`);sl.classList.add('fill');sl.querySelector('span').textContent=parts[i];}
          await N.fly(['r','c','s'],{label:`ACK ${i+1}`,cls:'ack',dur:500});
        }else{
          got[i]=parts[i]; slots.insertAdjacentHTML('beforeend',`<div class="slot fill"><i>${i+1}番</i><span>${esc(parts[i])}</span></div>`);
        }
      })()));
      if(mode==='udp')break;
      pending=pending.filter(i=>got[i]===null);
    }
    const sec=((performance.now()-t0)/1000*SPEED).toFixed(1);
    logTo(log,`届いた順番：${order.join(' → ')||'なし'}`);
    if(mode==='tcp'){
      res.innerHTML=`番号順に並べると：<b class="big">${esc(parts.join(''))}</b><br><span class="small">全部そろった！ 送ったパケット ${sent}個（うち再送 ${sent-n}個）／かかった時間 約${sec}秒</span>`;
    }else{
      const miss=got.filter(x=>x===null).length;
      res.innerHTML=`届いた順につなぐと：<b class="big">${esc(order.map(k=>parts[k-1]).join(''))}</b><br><span class="small">欠け ${miss}個。確認も並べ直しもしないぶん、待ち時間なし／かかった時間 約${sec}秒</span>`;
    }
  });
});

        q++; logTo(log,`${q}. jp担当に聞く`);
        await N.fly(['res','jp'],{label:`${name} は？`,cls:'red',dur:D});
        bubble(N.node('jp'),`${z.zone} のことは ${z.zone}担当に聞いて`,'',1500); await sleep(900);

      bubble(N.node(z.node),`${name} は ${z.ip} です`,'ok',1500); await sleep(900);

  const eve=$(el,'#eve9'),srvL=$(el,'#srv9');
  const ciph=(s,seed)=>{let h=seed>>>0;return [...new TextEncoder().encode(s)].map(b=>{h=(Math.imul(h,1103515245)+12345)>>>0;return ((b^(h>>>16))&255).toString(16).padStart(2,'0');}).join('');};

      const seed=rnd(1,1e9);
      await hop('you','srv','[鍵] 暗号化した共通鍵','lock',`<span class="ciph">${ciph('KEY'+seed,seed).slice(0,32)}… ← サーバの秘密鍵がないと開けない</span>`);
      bubble(N.node('srv'),'秘密鍵で開けて、共通鍵を手に入れた','ok',1600);await sleep(1100);
      const c=ciph(data,seed);

/* =========================================================
   画面の制御
   ========================================================= */
let cur=0;
const stage=$(document,'#stage'),side=$(document,'#side');
const TYPEN={problem:['p','困った！'],solve:['s','そこで生まれた'],try:['t','動かしてみよう'],check:['c','たしかめよう'],summary:['s','まとめ']};
function chSlides(ch){return S.map((s,i)=>i).filter(i=>S[i].ch===ch);}
function render(){
  RUN++; BUSY=false; PAUSED=false; document.body.classList.remove('paused'); ANIMS.forEach(a=>{try{a.cancel()}catch(e){}}); ANIMS=[];
  const s=S[cur];
  let head='';
  if(s.type!=='title'){
    const [c,t]=TYPEN[s.type];
    head=`<div class="shead"><span class="chno">${s.ch===11?'ふりかえり':`第${s.ch}章　${CH[s.ch].title}`}</span><span class="tag ${c}">${t}</span></div><h2>${s.title}</h2>`;
  }
  stage.innerHTML=`<div class="slide">${head}${s.html}</div>`;
  stage.scrollTop=0;
  const el=$(stage,'.slide');
  if(s.mount) s.mount(el);
  el.querySelectorAll('.quiz').forEach(q=>{
    const ans=+q.dataset.ans;
    q.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      q.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(+x.dataset.i===ans)x.classList.add('right');});
      const ok=i===ans; if(!ok)b.classList.add('wrong');
      q.classList.add(ok?'ok':'ng');
      const r=q.querySelector('.result');r.hidden=false;r.className='result '+(ok?'ok':'ng');
      r.innerHTML=ok?'<span class="rmark">○</span><div><b>正解！</b><small>よく考えられました。下の解説も読んでみよう。</small></div>'
                    :`<span class="rmark">×</span><div><b>おしい！</b><small>正解は ${'ABCD'[ans]} です。解説を読んで、どこがちがったか確かめよう。</small></div>`;
      q.querySelector('.exp').hidden=false;

    });
  });
  el.querySelectorAll('.tnext').forEach(b=>b.onclick=()=>{if(revealPending())return;go(cur+1);});
  markBuilds(el,s);
  ui();
  if(typeof observeSlide==='function')observeSlide();
  try{history.replaceState(null,'','#'+cur);}catch(e){}
}
function ui(){
  const s=S[cur];
  $(document,'#prev').disabled=cur===0;
  $(document,'#next').disabled=cur===S.length-1;
  updNext();
  const list=chSlides(s.ch), k=list.indexOf(cur);
  $(document,'#where').innerHTML=`${s.ch===0?'はじめに':s.ch===11?'ふりかえり':'第'+s.ch+'章　'+CH[s.ch].title}<span class="dots">${list.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</span>`;
  // progress
  const pr=$(document,'#prog');
  pr.innerHTML=CH.map(c=>`<button data-c="${c.n}" data-t="${c.n===0?'はじめに':c.n===11?'ふりかえり':c.n+'. '+c.title}" class="${c.n===s.ch?'cur':c.n<s.ch?'done':''}"></button>`).join('');
  pr.querySelectorAll('button').forEach(b=>b.onclick=()=>goCh(+b.dataset.c));
  // sidebar
  const solvedIdx=ch=>S.findIndex(x=>x.ch===ch&&x.type==='solve');
  const lit=ch=>cur>=solvedIdx(ch);
  let h='<h3>道具箱</h3><div class="sub">「困った！」を解決するたびに、技術がたまっていきます。下から上へ積み上がる <b>TCP/IPの4階層</b>です。</div><div class="stack">';
  [0,1,2,3].forEach(L=>{
    h+=`<div class="lay"><div class="ln"><i style="background:${LAYERS[L].c}"></i>${LAYERS[L].name}</div><div class="lr">${LAYERS[L].role}</div><div class="chips">`;
    CHIPS.filter(c=>c.L===L).forEach(c=>{const on=lit(c.ch);h+=`<span class="chip ${on?'lit':''} ${on&&c.ch===s.ch?'now':''}" data-ch="${c.ch}" style="${on?`background:${LAYERS[L].c};border-color:${LAYERS[L].c}`:''}">${c.t}</span>`;});
    h+='</div></div>';
  });
  h+='</div>';
  const c=CHIPS.find(x=>x.L===4),on=lit(c.ch);
  h+=`<div class="lay extra"><div class="ln"><i style="background:${LAYERS[4].c}"></i>${LAYERS[4].name}</div><div class="lr">${LAYERS[4].role}</div><div class="chips"><span class="chip ${on?'lit':''} ${on&&s.ch===10?'now':''}" data-ch="10" style="${on?`background:${LAYERS[4].c};border-color:${LAYERS[4].c}`:''}">${c.t}</span></div></div>`;
  side.innerHTML=h;
  side.querySelectorAll('.chip.lit').forEach(x=>x.onclick=()=>goCh(+x.dataset.ch,'solve'));
}
function go(i){if(i<0||i>=S.length)return;cur=i;render();}
function goCh(ch,type){const list=chSlides(ch);const t=type?list.find(i=>S[i].type===type):list[0];go(t!==undefined?t:list[0]);closeMenu();}
$(document,'#prev').onclick=()=>go(cur-1);
function showTeaser(t){
  if(t.classList.contains('show'))return;
  t.classList.add('show');
  if(!document.body.classList.contains('present'))setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'nearest'}),200);
}
// 「でも、まだ困ることが…」がまだ出ていなければ、次へで先にそれを出す
// ---- 授業モードのスライド風アニメーション ----
// 「次へ」を押すたびに、要素を1つずつ表示する（クリックで出てくるアニメーション）
function markBuilds(el,s){
  if(!document.body.classList.contains('present'))return;
  const kids=[...el.children], hi=kids.findIndex(k=>k.tagName==='H2');
  let items=[];
  if(s.type==='problem') items=kids.slice(hi+2);
  else if(s.type==='solve'){
    items=[...el.querySelectorAll('.points > .pt')];
    items.push(...kids.slice(hi+1).filter(k=>!k.classList.contains('solve')));
  }else if(s.type==='summary'){
    items=[...el.querySelectorAll('#bs > .lay')];
    if(items.length) items.push(...kids.filter(k=>k.classList.contains('story')));
    el.querySelectorAll('.row2 > div > .card').forEach(c=>items.push(c));
  }
  items.forEach(x=>x.classList.add('bld'));
}
function updNext(){
  const nb=$(document,'#next');
  const more=stage.querySelector('.bld:not(.in), .teaser:not(.show)');
  nb.textContent=cur===0?'はじめる →':(more?'つづき ▶':'次へ →');
  nb.disabled=cur===S.length-1&&!more;
}
function revealPending(){
  const b=stage.querySelector('.bld:not(.in)');
  if(b){b.classList.add('in');updNext();return true;}
  const t=stage.querySelector('.teaser:not(.show)');
  if(t){showTeaser(t);updNext();return true;}
  return false;
}
$(document,'#next').onclick=()=>{if(revealPending())return;go(cur+1);};
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();if(revealPending())return;go(cur+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  if(e.key==='Escape')closeMenu();
  if(e.key===' '&&document.querySelector('#stage .net, #stage .http')){e.preventDefault();setPause(!PAUSED);}
});
stage.addEventListener('click',e=>{
  if(e.target.closest('.clickable .ic')||e.target.closest('button,input,select,a'))return;
  if(e.target.closest('.net, .http'))setPause(!PAUSED);
});
$(document,'#speed').onchange=e=>{SPEED=+e.target.value;};
// menu
const menu=$(document,'#menu');
function openMenu(){
  $(document,'#menuBox').innerHTML='<h3>もくじ</h3>'+CH.map(c=>{const col=c.L!==undefined?LAYERS[c.L].c:'var(--ink)';return `<div class="item ${S[cur].ch===c.n?'cur':''}" data-c="${c.n}"><span class="k" style="background:${col}">${c.n===0?'・':c.n===11?'★':c.n}</span><div>${c.title}${c.tech?`<small>${c.tech}</small>`:''}</div></div>`;}).join('')+'<p class="small muted" style="margin-top:14px">URLの末尾に「#番号」をつけると、そのページから開けます（いまのページは #'+cur+'）。</p>';
  menu.hidden=false;
  menu.querySelectorAll('.item').forEach(x=>x.onclick=()=>goCh(+x.dataset.c));
}
function closeMenu(){menu.hidden=true;}
$(document,'#menuBtn').onclick=openMenu;
menu.onclick=e=>{if(e.target===menu)closeMenu();};
// 授業モード（全画面＋1画面に収める）
const PW=980;
function fit(){
  const sl=$(stage,'.slide'); if(!sl) return;
  if(!document.body.classList.contains('present')){sl.style.transform='';return;}
  const cs=getComputedStyle(stage);
  const W=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const sc=Math.max(.3,Math.min(W/PW,H/sl.offsetHeight,2.2));
  sl.style.transform=`translate(${Math.max(0,(W-PW*sc)/2)}px,0) scale(${sc})`;
}
let slideRO=window.ResizeObserver?new ResizeObserver(()=>fit()):null;
function observeSlide(){const sl=$(stage,'.slide');if(slideRO&&sl){slideRO.disconnect();slideRO.observe(sl);}fit();}
window.addEventListener('resize',fit);
function setPresent(on){
  document.body.classList.toggle('present',on);
  $(document,'#fsBtn').textContent=on?'全画面を終了':'全画面で授業';
  const d=document.documentElement;
  try{
    if(on&&!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});
    if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  }catch(e){}
  render();
  setTimeout(fit,60);setTimeout(fit,400);
}
$(document,'#fsBtn').onclick=()=>setPresent(!document.body.classList.contains('present'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present'))setPresent(false);});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='f'||e.key==='F')setPresent(!document.body.classList.contains('present'));});
// start
const h=parseInt((location.hash||'').slice(1),10);
cur=(h>=0&&h<S.length)?h:0;
render();
</script>
