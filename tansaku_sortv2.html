<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さがす・ならべるができるまで ― こむぎ堂のケーキ予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEED; --panel:#FFFFFF; --ink:#16324F; --ink-soft:#6B7C87; --rule:#DCE0DE; --grid:#E7EAE9;
  --accent:#C0392B; --blue:#1F5E80; --blue-l:#4F87A3; --band:#DCE8EF; --orange:#D08C2B; --green:#3E8E5A;
  --ok:#2F7A4A; --ng:#B23A2E;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.8}
header{background:var(--ink);padding:18px 26px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{font-family:var(--mincho);font-size:26px;font-weight:600;margin:0;letter-spacing:.08em;color:#fff}
header p{margin:0;color:#C3D2DC;font-size:13px;letter-spacing:.04em}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;color:#C3D2DC;font-size:12px;font-family:var(--mono)}
.progress .bar{width:140px;height:6px;background:#2E4A66}
.progress .bar i{display:block;height:100%;background:#fff;transition:width .3s}

.app{display:grid;grid-template-columns:250px 1fr;max-width:1240px;margin:0 auto;gap:22px;padding:22px 20px 80px;align-items:start}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static!important}}
.side{position:sticky;top:16px}
.nav{background:var(--panel);border:1px solid var(--rule)}
.savebox{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:12px 14px;margin-top:12px}
.savebox h4{margin:0 0 6px;font-size:13px;letter-spacing:.12em}
.savebox label{display:block;font-size:12px;color:var(--ink-soft);margin-top:6px}
.savebox select,.savebox input{width:100%;margin-top:2px}
.savebox input[type=text]{padding:7px 10px;font-family:var(--gothic);font-size:14px;color:var(--ink);border:1px solid var(--rule)}
.savebox .btn{width:100%;margin-top:8px}
.savebox .msg{font-size:12px;margin:6px 0 0;min-height:0}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-size:11px;text-decoration:underline;cursor:pointer;padding:0;margin-top:6px;font-family:var(--gothic)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:#fff;padding:11px 14px;font-family:var(--gothic);font-size:14px;color:var(--ink);cursor:pointer}
.nav button:last-child{border-bottom:0}
.nav button:hover{background:#F5F7F6}
.nav button.cur{background:var(--ink);color:#fff}
.nav .no{font-family:var(--mono);font-size:12px;width:22px;height:22px;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;flex:none}
.nav .done .no{background:var(--ok);border-color:var(--ok);color:#fff}
.nav button.cur.done .no{background:#fff;color:var(--ok)}

main{min-width:0}
.lesson-head{margin-bottom:16px}
.lesson-head .kicker{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.14em}
.lesson-head h2{font-family:var(--mincho);font-size:28px;font-weight:600;margin:2px 0 0;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--rule);padding:20px 22px;margin-bottom:14px}
.card h3{font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--ink);margin:-20px -22px 14px;padding:10px 22px;background:#EEF1F3;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:6px;height:20px;background:var(--accent);flex:none}
.card p{margin:.4em 0}
.card .lead{font-size:16px}

/* 会話 */
.talk{display:flex;gap:12px;margin:10px 0;align-items:flex-start}
.talk .who{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.talk .who.t{background:var(--orange)}
.talk .who.h{background:var(--blue)}
.talk .say{flex:1;min-width:0;background:#F7F5F0;border:1px solid #E8E2D6;padding:10px 16px;position:relative}
.talk .say::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:inherit;border-left:1px solid #E8E2D6;border-bottom:1px solid #E8E2D6;transform:rotate(45deg)}
.talk .who.h + .say::before{border-color:#D5E1EA}
.talk .who.h + .say{background:#EEF3F7;border-color:#D5E1EA}

/* 用語ボックス */
.term{border:2px solid var(--blue);background:#F4F8FB;margin:16px 0 6px}
.term .th{background:var(--blue);color:#fff;font-size:15px;font-weight:700;letter-spacing:.08em;padding:7px 14px;display:flex;align-items:center;gap:10px}
.term .th::before{content:"用語・知識";background:#fff;color:var(--blue);font-size:11px;font-weight:700;padding:1px 8px;letter-spacing:.1em}
.term .tb{padding:12px 16px}
.term dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:10px 16px;align-items:baseline}
.term dt{font-weight:700;color:var(--blue);font-size:16px;border-bottom:2px solid #C9DBE7;padding-bottom:2px}
.term dd{margin:0}
@media(max-width:600px){.term dl{grid-template-columns:1fr;gap:2px}.term dd{margin-bottom:10px}}
.term .ex{margin-top:10px;padding-top:10px;border-top:1px dashed #C9DBE7;font-size:14px}
.term .formula{background:#fff}
.formula{font-family:var(--mono);background:#FBFBFB;border:1px solid var(--rule);padding:8px 12px;display:inline-block;margin:4px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
.scale-card{border:1px solid var(--rule);padding:12px;background:#FBFBFB}
.scale-card .tag{font-size:11px;letter-spacing:.12em;color:var(--ink-soft)}
.scale-card h4{margin:2px 0 6px;font-family:var(--mincho);font-size:19px}
.scale-card ul{margin:6px 0 0;padding-left:1.1em;font-size:13px}
.qual{color:var(--orange)} .quan{color:var(--blue)}

/* ボタン類 */
button.btn{font-family:var(--gothic);font-size:14px;padding:8px 14px;background:#fff;color:var(--ink);border:1px solid var(--ink);cursor:pointer;letter-spacing:.04em}
button.btn:hover{background:var(--ink);color:#fff}
button.btn.primary{background:var(--ink);color:#fff}
button.btn.primary:hover{background:#0E2236}
button.btn:disabled{opacity:.4;cursor:default;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=number]{padding:7px 10px;font-family:var(--gothic);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule)}
input[type=number]{width:100px;font-family:var(--mono)}
input[type=range]{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;border-right:1px solid var(--ink);background:#fff;padding:6px 12px;font-family:var(--gothic);font-size:13px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}

/* 表 */
.tbl-wrap{overflow:auto;max-height:420px;border:1px solid var(--rule);scrollbar-gutter:stable}
.tbl-wrap table{width:max-content;min-width:100%}
.tbl-wrap td:last-child,.tbl-wrap th:last-child{padding-right:14px}
.excerpt{display:block;width:fit-content;max-width:100%;margin:12px auto 0}
.excerpt + .legend{text-align:center}
.excerpt table{min-width:0}
.excerpt td.gap{text-align:center;color:var(--ink-soft);background:#FAFAFA;letter-spacing:.3em}
.excerpt td.focus{outline:2px solid var(--orange);outline-offset:-2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:right;white-space:nowrap}
th{background:#F7F8F8;font-weight:400;color:var(--ink-soft);font-size:12px;position:sticky;top:0}
td.l,th.l{text-align:left}
td{font-family:var(--mono)}
td.miss{background:#FBEFD9;color:var(--orange)}
td.err{background:#F8E1DE;color:var(--ng);font-weight:700}
td.fest{background:#E6EEF4;color:var(--blue);font-weight:700}
table.stat td{font-size:14px}
table.stat th{position:static}
.chg{color:var(--accent)}

/* 尺度分類 */
.classify{display:grid;gap:8px}
.cl-row{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(280px,1fr) 28px;gap:14px;align-items:center;border:1px solid var(--rule);padding:10px 14px;background:#FCFCFC}
.cl-row .seg{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.cl-row .seg button{padding:8px 4px;font-size:14px}
.cl-row.checked{background:#fff}
.cl-row .name{font-weight:700}
.cl-row .name small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px;line-height:1.5}
.cl-row .name .ex{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.cl-row .mark{font-weight:700;font-size:18px}
.cl-row .why{grid-column:1/-1;font-size:13px;color:var(--ink-soft);display:none;border-top:1px dotted var(--rule);padding-top:6px}
.cl-row.checked .why{display:block}
@media(max-width:600px){.cl-row{grid-template-columns:1fr 24px}.cl-row .seg{grid-column:1/-1;order:3}}

/* クイズ */
.quiz{border:1px solid var(--rule);padding:14px 16px;margin:12px 0;background:#FCFCFC}
.quiz .q{font-weight:700;margin-bottom:8px}
.quiz .q .qn{font-family:var(--mono);color:var(--accent);margin-right:6px}
.quiz .opts{display:grid;gap:6px}
.quiz .opt{text-align:left;border:1px solid var(--rule);background:#fff;padding:8px 12px;font-family:var(--gothic);font-size:14px;cursor:pointer;color:var(--ink)}
.quiz .opt:hover{border-color:var(--ink)}
.quiz .opt.right{border-color:var(--ok);background:#E7F3EB}
.quiz .opt.wrong{border-color:var(--ng);background:#F8E5E2;text-decoration:line-through}
.quiz .fb{margin-top:10px;padding:8px 12px;font-size:14px;display:none}
.quiz .fb.show{display:block}
.quiz .fb.ok{background:#E7F3EB;border-left:3px solid var(--ok)}
.quiz .fb.ng{background:#F8E5E2;border-left:3px solid var(--ng)}
.quiz.solved{border-color:var(--ok)}

/* 数値パネル */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.stat{border:1px solid var(--rule);padding:8px 10px;background:#FBFBFB}
.stat span{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:20px;font-weight:400}
.stat.hl{border-color:var(--accent)}
.stat.hl b{color:var(--accent)}

svg{display:block;width:100%;height:auto}
.axis{stroke:#93A0A8;stroke-width:1}
.gl{stroke:var(--grid);stroke-width:1}
.tk{font-family:var(--mono);font-size:11px;fill:var(--ink-soft)}
.an{font-family:var(--gothic);font-size:13px;fill:var(--ink)}
.lb{font-family:var(--gothic);font-size:12px;fill:var(--ink)}
.legend{font-size:12px;color:var(--ink-soft);margin-top:4px}
.legend i{display:inline-block;width:12px;height:10px;vertical-align:middle;margin:0 4px 0 10px}

/* 相関の5段階 */
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:760px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.rcell{border:1px solid var(--rule);border-top:4px solid var(--c);background:#fff;padding:8px;text-align:center}
.rcell svg{border:1px solid var(--grid)}
.rcell b{display:block;color:var(--c);font-size:14px;margin-top:4px}
.rcell span{display:block;font-family:var(--mono);font-size:12px}
.rcell small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:2px}

/* 手計算 */
.calc td input{width:72px;padding:4px 6px;font-size:13px}
.calc td.okc input{border-color:var(--ok);background:#E7F3EB}
.calc td.ngc input{border-color:var(--ng);background:#F8E5E2}
.msg{font-size:14px;margin-top:8px;min-height:1.6em}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)}

/* 当てっこ */
.guess-score{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.rbig{font-family:var(--mono);font-size:30px}

.pager{display:flex;justify-content:space-between;margin-top:18px}
.done-badge{display:none;background:#E7F3EB;border:1px solid var(--ok);color:var(--ok);padding:8px 14px;font-size:14px;margin-top:6px}
.done-badge.show{display:block}
.warn{color:var(--ng);font-size:13px}
.hidden{display:none!important}
.summary li{margin:6px 0}
#gsvg,#esvg,#xsct{max-width:560px;margin-left:auto;margin-right:auto}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;padding:5px 8px;opacity:0;transition:opacity .12s;z-index:9;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= ポップ版 ================= */
:root{
  --paper:#FFF7E8; --panel:#FFFFFF; --ink:#263046; --ink-soft:#7A6F66; --rule:#EADFCF; --grid:#F3EADB;
  --accent:#FF5A5F; --blue:#2E86DE; --blue-l:#4DA3F0; --band:#FFE9A8; --orange:#FF9F1C; --green:#2EC4B6;
  --ok:#22A866; --ng:#F0474D; --dark:#2B2B2B; --yellow:#FFD23F; --mint:#2EC4B6;
  --mincho:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Kosugi Maru","Yu Gothic",sans-serif;
  --gothic:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Kosugi Maru","Yu Gothic",sans-serif;
}
body{background:#FFF7E8 radial-gradient(#F1DFBF 1.3px, transparent 1.5px) 0 0/20px 20px;font-weight:500}
/* カフェの日よけ（ストライプ＋波形のふち）と、コーヒー色の看板 */
header{position:relative;background:#5C3D2E;border-bottom:4px solid var(--dark);padding:52px 26px 18px}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;
  background:repeating-linear-gradient(90deg,#E8574C 0 36px,#FFF4E0 36px 72px);border-bottom:2.5px solid var(--dark)}
header::after{content:"";position:absolute;left:0;right:0;top:28px;height:14px;
  background:radial-gradient(circle at 18px 0,#E8574C 13px,transparent 13.5px) 0 0/72px 14px repeat-x,
             radial-gradient(circle at 54px 0,#FFF4E0 13px,transparent 13.5px) 0 0/72px 14px repeat-x;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
h1{font-weight:900;font-size:28px;letter-spacing:.04em;color:#FFF4E0;text-shadow:3px 3px 0 #2B1A12}
header p{color:#F2D7B6;font-weight:700}
.logo{width:44px;height:44px;flex:none;align-self:center}
.progress{color:#F2D7B6;font-weight:700}
.progress .bar{width:160px;height:14px;background:rgba(255,255,255,.45);border:2.5px solid var(--dark);border-radius:99px;overflow:hidden}
.progress .bar i{background:var(--yellow)}

.lesson-head .kicker{display:inline-block;background:var(--dark);color:var(--yellow);border-radius:99px;padding:1px 12px;font-weight:700}
.lesson-head h2{font-size:32px;font-weight:900;margin-top:6px}

.card{border:3px solid var(--dark);border-radius:20px;box-shadow:5px 5px 0 var(--dark);overflow:hidden}
.card h3{margin:-20px -22px 16px;background:var(--yellow);border-bottom:3px solid var(--dark);color:var(--dark);font-weight:900;font-size:19px}
.card h3::before{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2.5px solid var(--dark)}

.nav{border:3px solid var(--dark);border-radius:18px;overflow:hidden;box-shadow:4px 4px 0 var(--dark)}
.nav button{border-bottom:2px dashed var(--rule);font-weight:700}
.nav button:hover{background:#FFF4D6}
.nav button.cur{background:var(--blue);color:#fff}
.nav .no{border-radius:50%;border:2.5px solid currentColor;width:26px;height:26px;font-weight:700}
.nav .done .no{background:var(--ok);border-color:var(--dark)}

.savebox{border:3px solid var(--dark);border-radius:18px;box-shadow:4px 4px 0 var(--dark);background:#fff}
.savebox h4{font-size:15px;font-weight:900}
.savebox select,.savebox input[type=text]{border:2px solid var(--dark);border-radius:10px}

button.btn{border:2.5px solid var(--dark);border-radius:99px;box-shadow:3px 3px 0 var(--dark);font-weight:700;transition:transform .08s,box-shadow .08s}
button.btn:hover{background:#FFF1C9;color:var(--dark)}
button.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--dark)}
button.btn.primary{background:var(--accent);color:#fff}
button.btn.primary:hover{background:#FF7478;color:#fff}
button.btn:disabled{box-shadow:none}
select,input[type=number]{border:2px solid var(--dark);border-radius:10px}

.seg{border:2.5px solid var(--dark);border-radius:99px;overflow:hidden}
.seg button{border-right:2px solid var(--dark);font-weight:700}
.seg button:hover{background:#FFF1C9}
.seg button.on{background:var(--blue);color:#fff}

/* キャラクター */
.talk{gap:14px;align-items:flex-start}
.talk .who{width:74px;height:auto;border-radius:0;background:none!important;display:flex;flex-direction:column;align-items:center;color:var(--dark)}
.talk .who svg{width:70px;height:70px;border:3px solid var(--dark);border-radius:50%;background:#fff}
.talk .who .nm{font-size:12px;font-weight:900;background:var(--dark);color:#fff;border-radius:99px;padding:0 10px;margin-top:-10px;position:relative}
.talk .who.h .nm{background:var(--blue)}
.talk .who.t .nm{background:var(--orange)}
.talk .say{background:#FFF1DE;border:2.5px solid var(--dark);border-radius:18px;padding:12px 18px;margin-top:8px;font-size:15.5px}
.talk .say::before{border-color:var(--dark)!important;border-width:0 0 2.5px 2.5px;border-style:solid;top:22px;left:-8px;width:13px;height:13px}
.talk .who.h + .say{background:#E3F2FF;border-color:var(--dark)}

/* 用語・知識 */
.term{border:3px solid var(--dark);border-radius:18px;overflow:hidden;background:#EFFBF8;box-shadow:4px 4px 0 var(--dark)}
.term .th{background:var(--mint);color:var(--dark);border-bottom:3px solid var(--dark);font-weight:900;font-size:17px}
.term .th::before{content:"用語・知識";background:#fff;color:var(--dark);border:2px solid var(--dark);border-radius:99px;padding:0 10px}
.term dt{color:#14857A;border-bottom:3px dotted var(--mint)}
.term .ex{border-top:2px dashed #9ADDD5}
.term .formula{border:2px solid var(--dark);border-radius:8px}
.scale-card{border:2.5px solid var(--dark);border-radius:14px;background:#fff}
.scale-card h4{font-weight:900}

.cl-row{border:2.5px solid var(--dark);border-radius:16px;background:#fff}
.cl-row .seg{border-radius:12px}

.quiz{border:2.5px solid var(--dark);border-radius:18px;background:#FFFDF6}
.quiz .q .qn{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:0 9px;margin-right:8px}
.quiz .opt{border:2px solid var(--dark);border-radius:12px;font-weight:500}
.quiz .opt:hover{background:#FFF1C9;border-color:var(--dark)}
.quiz .opt.right{background:#D4F5E3;border-color:var(--ok)}
.quiz .opt.wrong{background:#FFE0E1;border-color:var(--ng)}
.quiz .fb{border-radius:12px}
.quiz.solved{border-color:var(--ok);box-shadow:0 0 0 4px #C6F0D8}

.stat{border:2px solid var(--dark);border-radius:14px;background:#fff}
.stat.hl{background:#FFE0E1;border-color:var(--dark)}
.tbl-wrap{border:2.5px solid var(--dark);border-radius:14px}
th{background:var(--band);color:var(--dark);font-weight:700}
.done-badge{border:2.5px solid var(--dark);border-radius:16px;background:#D4F5E3;color:#17804C;font-weight:900;box-shadow:3px 3px 0 var(--dark)}
.rcell{border:2px solid var(--dark);border-top:7px solid var(--c);border-radius:14px}
.rcell svg{border-radius:8px}
.calc td input{border:2px solid var(--dark);border-radius:8px}
#zval,#px{border-radius:10px}

/* ================= 用語・注意・対処の区別 ================= */
.term dt.t-warn,.term dt.t-how{justify-self:start;color:#fff;border:0;border-radius:4px;padding:2px 12px;font-size:14px;letter-spacing:.12em}
.term dt.t-warn{background:#C0392B}
.term dt.t-how{background:#2F7A4A}
.term dt.t-warn::before{content:"！";margin-right:2px}
.term dt.t-how::before{content:"→";margin-right:4px}
.term dd.t-warn{background:#FCECEA;border-left:4px solid #C0392B;padding:6px 12px}
.term dd.t-how{background:#E8F4EC;border-left:4px solid #2F7A4A;padding:6px 12px}
.qhint{font-size:12px;color:var(--ink-soft);margin-top:8px}

/* ================= 授業モード ================= */
.pres-btn{margin-left:16px;font-family:var(--gothic);font-size:14px;font-weight:700;padding:7px 16px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;border-radius:6px;letter-spacing:.06em}
.pres-btn:hover{background:#fff;color:var(--ink)}
body.present{overflow:hidden}
body.present header,body.present .side,body.present .pager,body.present .done-badge{display:none!important}
body.present .app{display:block;max-width:none;padding:0;margin:0}
body.present #main{position:fixed;left:0;right:0;top:0;bottom:64px;overflow-y:auto;padding:4vh 4vw 8vh;background:var(--paper);scroll-behavior:smooth}
body.present #main > *{zoom:var(--pz,1.35);max-width:1080px;margin-left:auto;margin-right:auto}
body.present #main > .pv-off{display:none!important}
body.present #main > .pv-on{animation:pvSlide .5s ease both}
body.present .lesson-head.pv-on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(78vh / var(--pz,1.35))}
body.present .lesson-head.pv-on .kicker{font-size:20px;letter-spacing:.2em}
body.present .lesson-head.pv-on h2{font-size:64px;margin-top:10px}
body.present .lesson-head.pv-on::after{content:"→ キーまたは「進む」で始めます";display:block;margin-top:28px;font-size:15px;color:var(--ink-soft)}
.pv-h{visibility:hidden!important;opacity:0}
.pv-in{animation:pvIn .5s ease both}
@keyframes pvIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pvSlide{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pv-in,body.present #main > .pv-on{animation:none}}
.pv-bar{display:none}
body.present .pv-bar{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;align-items:center;gap:10px;padding:0 18px;background:var(--ink);color:#fff;z-index:50}
.pv-bar button,.pv-bar select{font-family:var(--gothic);font-size:15px;font-weight:700;padding:6px 14px;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:6px;cursor:pointer}
.pv-bar select option{color:#222}
.pv-bar button:hover{background:#fff;color:var(--ink)}
.pv-bar #pvNext{background:#fff;color:var(--ink)}
.pv-bar .pv-info{flex:1;text-align:center;font-size:15px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar .sep{width:1px;height:30px;background:rgba(255,255,255,.35)}

/* ポップ版の調整 */
.term dt.t-warn,.term dt.t-how{border:2px solid var(--dark);border-radius:99px}
.term dt.t-warn{background:var(--ng)}
.term dt.t-how{background:var(--ok)}
.term dd.t-warn{background:#FFE8E9;border-left-color:var(--ng);border-radius:0 10px 10px 0}
.term dd.t-how{background:#DFF6EA;border-left-color:var(--ok);border-radius:0 10px 10px 0}
.pres-btn{border-radius:99px;border:2.5px solid #FFF4E0;color:#FFF4E0;box-shadow:3px 3px 0 #2B1A12}
.pres-btn:hover{background:#FFF4E0;color:#5C3D2E}
body.present .pv-bar{background:#5C3D2E;border-top:4px solid var(--dark)}
.pv-bar button,.pv-bar select{border-radius:99px}
.pv-bar #pvNext{background:var(--yellow);color:var(--dark);border-color:var(--dark)}
body.present #main{background:#FFF7E8 radial-gradient(#F1DFBF 1.3px, transparent 1.5px) 0 0/20px 20px}

/* 図：四分位数 */
.qfig{max-width:760px;margin:6px auto 4px;display:block;background:#fff;border:2px solid var(--dark);border-radius:14px}
.qf-cap{text-align:center;font-weight:700;margin:4px 0}
.qf-step{font-size:15px;font-weight:900;fill:#2B2B2B}
.qf-num{font-size:11px;font-weight:900;fill:#fff;font-family:var(--mono)}
.qf-lab{font-size:14px;font-weight:700}
.qf-sm{font-size:12.5px;font-weight:700}
.qf-val{font-size:15px;font-weight:900;font-family:var(--mono)}
/* やってみよう：正解・不正解をはっきり */
.card .msg.ok,.card .msg.ng{display:inline-block;padding:8px 16px;border-radius:12px;border:2.5px solid;font-weight:700;margin-top:10px}
.card .msg.ok{background:#D4F5E3;border-color:var(--ok);color:#13643D}
.card .msg.ng{background:#FFE0E1;border-color:var(--ng);color:#B0262C}
.card .msg.ok::before{content:"⭕ "}
.card .msg.ng::before{content:"✕ "}
.badge-ok,.badge-ng{display:inline-block;font-size:12px;font-weight:900;color:#fff;border:2px solid var(--dark);border-radius:99px;padding:0 8px;white-space:nowrap}
.badge-ok{background:var(--ok)}
.badge-ng{background:var(--ng)}
.cl-row{grid-template-columns:minmax(220px,1.1fr) minmax(280px,1fr) 64px}
.cl-row.ok{background:#E9F9F0;border-color:var(--ok);box-shadow:0 0 0 3px #C6F0D8}
.cl-row.ng{background:#FFF0F0;border-color:var(--ng);box-shadow:0 0 0 3px #FFD3D5}
.cl-row.ok .seg button.on{background:var(--ok)}
.cl-row.ng .seg button.on{background:var(--ng)}
.cl-row.ng .why{color:#B0262C;font-weight:700}
.seg button.on.good{background:var(--ok)}
.seg button.on.bad{background:var(--ng)}
.calc td.okc input{border:2.5px solid var(--ok);background:#D4F5E3;color:#13643D;font-weight:700}
.calc td.ngc input{border:2.5px solid var(--ng);background:#FFE0E1;color:#B0262C;font-weight:700}

/* ================= さがす・ならべる：アニメーション部品 ================= */
:root{--sp:1}
.b1,.b2{font-family:var(--gothic);font-size:14px;padding:6px 14px;border:2.5px solid var(--dark);border-radius:99px;box-shadow:3px 3px 0 var(--dark);font-weight:700;cursor:pointer;color:var(--dark);background:#fff;transition:transform .08s,box-shadow .08s}
.b1{background:var(--accent);color:#fff}
.b2:hover:not(:disabled){background:#FFF1C9}
.b1:active,.b2:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--dark)}
.b1:disabled,.b2:disabled{opacity:.35;cursor:default;box-shadow:none}
.b2.on{background:var(--blue);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.note{font-size:13px;color:var(--ink-soft)}
.pl{background:#fff;border:2.5px solid var(--dark);border-radius:16px;padding:14px 16px 10px;margin:10px 0}
.vwrap{position:relative}
.viz{position:relative;margin:0 auto;cursor:pointer}
.it{position:absolute;left:0;top:0;border:2.5px solid #C9BBA6;background:#fff;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:18px;font-family:var(--mono);transition:transform calc(var(--sp)*.45s) ease,background .2s,border-color .2s,opacity .25s,color .2s;z-index:2}
.it.cmp{border-color:#E0A21B;background:#FFF1C9;box-shadow:0 0 0 3px rgba(224,162,27,.3);z-index:3}
.it.found{background:#22A866;border-color:var(--dark);color:#fff}
.it.seen{opacity:.45}.it.out{opacity:.2}
.it.done{border-color:#14857A;background:#DDF4EF;color:#14857A}
.it.min{border-color:#F0474D;box-shadow:0 0 0 3px rgba(240,71,77,.25)}
.it.pivot{background:#8A5CC2;border-color:var(--dark);color:#fff}
.it.grp{border-color:#A9A0C8}
.it.gA{border-color:#2E86DE;background:#E1EEFB}.it.gB{border-color:#E07B1C;background:#FFE9D2}
.it.gA.cmp,.it.gB.cmp{border-color:#E0A21B;background:#FFF1C9}
.it.mg{border-color:#14857A;background:#DDF4EF}
.it.r0{background:#E1EEFB;border-color:#2E86DE}.it.r1{background:#FFE9D2;border-color:#E07B1C}.it.r2{background:#E3F5DF;border-color:#4A9A3A}.it.r3{background:#F0E6FA;border-color:#8A5CC2}
.it.elo{border-color:#2E86DE;border-width:3.5px}.it.ehi{border-color:#E07B1C;border-width:3.5px}
.it.hold{border-color:#8A5CC2;background:#F0E6FA;box-shadow:0 4px 10px rgba(138,92,194,.3)}
.dec{position:absolute;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);border-top:3px solid #C9BBA6;z-index:1}
.dec.bin{background:linear-gradient(#FFF7E8,rgba(255,247,232,0));border-radius:0 0 10px 10px}
.dec.bin.hot{border-top-color:#E0A21B;background:linear-gradient(#FFF1C9,rgba(255,241,201,0));color:#9A6A0C}
.bdl{position:absolute;inset:0;z-index:1;pointer-events:none}
.bd{position:absolute;border-radius:12px;border:2px dashed #B3A995;background:rgba(120,100,70,.04);transition:left calc(var(--sp)*.4s),top calc(var(--sp)*.4s),width calc(var(--sp)*.4s);color:#8A8070}
.bd i{position:absolute;left:4px;bottom:100%;font-style:normal;font-size:12.5px;font-weight:900;white-space:nowrap;line-height:1.5}
.bd i.bot{top:100%;bottom:auto}
.bd.A{border:2.5px solid #2E86DE;background:rgba(46,134,222,.08);color:#2E86DE}
.bd.B{border:2.5px solid #E07B1C;background:rgba(224,123,28,.08);color:#E07B1C}
.bd.ok{border:2.5px solid #14857A;background:rgba(20,133,122,.1);color:#14857A}
.bd.rng{border:2.5px solid #E0A21B;background:rgba(224,162,27,.1);color:#9A6A0C}
.bd.seg{border:2px dashed #8A5CC2;background:rgba(138,92,194,.05);color:#8A5CC2}
.bd.pair{border:2.5px solid #E0A21B;background:rgba(224,162,27,.15);color:#9A6A0C}
.bd.r0{border:2.5px solid #2E86DE;color:#2E86DE}.bd.r1{border:2.5px solid #E07B1C;color:#E07B1C}.bd.r2{border:2.5px solid #4A9A3A;color:#4A9A3A}.bd.r3{border:2.5px solid #8A5CC2;color:#8A5CC2}
.mkl{position:absolute;inset:0;pointer-events:none;z-index:4}
.mk{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:900;color:var(--ink-soft);white-space:nowrap;background:#FFF7E8;border-radius:6px;padding:0 6px;line-height:1.6;transition:left calc(var(--sp)*.3s)}
.mk.hot{color:var(--dark);background:#FFD23F}
.mk.mn{color:#fff;background:#F0474D}
.mk.rn{color:var(--ink);background:none}
.mk.lo{background:#2E86DE;color:#fff;font-size:14px;padding:1px 9px}
.mk.hi{background:#E07B1C;color:#fff;font-size:14px;padding:1px 9px}
.mk.chg{animation:pop calc(var(--sp)*.9s)}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.35);box-shadow:0 0 0 6px rgba(255,210,63,.6)}100%{transform:translateX(-50%) scale(1)}}
.rgx{display:inline-block;background:#fff;border:2px solid var(--dark);border-radius:10px;padding:0 10px;margin-bottom:2px;font-size:15px}
.rgx b.lo{color:#2E86DE;font-size:18px}.rgx b.hi{color:#E07B1C;font-size:18px}
.rgx.chg{animation:flash calc(var(--sp)*1s)}
@keyframes flash{0%,60%{background:#FFF1C9}100%{background:#fff}}
.pmsg{min-height:56px;margin-top:6px;background:#FFF7E8;border-radius:12px;padding:7px 12px;font-size:15.5px}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pctl .tip{font-size:12px;color:var(--ink-soft)}
.pctl .cnt{margin-left:auto;font-size:14px;color:var(--ink-soft)}
.pctl .cnt b{font-size:22px;color:var(--accent);font-family:var(--mono)}
.pz{position:absolute;right:0;top:-14px;background:rgba(43,43,43,.88);color:#fff;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6;white-space:nowrap}
.pz.on{opacity:1}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:16px;height:16px;border-radius:5px;border:2px solid #C9BBA6;background:#fff;display:inline-block}
.okc{color:var(--ok)}.ngc{color:var(--ng)}
/* 予約票 */
.target{display:inline-block;background:#FFD23F;color:var(--accent);border:3px solid var(--dark);border-radius:12px;box-shadow:3px 3px 0 var(--dark);padding:0 14px;font-weight:900;font-family:var(--mono);font-size:28px;line-height:1.3;margin:0 4px}
.flip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:12px 0}
@media(max-width:760px){.flip{grid-template-columns:repeat(4,1fr)}}
.flip button{aspect-ratio:3/4;border:2.5px solid var(--dark);border-radius:12px;background:repeating-linear-gradient(45deg,#F7C873 0 6px,#FBE3B0 6px 12px);font-size:20px;font-weight:900;cursor:pointer;color:transparent;font-family:var(--mono);transition:transform .15s}
.flip button:hover{transform:translateY(-3px)}
.flip button.op{background:#fff;color:var(--ink)}
.flip button.hit{background:var(--ok);color:#fff}
.flip button small{display:block;font-size:11px;font-family:var(--gothic)}
/* 数当て */
.guess{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guess input{width:110px;font-family:var(--mono);font-size:20px;padding:4px 10px;border:2.5px solid var(--dark);border-radius:10px;text-align:center}
.guess .big{font-size:22px;color:var(--accent);font-family:var(--mono)}
.hlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:96px;overflow:auto}
.hlog span{background:#FFF7E8;border:1.5px solid var(--rule);border-radius:8px;padding:1px 10px;font-size:14px;font-family:var(--mono)}
.hlog span.ok{background:var(--ok);color:#fff}
.range{height:28px;background:#FFF7E8;border:2px solid var(--dark);border-radius:10px;position:relative;margin-top:10px;overflow:hidden}
.range i{position:absolute;top:0;bottom:0;background:#DDF4EF;border-left:3px solid #14857A;border-right:3px solid #14857A;transition:left .3s,width .3s}
.range b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#14857A}
/* マージ */
.mpile{display:flex;gap:6px;align-items:center;min-height:54px}
.mpile .lb{width:90px;font-size:14px;font-weight:700;color:var(--ink-soft);flex:none}
.mpile .c{width:50px;height:46px;border:2.5px solid var(--dark);border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:18px;background:#fff;font-family:var(--mono)}
.mpile .c.head{cursor:pointer;box-shadow:0 0 0 4px #FFD23F}
.mpile .c.head:hover{background:#FFF1C9}
.mpile .c.o{background:#DDF4EF;border-color:#14857A}
.mpile.A .c:not(.o){background:#E1EEFB}.mpile.B .c:not(.o){background:#FFE9D2}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* くらべる */
.race{display:grid;gap:8px;margin-top:10px}
.race .r{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;font-size:14.5px;font-weight:700}
.race .bar{height:30px;background:#FFF7E8;border:2px solid var(--dark);border-radius:10px;position:relative;overflow:hidden}
.race .bar i{position:absolute;left:0;top:0;bottom:0;transition:width .6s}
.race .bar b{position:absolute;left:8px;top:0;line-height:27px;font-size:14px;font-family:var(--mono)}
@media(max-width:760px){.race .r{grid-template-columns:1fr}}
/* コップ */
.cups{display:flex;gap:36px;justify-content:center;margin:14px 0 8px}
.cup{display:flex;flex-direction:column;align-items:center;gap:4px}
.glass{width:92px;height:118px;border:3px solid var(--dark);border-top:0;border-radius:0 0 18px 18px;position:relative;background:#fff;overflow:hidden}
.glass .liq{position:absolute;left:0;right:0;bottom:0;transition:height .5s,background .3s}
.glass span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:16px;text-shadow:0 0 4px #fff}
/* プログラム */
.code,.code2{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.code{background:#2B2B2B;color:#FFF4E0;border-radius:12px;padding:10px 0;font-size:19px;margin:8px 0;line-height:1.8}
.code div{padding:1px 16px;border-left:5px solid transparent}
.code .did{color:#BFE3E1}
.code .cur{background:rgba(255,210,63,.2);border-left-color:#FFD23F;color:#fff}
.code2{background:#2B2B2B;color:#FFF4E0;border-radius:12px;padding:10px 16px;font-size:16px;margin:4px 0;line-height:1.7;white-space:pre}
.cap{font-size:12px;color:var(--ink-soft);font-weight:700}
.vars{display:flex;gap:14px;margin:6px 0 10px}
.var{display:flex;flex-direction:column;align-items:center;gap:2px}
.var span{font-family:var(--mono);font-weight:700;color:var(--ink-soft)}
.var b{width:72px;height:60px;border:2.5px solid var(--dark);border-radius:12px;background:#fff;display:grid;place-items:center;font-size:28px;font-family:var(--mono)}
.var.chg b{background:#FFF1C9;animation:pop2 .6s}
@keyframes pop2{40%{transform:scale(1.15)}}
.cells{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.cells span{min-width:40px;height:38px;border:2.5px solid var(--dark);border-radius:8px;display:grid;place-items:center;font-weight:900;font-family:var(--mono);background:#fff}
/* プリントの空欄 */
.pr{background:linear-gradient(transparent 52%,#FFF0A0 52%);border-bottom:2px dashed #E07B1C;padding:0 2px}
.pr::after{content:"✎";font-size:.62em;color:#E07B1C;vertical-align:super;margin-left:2px;font-weight:900}
.spdseg{margin-left:4px}
.spdseg button{padding:3px 10px;font-size:12px}
.tgtbox{display:flex;align-items:center;gap:10px;margin:0 auto 12px;width:fit-content;background:#FFD23F;border:3px solid var(--dark);border-radius:16px;box-shadow:4px 4px 0 var(--dark);padding:4px 18px 4px 14px}
.tgtbox[hidden]{display:none}
.tgtbox .tl{font-weight:900;font-size:16px;color:var(--dark)}
.tgtbox b{font-family:var(--mono);font-size:34px;font-weight:900;color:var(--accent);background:#fff;border:2.5px solid var(--dark);border-radius:10px;padding:0 14px;line-height:1.3}
.code2.qcode{display:block;width:fit-content;min-width:180px;margin:8px 0 2px;font-weight:500}
.mono{font-family:var(--mono)}
.pcard[hidden]{display:none}
.pcard .grid2{grid-template-columns:1fr 1fr;gap:10px}
.pcard .grid2>div{min-width:0}
.pcard .code2{overflow-x:auto;font-size:14px;max-width:100%}
@media(max-width:1100px){.pcard .grid2{grid-template-columns:1fr}}
#ptab{flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="lg"><ellipse cx="24" cy="26" rx="20" ry="16"/></clipPath></defs>
  <ellipse cx="24" cy="26" rx="20" ry="16" fill="#F7C873"/><g clip-path="url(#lg)" stroke="#D9963A" stroke-width="2.2"><path d="M0 10 L40 50 M10 0 L50 40 M-10 20 L30 60 M20 -6 L56 30 M48 6 L8 46 M38 -4 L-2 36 M58 16 L18 56"/></g>
  <ellipse cx="24" cy="26" rx="20" ry="16" fill="none" stroke="#2B2B2B" stroke-width="2.8"/></svg>
  <h1>さがす・ならべるができるまで</h1>
  <p>こむぎ堂のケーキ予約 ― レジの行列をなくすために、探し方と並べ方を考えよう</p>
  <div class="progress"><span id="progtext">0 / 5</span><div class="bar"><i id="progbar" style="width:0"></i></div></div>
  <button class="pres-btn" id="presBtn" title="先生が説明するための全画面表示">授業モード（全画面）</button>
</header>
<div class="app">
  <div class="side">
    <nav class="nav" id="nav"></nav>
    <div class="savebox">
      <h4>保存用ファイル</h4>
      <label>クラス<select id="sv-class"><option value="">選んでください</option></select></label>
      <label>出席番号<select id="sv-num"><option value="">選んでください</option></select></label>
      <label>名前<input type="text" id="sv-name" placeholder="例：情報 太郎" autocomplete="off"></label>
      <button class="btn primary" id="sv-save">保存する</button>

function player(host,o){
  host.classList.add('pl');
  host.innerHTML=`<div class="tgtbox" hidden></div><div class="vwrap"><div class="viz" title="クリックで自動再生／一時停止"></div><div class="pz">⏸ 一時停止中　図をクリックすると再開</div></div><div class="pmsg"></div>
  <div class="pctl"><button class="b2" data-a="r">⏮ 最初から</button><button class="b2" data-a="b">◀ 戻る</button><button class="b1" data-a="s">1手すすむ ▶</button><button class="b2" data-a="a">▶▶ 自動で再生</button>${o.extra||''}<span class="tip">図をクリック（タップ）でも再生／一時停止</span>${spd()}<span class="cnt"></span></div>`;
  const viz=Q(host,'.viz'),msg=Q(host,'.pmsg'),cnt=Q(host,'.cnt'),bA=Q(host,'[data-a=a]'),pz=Q(host,'.pz');
  const RH=o.rh||58,CHH=o.chh||46,TOP=o.top||0;

    for(const key in mkEls)if(!seen[key]){mkEls[key].remove();delete mkEls[key];}

    if(k>=frames.length-1&&timer){stop();}

/* ===== アルゴリズム（動き） ===== */
function fLinear(items,t){
  const R=rec(),s=R.st;items.forEach((it,i)=>s.pos[it.id]={c:i,r:0});s.n={比較:0};
  R.snap(`探す値は <b>${t}</b>。先頭から順に、1つずつ比べていきます。`);
  for(let i=0;i<items.length;i++){const it=items[i];s.cls[it.id]='cmp';s.n.比較++;s.mk=[{key:'p',c:i,r:1,t:'▲ '+(i+1)+'番目',k:'hot',dy:-4}];
    if(it.v===t){s.cls[it.id]='found';R.snap(`${i+1}番目の <b>${it.v}</b> と比べる → <b class="okc">見つかった！</b>`);return R.fr;}
    R.snap(`${i+1}番目の <b>${it.v}</b> と比べる → ${t} ではない`);s.cls[it.id]='seen';}
  s.mk=[];R.snap(`最後まで比べましたが、<b>${t}</b> はありませんでした。「無い」とわかるまでに、<b>全部（${items.length}回）</b>比べています。`);return R.fr;
}
function fBinary(items,t){
  const R=rec(),s=R.st,n=items.length,Y=.45;items.forEach((it,i)=>s.pos[it.id]={c:i,r:Y});s.n={比較:0};
  const V=i=>items[i].v;let lo=0,hi=n-1,mid=null;
  const paint=()=>{items.forEach((it,i)=>{let c=s.cls[it.id]||'';c=c.replace(/\s?e(lo|hi)/g,'');if(c==='out'||c==='found'){s.cls[it.id]=c;return;}
      if(lo<=hi&&i===lo)c+=' elo';if(lo<=hi&&i===hi)c+=' ehi';s.cls[it.id]=c.trim();});};
  const set=chg=>{s.mk=[];if(mid!=null)s.mk.push({key:'mid',c:mid,r:0,t:'真ん中',k:'hot',dy:2});
    if(lo<=hi){if(lo===hi)s.mk.push({key:'lo',c:lo,r:Y,dy:50,t:`左端＝右端 ${V(lo)}`,k:'lo'+(chg?' chg':'')});
      else{s.mk.push({key:'lo',c:lo,r:Y,dy:50,t:`左端 ${V(lo)}`,k:'lo'+(chg==='lo'?' chg':'')});s.mk.push({key:'hi',c:hi,r:Y,dy:50,t:`右端 ${V(hi)}`,k:'hi'+(chg==='hi'?' chg':'')});}
      s.bd=[{c1:lo,c2:hi,r:Y,k:'rng'}];}else s.bd=[];paint();};
  const rg=chg=>lo<=hi?`<span class="rgx${chg?' chg':''}">探す範囲：左端 <b class="lo">${V(lo)}</b> 〜 右端 <b class="hi">${V(hi)}</b>（残り${hi-lo+1}個）</span><br>`:'';
  set();R.snap(rg()+`データは<b>小さい順に整列済み</b>です。探す値は <b>${t}</b>。左端（いちばん小さい）から右端（いちばん大きい）までが探す範囲です。`);
  while(lo<=hi){mid=Math.floor((lo+hi)/2);const it=items[mid];s.cls[it.id]='cmp';set();s.n.比較++;
    if(it.v===t){s.cls[it.id]='found';set();R.snap(rg()+`真ん中（${mid+1}番目）の <b>${it.v}</b> と比べる → <b class="okc">見つかった！</b>`);return R.fr;}
    if(it.v<t){R.snap(rg()+`真ん中の <b>${it.v}</b> は ${t} より<b>小さい</b> → ${t} があるなら<b>右側</b>`);
      for(let j=lo;j<=mid;j++)s.cls[items[j].id]='out';lo=mid+1;mid=null;set('lo');
      R.snap(rg(true)+(lo<=hi?`<b>左端</b>が ${V(lo)} に変わりました。${it.v}以下はもう見なくてよい。`:`探す範囲がなくなりました。`));}
    else{R.snap(rg()+`真ん中の <b>${it.v}</b> は ${t} より<b>大きい</b> → ${t} があるなら<b>左側</b>`);
      for(let j=mid;j<=hi;j++)s.cls[items[j].id]='out';hi=mid-1;mid=null;set('hi');
      R.snap(rg(true)+(lo<=hi?`<b>右端</b>が ${V(hi)} に変わりました。${it.v}以上はもう見なくてよい。`:`探す範囲がなくなりました。`));}}
  R.snap(`<b>${t}</b> はありません。それでも比較は <b>${s.n.比較}回</b>で済みました。`);return R.fr;
}
function fRadix(items){
  const R=rec(),s=R.st;let order=items.slice();order.forEach((it,i)=>s.pos[it.id]={c:i,r:0});s.n={箱に入れた:0};
  R.snap('カードの束です。まず<b>一の位</b>を見て、0〜9の10個の箱に仕分けます。');
  [0,1].forEach(d=>{
    const nm=d?'十の位':'一の位',hd='hd'+d,bins=[...Array(10)].map(()=>[]);let prev=null;order.forEach(it=>s.cls[it.id]=hd);
    order.forEach(it=>{const dg=d?Math.floor(it.v/10):it.v%10;if(prev)s.cls[prev.id]=hd;
      s.cls[it.id]=hd+' cmp';s.hot=dg;s.pos[it.id]={c:dg,r:2+bins[dg].length*.85};bins[dg].push(it);s.n.箱に入れた++;prev=it;
      R.snap(`<b>${it.v}</b> の${nm}は <b>${dg}</b> → 「${dg}」の箱へ`);});

function guessGame(el,max,opt){
  opt=opt||{};const F=x=>x.toLocaleString('ja-JP');
  el.innerHTML=`<div class="guess"><input type="number" min="1" max="${max}" aria-label="予想" style="width:${max>1000?150:110}px"><button class="b1 g">予想する</button><button class="b2 r">新しい数で</button>${opt.auto?'<button class="b1 au" style="background:var(--plum)">二分探索の作戦で当てる（自動）</button>':''}${opt.give?'<button class="b2 gv">答えを見る</button>':''}<span class="note" style="margin-left:auto">予想した回数 <b class="big gc">0</b> 回</span></div>
  <div class="range"><i style="left:0;width:100%"></i><b></b></div><div class="hlog"></div><div class="pmsg" style="margin-top:10px"></div>`;
  let ans,lo,hi,c,done,auto=null;const inp=Q(el,'input'),M=Q(el,'.pmsg');
  const show=()=>{const bar=Q(el,'.range i');bar.style.left=((lo-1)/max*100)+'%';bar.style.width=Math.max(.4,(hi-lo+1)/max*100)+'%';
    Q(el,'.range b').textContent=lo===hi?`${F(lo)} しかない！`:`${F(lo)}〜${F(hi)} のどこか（残り${F(hi-lo+1)}個）`;Q(el,'.gc').textContent=c;};
  const reset=()=>{clearTimeout(auto);ans=1+rnd(max);lo=1;hi=max;c=0;done=false;Q(el,'.hlog').innerHTML='';M.innerHTML=opt.start||'数を入れて「予想する」を押そう。';show();};
  const guess=g=>{if(done||!(g>=1&&g<=max))return;c++;const s=document.createElement('span');s.textContent=F(g);
    if(g===ans){done=true;s.className='ok';lo=hi=g;M.innerHTML=`<b class="okc">正解！</b> ${c}回で当たりました。`+(opt.win?opt.win(c):'');}
    else if(g<ans){s.textContent+=' ↑';lo=Math.max(lo,g+1);M.innerHTML=`${F(g)} より<b>大きい</b>です。`;}
    else{s.textContent+=' ↓';hi=Math.min(hi,g-1);M.innerHTML=`${F(g)} より<b>小さい</b>です。`;}
    if(!done&&opt.hintAt&&c===opt.hintAt)M.innerHTML+=opt.hint;
    const lg=Q(el,'.hlog');lg.appendChild(s);lg.scrollTop=lg.scrollHeight;show();};
  Q(el,'.g').onclick=()=>{guess(+inp.value);inp.select();};
  inp.onkeydown=e=>{if(e.key==='Enter'){guess(+inp.value);inp.select();}};
  Q(el,'.r').onclick=reset;
  if(opt.give)Q(el,'.gv').onclick=()=>{if(!done)M.innerHTML=`答えは <b>${F(ans)}</b> でした。`;};
  if(opt.auto)Q(el,'.au').onclick=()=>{reset();const step=()=>{if(done)return;const g=Math.floor((lo+hi)/2);inp.value=g;guess(g);
      if(!done){M.innerHTML+=` → 残り ${F(lo)}〜${F(hi)} の真ん中 <b>${F(Math.floor((lo+hi)/2))}</b> を予想します。`;auto=setTimeout(step,1300*SPEED);}};auto=setTimeout(step,500*SPEED);};
  reset();return()=>clearTimeout(auto);
}
function sortPlayer(el,sel,fn,opt){

  const P=player(Q(el,sel),Object.assign({cols:8,rows:1.5,top:22,maxW:76,extra:'<button class="b2" data-x="sh">カードを変える</button>'},opt));

function codeStep(host,o){
  host.innerHTML=`<div class="code"></div><div class="vars"></div><div class="btns"><button class="b1 st">1行実行 ▶</button><button class="b2 rs">⏮ 最初から</button></div><div class="pmsg"></div>`;
  let k,v,chg;
  const draw=()=>{
    Q(host,'.code').innerHTML=o.lines.map((l,i)=>`<div class="ln ${i===k-1?'cur':''} ${i<k?'did':''}">${l[0]}</div>`).join('');
    Q(host,'.vars').innerHTML=o.vars.map(n=>`<div class="var ${chg===n?'chg':''}"><span>${n}</span><b>${v[n]??'<small style="font-size:13px;color:var(--sub)">空</small>'}</b></div>`).join('');
    Q(host,'.st').disabled=k>=o.lines.length;};
  const reset=()=>{k=0;v={};chg=null;Q(host,'.pmsg').innerHTML='「1行実行」で、変数の中身がどう変わるか確かめよう。';draw();};
  Q(host,'.st').onclick=()=>{const [t,to,fr]=o.lines[k];v[to]=typeof fr==='number'?fr:v[fr];chg=to;k++;
    Q(host,'.pmsg').innerHTML=`<span class="mono">${t}</span> → <b>${to}</b> に ${typeof fr==='number'?fr:fr+' の値 '+v[to]} を入れる`+(k===o.lines.length?`<br>${o.end(v)}`:'');draw();};
  Q(host,'.rs').onclick=reset;reset();
}

    ${quiz("L3-q2", 2, "入れかえに tmp が必要なのはなぜ？", [["プログラムを短くするため",0],["a = b とすると、a の元の値が上書きされて消えてしまうから",1],["Python では変数を2つまでしか使えないから",0]],

  const reset=()=>{st={A:'j',B:'t',C:null};log=[];$("cm").className='msg';$("cm").textContent='どの順番で注げば入れかえられるかな？';draw();};

    else{$("cm").className='msg';$("cm").textContent=`${NM[x]}の${DR[st[y]][0]}を${NM[y]}へ注ぎました。`;}});
  $("crs").onclick=reset;reset();
  codeStep($("c1"),{vars:['a','b','tmp'],lines:[['a = 5','a',5],['b = 8','b',8],['tmp = a','tmp','a'],['a = b','a','b'],['b = tmp','b','tmp']],end:v=>{solve("L3-code");return `<b class="okc">a は ${v.a}、b は ${v.b}。入れかわりました！</b>`;}});

} });

 { t:"二分探索", d:"整列済みのデータの真ん中と比べ、探す値が無い側の半分を捨てる。",
   dn:`Data = [3, 7, 12, 18, 21, 26, 30, 35,
        41, 47, 52, 58, 63, 70, 76]
target = 21
left = 0
right = 要素数(Data) - 1
found = -1
left <= right かつ found == -1 の間繰り返す:
｜ mid = (left + right) ÷ 2
｜ もし Data[mid] == target ならば:
｜ ｜ found = mid
｜ そうでなくもし Data[mid] < target ならば:
｜ ｜ left = mid + 1
｜ そうでなければ:
｜ ｜ right = mid - 1
表示する(found)`,
   py:`data = [3, 7, 12, 18, 21, 26, 30, 35,
        41, 47, 52, 58, 63, 70, 76]
target = 21
left = 0
right = len(data) - 1
found = -1
while left <= right and found == -1:
    mid = (left + right) // 2
    if data[mid] == target:
        found = mid
    elif data[mid] < target:
        left = mid + 1
    else:
        right = mid - 1
print(found)`,
   out:"4　（添字4、つまり5番目の 21 で見つかった。見つからなければ −1）",
   vars:[["left","探す範囲の左端の添字"],["right","探す範囲の右端の添字"],["mid","真ん中の添字"],["found","見つかった添字（まだなら −1）"]],
   note:"共通テスト用プログラム表記の「÷」は、割り算の商の整数部分です。Python では「//」を使います。" },
 { t:"バブルソート", d:"となりどうしを比べ、逆なら入れかえる。",
   dn:`Data = [5, 3, 8, 1, 6]
n = 要素数(Data)
i を 0 から n - 2 まで 1 ずつ増やしながら繰り返す:
｜ j を 0 から n - 2 - i まで 1 ずつ増やしながら繰り返す:
｜ ｜ もし Data[j] > Data[j + 1] ならば:
｜ ｜ ｜ tmp = Data[j]
｜ ｜ ｜ Data[j] = Data[j + 1]
｜ ｜ ｜ Data[j + 1] = tmp
表示する(Data)`,
   py:`data = [5, 3, 8, 1, 6]
n = len(data)
for i in range(n - 1):
    for j in range(n - 1 - i):
        if data[j] > data[j + 1]:
            tmp = data[j]
            data[j] = data[j + 1]
            data[j + 1] = tmp
print(data)`,
   out:"[1, 3, 5, 6, 8]",
   vars:[["i","何周目か（右から i 個はもう決まっている）"],["j","比べるとなりどうしの左側の添字"],["tmp","入れかえのとき値をあずける変数"]] },
 { t:"選択ソート", d:"まだ整列していない部分から一番小さいものを選び、その先頭と入れかえる。",
   dn:`Data = [5, 3, 8, 1, 6]
n = 要素数(Data)
i を 0 から n - 2 まで 1 ずつ増やしながら繰り返す:
｜ min = i
｜ j を i + 1 から n - 1 まで 1 ずつ増やしながら繰り返す:
｜ ｜ もし Data[j] < Data[min] ならば:
｜ ｜ ｜ min = j
｜ tmp = Data[i]
｜ Data[i] = Data[min]
｜ Data[min] = tmp
表示する(Data)`,
   py:`data = [5, 3, 8, 1, 6]
n = len(data)
for i in range(n - 1):
    min = i
    for j in range(i + 1, n):
        if data[j] < data[min]:
            min = j
    tmp = data[i]
    data[i] = data[min]
    data[min] = tmp
print(data)`,
   out:"[1, 3, 5, 6, 8]",
   vars:[["i","いま決める位置（整列していない部分の先頭）"],["min","いまのところ一番小さい値の添字"],["j","min と比べる値の添字"],["tmp","入れかえのとき値をあずける変数"]] },
 { t:"挿入ソート", d:"1枚ずつ取り出し、並んだ部分の正しい位置に差し込む。",

｜ card = Data[i]
｜ j = i - 1
｜ j >= 0 かつ Data[j] > card の間繰り返す:
｜ ｜ Data[j + 1] = Data[j]
｜ ｜ j = j - 1
｜ Data[j + 1] = card
表示する(Data)`,
   py:`data = [5, 3, 8, 1, 6]
n = len(data)
for i in range(1, n):
    card = data[i]

    while j >= 0 and data[j] > card:

print(data)`,

   vars:[["i","取り出すカードの添字"],["card","取り出したカードの値"],["j","card と比べる値の添字（左へ進む）"]] },
];

    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '));
  });
}

    rr(80, y, W - 160, 54, 14); g.fillStyle = ok ? "#E9F9F0" : "#FAF7F2"; g.fill(); g.lineWidth = 2.5; g.strokeStyle = ok ? "#22A866" : "#D8CFC2"; g.stroke();
    g.beginPath(); g.arc(118, y + 27, 18, 0, Math.PI*2); g.fillStyle = ok ? "#22A866" : "#fff"; g.fill(); g.lineWidth = 2.5; g.strokeStyle = DARK; g.stroke();
    txt(ok ? "✓" : (L.no || String(LESSONS.indexOf(L))), 118, y + 28, 18, ok ? "#fff" : DARK, 900, "center");
    txt((extra.includes(L) ? "" : `レッスン${LESSONS.indexOf(L)}　`) + L.title, 152, y + 28, 22, INK, 700);
    txt(`正解 ${sc} / ${L.req.length}`, W - 300, y + 28, 20, SOFT, 700, "right");
    rr(W - 270, y + 11, 160, 32, 16); g.fillStyle = ok ? "#22A866" : "#fff"; g.fill(); g.lineWidth = 2.5; g.strokeStyle = ok ? DARK : "#BDB3A6"; g.stroke();
    txt(ok ? "完了" : "未完了", W - 190, y + 28, 18, ok ? "#fff" : SOFT, 900, "center");
  });
  txt("※ 正解数は、やってみよう・確認問題で、いま正しく答えられている数です。", 80, H - 64, 16, SOFT, 500);

  c.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const name = (st.name || "").replace(/[\\/:*?"<>|\s]/g, "");
    a.download = `達成状況_${st.class || ""}${st.number ? String(st.number).padStart(2, "0") + "番" : ""}${name ? "_" + name : ""}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    svMsg("達成状況を画像で保存しました。", true);
  }, "image/png");
}
$("sv-img").onclick = saveAchievementImage;
$("sv-load").onclick = () => $("sv-file").click();
$("sv-file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if (j.format !== "teishutsu/1" || j.appId !== APP_ID) throw new Error("この教材のファイルではありません。");
      STATE = { done: j.data.done || {}, solved: j.data.solved || {}, ans: j.data.ans || {}, student: j.student };
      save();
      $("sv-class").value = j.student.class || ""; $("sv-num").value = j.student.number || ""; $("sv-name").value = j.student.name || "";
      go(CUR); svMsg(`読み込みました（${j.student.class} ${j.student.number}番 ${j.student.name}）。`, true);
    } catch (err){ svMsg(err.message.startsWith("この") ? err.message : "ファイルを読み込めませんでした。", false); }
  };
  fr.readAsText(f);
};
$("sv-reset").onclick = () => {
  if (!confirm("すべての学習の記録を消しますか？（クラス・番号・名前は残ります）")) return;
  STATE = { done: {}, solved: {}, ans: {}, student: STATE.student }; save(); go(0);
};

/* ================= 授業モード（全画面・スライド表示） =================
   ・#main の中のかたまり（タイトル・カード）を1枚ずつのスライドとして表示する
   ・スライドの中身（セリフ、表、用語の1項目など）は、→ キーを押すたびに1つずつ現れる
   ・→ / PageDown / スペース：進む　← / PageUp：戻る　Esc：終了（プレゼン用リモコンも使える） */
const PV = { on: false, slides: [], si: 0, units: [], step: 0, toEnd: false };
let PZ = 1.35;
try { const z = parseFloat(localStorage.getItem(KEY + "-pz")); if (z >= 0.8 && z <= 2.4) PZ = z; } catch (e) {}
document.body.insertAdjacentHTML("beforeend", `<div class="pv-bar">
  <button id="pvPrev">◀ 戻る</button><button id="pvNext">進む ▶</button><span class="sep"></span>
  <select id="pvLesson" aria-label="レッスンを選ぶ"></select>
  <span class="pv-info" id="pvInfo"></span>
  <button id="pvAll">このスライドを全部表示</button><span class="sep"></span>
  <button id="pvMinus" title="文字を小さく">文字 −</button><button id="pvPlus" title="文字を大きく">文字 ＋</button><span class="sep"></span>
  <button id="pvExit">終了</button></div>`);
/* グラフ（散布図・箱ひげ図・数値の欄など）は最初から表示する。セリフのイラストや用語の囲みは除く */
const isGraph = el => !el.classList.contains("talk") && !el.classList.contains("term") &&
  (el.tagName.toLowerCase() === "svg" || el.classList.contains("stats") || !!el.querySelector("svg"));
function pvUnits(slide){
  const units = [];
  const termUnits = t => {
    const tb = t.querySelector(".tb"); if (!tb) return;
    [...tb.children].forEach(c => {
      if (isGraph(c)) return;
      if (c.tagName === "DL"){ const k = [...c.children]; for (let i = 0; i < k.length; i += 2) units.push([k[i], k[i+1]].filter(Boolean)); }
      else units.push([c]);
    });
  };
  if (slide.classList.contains("lesson-head")) return units;
  if (slide.classList.contains("term")){ termUnits(slide); return units; }
  const h3 = slide.querySelector(":scope > h3");
  if (h3 && h3.textContent.trim().startsWith("やってみよう")) return units;   /* 操作する場面は最初から全部見せる */
  [...slide.children].forEach(c => {
    if (c.tagName === "H3") return;
    if (isGraph(c)) return;   /* グラフは最初から表示 */
    if (c.classList.contains("legend") && units.length){ units[units.length - 1].push(c); return; }   /* 凡例は表・グラフといっしょに */
    units.push([c]);
    if (c.classList.contains("term")) termUnits(c);
  });
  return units;
}
function pvClear(){
  PV.slides.forEach(sl => { sl.classList.remove("pv-on", "pv-off"); sl.querySelectorAll(".pv-h,.pv-in").forEach(x => x.classList.remove("pv-h", "pv-in")); });
}
function pvBuild(){
  PV.slides = [...$("main").children].filter(el => !el.classList.contains("pager") && !el.classList.contains("done-badge"));
  $("pvLesson").innerHTML = LESSONS.map((L, i) => `<option value="${i}"${i === CUR ? " selected" : ""}>${label(i)}</option>`).join("");
}
function pvShow(si, revealAll){
  pvClear();
  PV.slides.forEach(sl => sl.classList.add("pv-off"));
  PV.si = si;
  const sl = PV.slides[si];
  sl.classList.remove("pv-off"); void sl.offsetWidth; sl.classList.add("pv-on");
  PV.units = pvUnits(sl);
  PV.step = revealAll ? PV.units.length : Math.min(1, PV.units.length);   /* 1つ目は最初から表示 */
  PV.units.forEach((u, k) => { if (k >= PV.step) u.forEach(x => x.classList.add("pv-h")); });
  const m = $("main"); m.style.scrollBehavior = "auto"; m.scrollTop = revealAll ? m.scrollHeight : 0; m.style.scrollBehavior = "";
  pvInfo();
}
function pvInfo(){
  const n = PV.units.length;
  $("pvInfo").textContent = `スライド ${PV.si + 1} / ${PV.slides.length}` + (n ? `　・　表示 ${PV.step} / ${n}` : "");
  $("pvAll").disabled = PV.step >= n;
}
function pvNext(){
  if (PV.step < PV.units.length){
    const u = PV.units[PV.step++];
    u.forEach(x => { x.classList.remove("pv-h"); void x.offsetWidth; x.classList.add("pv-in"); });
    u[u.length - 1].scrollIntoView({ behavior: "smooth", block: "nearest" });
    pvInfo(); return;
  }
  if (PV.si < PV.slides.length - 1) return pvShow(PV.si + 1);
  if (CUR < LESSONS.length - 1) go(CUR + 1);
}
function pvPrev(){
  if (PV.step > 1){
    const u = PV.units[--PV.step];
    u.forEach(x => { x.classList.remove("pv-in"); x.classList.add("pv-h"); });
    pvInfo(); return;
  }
  if (PV.si > 0) return pvShow(PV.si - 1, true);
  if (CUR > 0){ PV.toEnd = true; go(CUR - 1); }
}
function pvAll(){
  while (PV.step < PV.units.length) PV.units[PV.step++].forEach(x => { x.classList.remove("pv-h"); x.classList.add("pv-in"); });
  pvInfo();
}
function pvZoom(d){
  PZ = Math.min(2.4, Math.max(0.8, Math.round((PZ + d) * 10) / 10));
  document.documentElement.style.setProperty("--pz", PZ);
  try { localStorage.setItem(KEY + "-pz", PZ); } catch (e) {}
}
function pvEnter(){
  PV.on = true;
  document.documentElement.style.setProperty("--pz", PZ);
  document.body.classList.add("present");
  pvBuild(); pvShow(0);
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
}
function pvExit(){
  if (!PV.on) return;
  PV.on = false;
  pvClear();
  document.body.classList.remove("present");
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  window.scrollTo(0, 0);
}
/* レッスンを切りかえたら、スライドを作り直す */
const goNormal = go;
go = function(i){
  goNormal(i);
  if (PV.on){ pvBuild(); const end = PV.toEnd; PV.toEnd = false; pvShow(end ? PV.slides.length - 1 : 0, end); }
};
$("presBtn").onclick = pvEnter;
$("pvNext").onclick = pvNext; $("pvPrev").onclick = pvPrev; $("pvAll").onclick = pvAll;
$("pvMinus").onclick = () => pvZoom(-0.1); $("pvPlus").onclick = () => pvZoom(0.1);
$("pvExit").onclick = pvExit;
$("pvLesson").onchange = e => go(Number(e.target.value));
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && PV.on) pvExit(); });
document.addEventListener("keydown", e => {
  if (!PV.on) return;
  const t = e.target;
  if (t && t.matches && t.matches("input, select, textarea")){ if (e.key === "Escape") t.blur(); return; }
  if (t && t.tagName === "BUTTON") t.blur();
  if (["ArrowRight", "PageDown", " ", "Spacebar"].includes(e.key)){ e.preventDefault(); pvNext(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); pvPrev(); }
  else if (e.key === "Escape") pvExit();
});

go(0);
</script>
</body>
