<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>よみとき道場｜共通テスト用プログラム表記 読解トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+1+Code:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --card:#fff; --ink:#2B2D42; --sub:#6B7280; --navy:#1F3864; --navy2:#2E4A7D;
  --orange:#F28C28; --orange-d:#D9701A; --orange-l:#FFE9D3; --mint:#22A867; --mint-l:#DDF6E8;
  --red:#E5484D; --red-l:#FDE3E4; --yellow:#FFD166; --yellow-l:#FFF3CF; --line:#EFE3D1;
  --code-bg:#FFFDF8; --purple:#7C3AED; --fs:1;
  --r:18px; --shadow:0 4px 0 rgba(43,45,66,.08), 0 8px 24px rgba(43,45,66,.06);
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;font-weight:500;line-height:1.7;
  background-image:radial-gradient(#F3E3CB 1.2px, transparent 1.2px);background-size:22px 22px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-weight:700;color:inherit;cursor:pointer;border:none;background:none;font-size:1rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
code,.mono{font-family:"M PLUS 1 Code",ui-monospace,monospace}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,247,236,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.hdr-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;color:var(--navy)}
.logo small{display:block;font-size:.62rem;color:var(--sub);font-weight:700;line-height:1.2}
.logo .t{line-height:1.15}
.hdr .sp{flex:1}
.hbtn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;font-size:.85rem;color:var(--navy)}
.hbtn:hover{background:#fff}
.hbtn .lb{display:inline}
@media (max-width:560px){.hbtn .lb{display:none}.hbtn{font-size:1.1rem;padding:6px 8px}.logo small{display:none}}

main{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line)}
h2.sec{font-size:1.1rem;color:var(--navy);margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .pill{font-size:.75rem;background:var(--orange-l);color:var(--orange-d);padding:1px 10px;border-radius:99px}

/* home */
.hero{display:flex;gap:16px;align-items:center;padding:18px 20px}
.hero .owl{flex:0 0 auto}
.bubble{position:relative;background:var(--yellow-l);border:2px solid #F6DFA0;border-radius:16px;padding:10px 14px;font-weight:700}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:#F6DFA0}
.hero h1{margin:0 0 4px;font-size:1.35rem;color:var(--navy);font-weight:900;line-height:1.35}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stat{background:#F7F2EA;border-radius:12px;padding:4px 12px;font-size:.85rem;color:var(--sub)}
.stat b{color:var(--ink);font-size:1.05rem;margin-left:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media (max-width:820px){.acts{grid-template-columns:repeat(2,1fr)}}
.act{position:relative;text-align:left;padding:16px 16px 14px;border-radius:var(--r);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.act .ic{font-size:1.7rem;line-height:1}
.act .nm{display:block;font-size:1.08rem;font-weight:900;margin-top:6px}
.act .ds{display:block;font-size:.78rem;opacity:.92;font-weight:700}
.act.o{background:var(--orange)} .act.n{background:var(--navy)} .act.m{background:var(--mint)} .act.y{background:#F2B705;color:#3b2c00}
.badge{position:absolute;top:10px;right:12px;background:#fff;color:var(--red);border-radius:99px;font-size:.8rem;padding:0 9px;font-weight:900;min-width:26px;text-align:center}
.act[disabled]{opacity:.55;cursor:default}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;background:#fff;border-radius:var(--r);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .1s}
.unit:hover{transform:translateY(-2px)}
.unit .ui{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto}
.unit .un{font-weight:900;font-size:1rem}
.unit .us{font-size:.75rem;color:var(--sub);font-weight:700;line-height:1.4}
.unit .bar{height:7px;background:#F1E9DC;border-radius:9px;margin-top:6px;overflow:hidden}
.unit .bar i{display:block;height:100%;border-radius:9px}
.unit .cnt{font-size:.72rem;color:var(--sub);margin-top:2px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.links{grid-template-columns:1fr}}
.lnk{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;background:#fff;border:2px solid var(--line);border-radius:var(--r)}
.lnk .ic{font-size:1.5rem}
.lnk small{display:block;color:var(--sub);font-size:.75rem}
.note{font-size:.8rem;color:var(--sub);margin:14px 6px 0}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.xbtn{width:38px;height:38px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:1.1rem;flex:0 0 auto}
.prog{flex:1;height:14px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FFB15C);border-radius:99px;transition:width .3s}
.qnum{font-weight:900;color:var(--navy);font-size:.95rem;white-space:nowrap}
.star{width:38px;height:38px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:1.2rem;color:#C9BFAE;flex:0 0 auto}
.star.on{color:#F2B705;border-color:#F6DFA0;background:var(--yellow-l)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.qgrid{grid-template-columns:minmax(0,1fr)}}
.qcard{padding:16px 18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:900;padding:2px 10px;border-radius:99px;background:#F4EEE4;color:var(--sub)}
.qtitle{font-size:1.2rem;font-weight:900;color:var(--navy);margin:2px 0 6px}
.qtext{margin:0 0 12px}
.fig{background:#2B2D42;color:#fff;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:.95rem;white-space:pre;line-height:1.5}
.fig .cap{display:block;font-size:.7rem;color:#C8CCE0;font-family:"Zen Maru Gothic",sans-serif;margin-bottom:2px}
.acard{padding:16px 18px;position:sticky;top:76px}
@media (max-width:900px){.acard{position:static}}
.alabel{font-size:.85rem;font-weight:900;color:var(--sub);margin:0 0 8px}

/* code */
@media (max-width:560px){.code{font-size:.86rem !important}}
.code{background:var(--code-bg);border:2px solid #EADFCB;border-radius:14px;padding:10px 0;overflow-x:auto;font-family:"M PLUS 1 Code",ui-monospace,monospace;font-size:.95rem;line-height:1.55}
.cl{display:flex;align-items:stretch;min-height:1.9em;padding-right:14px;white-space:pre;position:relative}
.cl .no{flex:0 0 auto;width:3.4em;text-align:right;padding-right:.7em;color:#B6A98F;font-size:.82em;user-select:none;display:flex;align-items:center;justify-content:flex-end}
.cl .g{flex:0 0 auto;width:1.5em;border-left:2px solid #C9BBA0;margin-left:.15em}
.cl .g.end{border-bottom:2px solid #C9BBA0;margin-bottom:.45em;border-bottom-left-radius:3px}
.cl .tx{display:block;align-self:center;white-space:pre;padding-left:.2em}
.cl.sel{cursor:pointer}
.cl.sel:hover{background:#FFF1DD}
.cl.pick{background:#FFE3BF}
.cl.pick .no{color:var(--orange-d);font-weight:700}
.cl.right{background:var(--mint-l)} .cl.right .no{color:var(--mint);font-weight:700}
.cl.wrong{background:var(--red-l)} .cl.wrong .no{color:var(--red);font-weight:700}
.cl.hl{background:#FFE7A8}
.cl.hl:before{content:"▶";position:absolute;left:4px;top:50%;transform:translateY(-50%);color:var(--orange-d);font-size:.7em}
.cl.errl{background:var(--red-l)}
.k{color:var(--navy);font-weight:700} .s{color:#1E7A46} .nmb{color:#C2410C} .fn{color:var(--purple);font-weight:600} .v{color:#2B2D42}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;padding:0 .5em;margin:0 .15em;border:2px dashed var(--orange);border-radius:8px;background:#FFF4E6;color:var(--orange-d);font-weight:700;height:1.6em;font-family:"Zen Maru Gothic",sans-serif}
.blank.filled{border-style:solid;background:#FFE8CC;color:var(--ink);font-family:"M PLUS 1 Code",monospace;font-weight:400}
.blank.filled .bl{font-family:"Zen Maru Gothic";font-size:.7em;color:var(--orange-d);font-weight:900;margin-right:.4em}
.blank.ok{border-color:var(--mint);background:var(--mint-l)} .blank.ng{border-color:var(--red);background:var(--red-l)}

/* answer UI */
.bgroup{margin-bottom:14px}
.bhead{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:6px}
.bhead .bx{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:8px;border:2px solid var(--orange);color:var(--orange-d);background:#FFF4E6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;background:#fff;border:2px solid var(--line);border-radius:14px;font-weight:700;transition:transform .06s,border-color .1s;box-shadow:0 3px 0 #EFE3D1}
.opt:hover{border-color:#F3C48F}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #EFE3D1}
.opt .mk{flex:0 0 auto;font-size:1.15rem;line-height:1.35;color:var(--orange-d)}
.opt .ot{flex:1;min-width:0;word-break:break-all}
.opt .ot.mono{font-weight:400;font-size:.92rem;line-height:1.6}
.opt.on{border-color:var(--orange);background:#FFF4E6;box-shadow:0 3px 0 #F3C48F}
.opt.ok{border-color:var(--mint);background:var(--mint-l);box-shadow:0 3px 0 #A9E3C4}
.opt.ng{border-color:var(--red);background:var(--red-l);box-shadow:0 3px 0 #F4B4B6}
.opt[disabled]{cursor:default}
.opt .res{flex:0 0 auto;font-size:1rem}
.inbox{display:flex;gap:8px}
.inbox input{flex:1;min-width:0;font-size:1.4rem;padding:10px 14px;border-radius:14px;border:2px solid var(--line);font-family:"M PLUS 1 Code",monospace;background:#fff;color:var(--ink)}
.inbox input.ok{border-color:var(--mint);background:var(--mint-l)} .inbox input.ng{border-color:var(--red);background:var(--red-l)}
.linepick{padding:12px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--sub);font-weight:700}
.linepick b{color:var(--orange-d);font-size:1.3rem}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{flex:1;min-width:140px;padding:12px 16px;border-radius:14px;font-weight:900;font-size:1rem;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.pri{background:var(--orange);color:#fff}
.btn.nav{background:var(--navy);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 #EFE3D1;color:var(--navy)}
.btn.sm{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:.88rem}
.hintbox{margin-top:12px;background:var(--yellow-l);border:2px solid #F6DFA0;border-radius:14px;padding:10px 12px;font-size:.92rem}
.fb{margin-top:16px;border-radius:16px;padding:14px;border:2px solid}
.fb.ok{background:var(--mint-l);border-color:#A9E3C4}
.fb.ng{background:var(--red-l);border-color:#F4B4B6}
.fbhead{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:900}
.fb.ok .fbhead{color:#16834F} .fb.ng .fbhead{color:#C2353A}
.fbhead small{display:block;font-size:.8rem;color:var(--sub);font-weight:700}
.exp{background:#fff;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.exp .lb{font-weight:900;color:var(--navy);font-size:.85rem;display:block;margin-bottom:2px}
.correct-ans{font-size:.92rem;margin-top:8px}
.correct-ans code{background:#fff;padding:1px 6px;border-radius:6px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
.result{padding:24px;text-align:center}
.score{font-size:3rem;font-weight:900;color:var(--navy);line-height:1}
.score small{font-size:1.2rem;color:var(--sub)}
.rlist{text-align:left;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#FBF7F1;border:2px solid var(--line)}
.ritem .ok{color:var(--mint);font-weight:900;font-size:1.2rem}
.ritem .ng{color:var(--red);font-weight:900;font-size:1.2rem}
.ritem .rt{flex:1;font-weight:700}
.ritem small{color:var(--sub)}

/* select */
.sel-sec{padding:16px 18px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-size:.9rem;font-weight:700;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sel-h{font-weight:900;color:var(--navy);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sel-h button{font-size:.78rem;color:var(--orange-d)}

/* records */
.rec-top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.rec-top{grid-template-columns:repeat(2,1fr)}}
.rbox{padding:14px;text-align:center}
.rbox .n{font-size:1.8rem;font-weight:900;color:var(--navy);line-height:1.2}
.rbox .l{font-size:.78rem;color:var(--sub);font-weight:700}
.urow{display:grid;grid-template-columns:9em 1fr 4.5em;gap:10px;align-items:center;padding:6px 0}
.urow .ubar{height:14px;background:#F1E9DC;border-radius:9px;overflow:hidden;position:relative}
.urow .ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.urow .pct{text-align:right;font-weight:900;font-size:.9rem}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.qi{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;background:#fff;border:2px solid var(--line);border-radius:12px;font-size:.88rem}
.qi .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:#E5DCCD}
.qi .dot.ok{background:var(--mint)} .qi .dot.ng{background:var(--red)} .qi .dot.rv{background:var(--orange)}
.qi .qt{flex:1;font-weight:700}
.qi .st{color:#F2B705}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--sub);margin:4px 2px 10px}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* guide */
.gtable{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem}
.gtable th,.gtable td{padding:9px 10px;border-bottom:2px solid #F3EADC;text-align:left;vertical-align:top}
.gtable th{background:#F7F1E7;color:var(--navy);font-weight:900;font-size:.82rem}
.gtable td code{font-size:.88rem;white-space:pre-wrap}
.gtable td.py code{color:#3776AB}
.gwrap{overflow-x:auto;padding:4px}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tip{padding:14px 16px}
.tip .tn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;margin-right:6px}
.tip h3{margin:0 0 6px;font-size:1rem;color:var(--navy);display:flex;align-items:center}
.tip p{margin:0;font-size:.9rem}

/* save */
textarea.code-area{width:100%;min-height:110px;font-family:"M PLUS 1 Code",monospace;font-size:.8rem;border:2px solid var(--line);border-radius:12px;padding:10px;background:#FFFDF8;color:var(--ink);word-break:break-all}

/* trace overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,45,66,.55);display:flex;align-items:stretch;justify-content:center;padding:14px}
@media (max-width:700px){.ov{padding:0}}
.tr{background:var(--bg);width:100%;max-width:1180px;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media (max-width:700px){.tr{border-radius:0}}
.tr-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff}
.tr-h .tt{font-weight:900;flex:1;line-height:1.3}
.tr-h .tt small{display:block;font-size:.72rem;color:#CAD5EA;font-weight:700}
.tr-h button{color:#fff}
.tr-b{flex:1;overflow:auto;display:grid;align-content:start;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:14px}
@media (max-width:900px){.tr-b{grid-template-columns:minmax(0,1fr);gap:10px;padding:10px}}
.tr-code{max-height:100%;overflow:auto}
@media (max-width:900px){.tr-code{max-height:38vh}}
.tnote{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;min-height:62px}
.tnote .stp{flex:0 0 auto;font-size:.72rem;background:var(--orange);color:#fff;border-radius:99px;padding:1px 9px;margin-top:3px}
.tnote.t{border-color:#A9E3C4;background:var(--mint-l)} .tnote.f{border-color:#F4B4B6;background:var(--red-l)}
.tnote.e{border-color:var(--red);background:var(--red-l);color:#B42318}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vh{font-size:.8rem;font-weight:900;color:var(--sub);margin:12px 2px 4px}
.var{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.var .vn{font-family:"M PLUS 1 Code",monospace;font-weight:700;color:var(--navy);min-width:4em}
.var .vv{font-family:"M PLUS 1 Code",monospace;font-size:1.05rem}
.var.chg{border-color:var(--orange);background:#FFF4E6}
.arr{display:flex;flex-wrap:wrap;gap:3px}
.cell{display:flex;flex-direction:column;align-items:center;min-width:2.4em}
.cell .ix{font-size:.62rem;color:var(--sub);font-family:"M PLUS 1 Code",monospace}
.cell .cv{border:2px solid #E3D6C0;border-radius:6px;padding:0 6px;min-width:2.4em;text-align:center;font-family:"M PLUS 1 Code",monospace;background:#FFFDF8;font-size:.92rem}
.cell .cv.chg{border-color:var(--orange);background:#FFE3BF;font-weight:700}
.grid2{border-collapse:collapse;font-family:"M PLUS 1 Code",monospace;font-size:.88rem}
.grid2 td,.grid2 th{border:2px solid #E3D6C0;padding:1px 7px;text-align:center;background:#FFFDF8;min-width:2.4em}
.grid2 th{background:transparent;border:none;color:var(--sub);font-size:.65rem;font-weight:400}
.grid2 td.chg{border-color:var(--orange);background:#FFE3BF;font-weight:700}
.console{background:#1E2235;color:#E7F6E9;border-radius:12px;padding:10px 12px;font-family:"M PLUS 1 Code",monospace;font-size:.92rem;min-height:56px;max-height:180px;overflow:auto;white-space:pre-wrap}
.console .ln.new{color:#FFD166}
.console .empty{color:#7F8AA8}
.tr-c{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-top:2px solid var(--line);flex-wrap:wrap}

<script>
// 共通テスト用プログラム表記 ミニ実行エンジン（トレース用）
(function (G) {
  class DError extends Error { constructor(msg, line) { super(msg); this.line = line; } }
  class StepLimit extends Error {}

  const toHalf = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const OPS2 = ['**', '==', '!=', '>=', '<='];
  const OPS1 = ['>', '<', '+', '-', '*', '/', '÷', '%', '％', '(', ')', '[', ']', ',', '=', '×', '≧', '≦', '≠'];
  const ID_RE = /^[A-Za-z_぀-ヿ㐀-鿿Ａ-Ｚａ-ｚ][A-Za-z0-9_぀-ヿ㐀-鿿]*/u;

  function tokenize(s, line) {
    const toks = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t' || c === '　') { i++; continue; }
      if (c === '"' || c === '「') {
        const close = c === '"' ? '"' : '」'; let j = i + 1;
        while (j < s.length && s[j] !== close) j++;
        if (j >= s.length) throw new DError('文字列の " が閉じていません', line);
        toks.push({ t: 'str', v: s.slice(i + 1, j) }); i = j + 1; continue;
      }
      if (/[0-9０-９]/.test(c)) {
        const m = s.slice(i).match(/^[0-9０-９]+(\.[0-9]+)?/);
        toks.push({ t: 'num', v: Number(toHalf(m[0])) }); i += m[0].length; continue;
      }
      const two = s.substr(i, 2);
      if (OPS2.includes(two)) { toks.push({ t: 'op', v: two }); i += 2; continue; }
      if (OPS1.includes(c)) {
        let v = c;
        if (v === '％') v = '%'; if (v === '×') v = '*'; if (v === '≧') v = '>='; if (v === '≦') v = '<='; if (v === '≠') v = '!=';
        toks.push({ t: 'op', v }); i++; continue;
      }
      const m = s.slice(i).match(ID_RE);
      if (m) { toks.push({ t: 'id', v: m[0] }); i += m[0].length; continue; }
      throw new DError('読めない文字があります: ' + c, line);
    }
    return toks;
  }

  function Parser(toks, line) {
    let p = 0;
    const peek = () => toks[p];
    const isOp = v => toks[p] && toks[p].t === 'op' && toks[p].v === v;
    const isId = v => toks[p] && toks[p].t === 'id' && toks[p].v === v;
    const expect = v => { if (!isOp(v)) throw new DError(`「${v}」が必要です`, line); p++; };
    function expr() { return or(); }
    function or() { let a = and(); while (isId('or')) { p++; a = { t: 'bin', op: 'or', a, b: and() }; } return a; }
    function and() { let a = not(); while (isId('and')) { p++; a = { t: 'bin', op: 'and', a, b: not() }; } return a; }
    function not() { if (isId('not')) { p++; return { t: 'un', op: 'not', a: not() }; } return cmp(); }
    function cmp() {
      const a = add();
      const k = peek();
      if (k && k.t === 'op' && ['==', '!=', '>', '<', '>=', '<='].includes(k.v)) { p++; return { t: 'bin', op: k.v, a, b: add() }; }
      return a;
    }
    function add() {
      let a = mul();
      while (isOp('+') || isOp('-')) { const op = toks[p++].v; a = { t: 'bin', op, a, b: mul() }; }
      return a;
    }
    function mul() {
      let a = unary();
      while (isOp('*') || isOp('/') || isOp('÷') || isOp('%')) { const op = toks[p++].v; a = { t: 'bin', op, a, b: unary() }; }
      return a;
    }
    function unary() { if (isOp('-')) { p++; return { t: 'un', op: '-', a: unary() }; } return pow(); }
    function pow() { const a = post(); if (isOp('**')) { p++; return { t: 'bin', op: '**', a, b: unary() }; } return a; }
    function post() {
      let a = prim();
      for (;;) {
        if (isOp('[')) { p++; const idx = [expr()]; while (isOp(',')) { p++; idx.push(expr()); } expect(']'); a = { t: 'idx', a, idx }; }
        else if (isOp('(') && a.t === 'var') { p++; const args = []; if (!isOp(')')) { args.push(expr()); while (isOp(',')) { p++; args.push(expr()); } } expect(')'); a = { t: 'call', name: a.name, args }; }
        else break;
      }
      return a;
    }
    function prim() {
      const k = toks[p];
      if (!k) throw new DError('式が途中で終わっています', line);
      if (k.t === 'num' || k.t === 'str') { p++; return { t: 'lit', v: k.v }; }
      if (k.t === 'id') { p++; return { t: 'var', name: k.v }; }
      if (isOp('(')) { p++; const e = expr(); expect(')'); return e; }
      if (isOp('[')) { p++; const items = []; if (!isOp(']')) { items.push(expr()); while (isOp(',')) { p++; items.push(expr()); } } expect(']'); return { t: 'arr', items }; }
      throw new DError('式の書き方がおかしいところがあります', line);
    }
    return { expr, done: () => p >= toks.length, rest: () => toks.slice(p) };
  }

  function parseExpr(s, line) {
    const ps = Parser(tokenize(s, line), line);
    const e = ps.expr();
    if (!ps.done()) throw new DError('式の後ろに余分なものがあります', line);
    return e;
  }

  function parseProgram(src) {
    const raw = src.replace(/\r/g, '').split('\n');
    const lines = raw.map((s, i) => {
      const m = s.match(/^( *)(.*)$/);
      return { no: i + 1, ind: Math.floor(m[1].length / 2), text: m[2].trim() };
    });
    let i = 0;
    function block(level) {
      const out = [];
      while (i < lines.length) {
        const L = lines[i];
        if (L.text === '') { i++; continue; }
        if (L.ind < level) break;
        if (L.ind > level) throw new DError('字下げ（インデント）がおかしいです', L.no);
        out.push(stmt(level));
      }
      return out;
    }
    function body(level, no) {
      const b = block(level + 1);
      if (b.length === 0) throw new DError('ブロックの中身がありません', no);
      return b;
    }
    function stmt(level) {
      const L = lines[i]; const t = L.text; let m;
      if ((m = t.match(/^もし (.+) ならば[:：]$/))) {
        i++;
        const br = [{ cond: parseExpr(m[1], L.no), condText: m[1], line: L.no, body: body(level, L.no) }];
        let els = null, elseLine = null;
        while (i < lines.length && lines[i].ind === level) {
          const t2 = lines[i].text; let m2;
          if ((m2 = t2.match(/^そうでなくもし (.+) ならば[:：]$/))) { const no = lines[i].no; i++; br.push({ cond: parseExpr(m2[1], no), condText: m2[1], line: no, body: body(level, no) }); }
          else if (/^そうでなければ[:：]$/.test(t2)) { elseLine = lines[i].no; i++; els = body(level, elseLine); break; }
          else break;
        }
        return { k: 'if', line: L.no, br, els, elseLine };
      }
      if ((m = t.match(/^(\S+) を (.+?) から (.+?) まで (.+?) ずつ(増やし|減らし)ながら繰り返す[:：]$/))) {
        i++;
        return { k: 'for', line: L.no, v: m[1], from: parseExpr(m[2], L.no), to: parseExpr(m[3], L.no), step: parseExpr(m[4], L.no), toText: m[3], inc: m[5] === '増やし', body: body(level, L.no) };
      }
      if ((m = t.match(/^(.+) の間繰り返す[:：]$/))) {
        i++;
        return { k: 'while', line: L.no, cond: parseExpr(m[1], L.no), condText: m[1], body: body(level, L.no) };
      }
      if (/^(そうでなくもし|そうでなければ)/.test(t)) throw new DError('「もし」がないのに「そうでなければ」があります', L.no);
      i++;
      const toks = tokenize(t, L.no);
      let depth = 0, eq = -1;
      toks.forEach((k, j) => {
        if (k.t !== 'op') return;
        if (k.v === '(' || k.v === '[') depth++;
        else if (k.v === ')' || k.v === ']') depth--;
        else if (k.v === '=' && depth === 0 && eq < 0) eq = j;
      });
      if (eq >= 0) {
        const lp = Parser(toks.slice(0, eq), L.no); const lhs = lp.expr();
        if (!lp.done() || (lhs.t !== 'var' && lhs.t !== 'idx')) throw new DError('代入の左側がおかしいです', L.no);
        const rp = Parser(toks.slice(eq + 1), L.no); const rhs = rp.expr();
        if (!rp.done()) throw new DError('式の後ろに余分なものがあります', L.no);
        return { k: 'assign', line: L.no, lhs, rhs, lhsText: t.split('=')[0].trim() };
      }
      const ep = Parser(toks, L.no); const e = ep.expr();
      if (!ep.done()) throw new DError('この行は読めません', L.no);
      return { k: 'expr', line: L.no, e };
    }
    const prog = block(0);
    return { prog, lines };
  }

  // ---------- 値の表示 ----------
  function fmt(v) {
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(+v.toPrecision(10));
    if (typeof v === 'string') return v;
    if (typeof v === 'boolean') return v ? '真' : '偽';
    if (Array.isArray(v)) return '[' + v.map(x => typeof x === 'string' ? '"' + x + '"' : fmt(x)).join(', ') + ']';
    return String(v);
  }
  const clone = v => Array.isArray(v) ? v.map(clone) : v;

  // ---------- 実行 ----------
  function makeRunner(funcs) {
    const env = { vars: {}, order: [], out: [] };
    const builtins = Object.assign({
      '要素数': a => { if (Array.isArray(a) || typeof a === 'string') return a.length; throw new Error('要素数() には配列を渡します'); },
      '整数': x => Math.trunc(x),
      '乱数': () => Math.random(),
    }, funcs || {});
    let curLine = 0;
    const err = msg => new DError(msg, curLine);

    function ev(n) {
      switch (n.t) {
        case 'lit': return n.v;
        case 'var':
          if (n.name === 'true' || n.name === '真') return true;
          if (n.name === 'false' || n.name === '偽') return false;
          if (!(n.name in env.vars)) throw err(`変数「${n.name}」にまだ値が入っていません`);
          return env.vars[n.name];
        case 'arr': return n.items.map(ev);
        case 'idx': {
          let b = ev(n.a);
          for (const ie of n.idx) {
            const k = ev(ie);
            if (!Array.isArray(b) && typeof b !== 'string') throw err('配列ではないものに添字をつけています');
            if (!Number.isInteger(k) || k < 0 || k >= b.length) throw err(`添字 ${fmt(k)} は範囲外です（0〜${b.length - 1}）`);
            b = b[k];
          }
          return b;
        }
        case 'call': {
          const f = builtins[n.name];
          if (n.name === '表示する') return undefined;
          if (!f) throw err(`関数「${n.name}」は定義されていません`);
          return f(...n.args.map(ev));
        }
        case 'un': { const a = ev(n.a); return n.op === 'not' ? !a : -a; }
        case 'bin': {
          if (n.op === 'and') return ev(n.a) && ev(n.b);
          if (n.op === 'or') return ev(n.a) || ev(n.b);
          const a = ev(n.a), b = ev(n.b);
          switch (n.op) {
            case '+': return (typeof a === 'string' || typeof b === 'string') ? fmt(a) + fmt(b) : a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/': if (b === 0) throw err('0で割ろうとしました'); return a / b;
            case '÷': if (b === 0) throw err('0で割ろうとしました'); return Math.floor(a / b);
            case '%': if (b === 0) throw err('0で割ろうとしました'); return a - Math.floor(a / b) * b;
            case '**': return a ** b;
            case '==': return a === b;
            case '!=': return a !== b;
            case '>': return a > b; case '<': return a < b; case '>=': return a >= b; case '<=': return a <= b;
          }
        }
      }
      throw err('計算できない式です');
    }
    function setVar(name, v) { if (!(name in env.vars)) env.order.push(name); env.vars[name] = v; }
    function assign(lhs, v) {
      if (lhs.t === 'var') { setVar(lhs.name, clone(v)); return lhs.name; }
      let b = ev(lhs.a);
      const ks = lhs.idx.map(ev);
      for (let j = 0; j < ks.length; j++) {
        const k = ks[j];
        if (!Array.isArray(b)) throw err('配列ではないものに添字をつけています');
        if (!Number.isInteger(k) || k < 0 || k >= b.length) throw err(`添字 ${fmt(k)} は範囲外です（0〜${b.length - 1}）`);
        if (j === ks.length - 1) b[k] = clone(v); else b = b[k];
      }
      return lhs.a.name;
    }
    const tf = c => c ? '成り立つ（真）' : '成り立たない（偽）';

    function* runBlock(stmts) { for (const s of stmts) yield* runStmt(s); }
    function* runStmt(s) {
      curLine = s.line;
      if (s.k === 'assign') {
        const v = ev(s.rhs); const name = assign(s.lhs, v);
        yield { line: s.line, note: `${s.lhsText} に ${typeof v === 'string' ? '"' + v + '"' : fmt(v)} を代入`, ch: name };
      } else if (s.k === 'expr') {
        if (s.e.t === 'call' && s.e.name === '表示する') {
          const text = s.e.args.map(a => fmt(ev(a))).join('');
          env.out.push(text);
          yield { line: s.line, note: `「${text}」を表示`, show: true };
        } else { ev(s.e); yield { line: s.line, note: '関数を実行' }; }
      } else if (s.k === 'if') {
        for (const b of s.br) {
          curLine = b.line;
          const c = ev(b.cond);
          yield { line: b.line, note: `条件 ${b.condText} は ${tf(c)}`, cond: !!c };
          if (c) { yield* runBlock(b.body); return; }
        }
        if (s.els) { yield { line: s.elseLine, note: 'どの条件も成り立たないので「そうでなければ」へ' }; yield* runBlock(s.els); }
      } else if (s.k === 'while') {
        for (;;) {
          curLine = s.line;
          const c = ev(s.cond);
          yield { line: s.line, note: `条件 ${s.condText} は ${tf(c)}` + (c ? ' → 中を実行' : ' → 繰り返し終了'), cond: !!c };
          if (!c) break;
          yield* runBlock(s.body);
        }
      } else if (s.k === 'for') {
        curLine = s.line;
        const from = ev(s.from), to = ev(s.to), step = ev(s.step);
        setVar(s.v, from);
        for (;;) {
          curLine = s.line;
          const v = env.vars[s.v];
          const go = s.inc ? v <= to : v >= to;
          yield { line: s.line, note: go ? `${s.v} = ${fmt(v)}（${s.toText} = ${fmt(to)} まで）→ 中を実行` : `${s.v} = ${fmt(v)} は ${fmt(to)} を${s.inc ? '超えた' : '下回った'} → 繰り返し終了`, ch: s.v, cond: go };
          if (!go) break;
          yield* runBlock(s.body);
          setVar(s.v, env.vars[s.v] + (s.inc ? step : -step));
        }
      }
    }
    return { env, runBlock };
  }

  function snapshot(env) {
    const o = {}; env.order.forEach(k => { o[k] = clone(env.vars[k]); });
    return { order: env.order.slice(), vars: o };
  }

  function trace(src, funcs, opt) {
    opt = Object.assign({ maxRecord: 1500, maxSteps: 400000 }, opt || {});
    const { prog } = parseProgram(src);
    const R = makeRunner(funcs);
    const events = []; let steps = 0, skipped = 0, status = 'done', error = null;
    try {
      for (const e of R.runBlock(prog)) {
        steps++;
        if (events.length < opt.maxRecord) events.push(Object.assign(e, { snap: snapshot(R.env), outLen: R.env.out.length }));
        else skipped++;
        if (steps >= opt.maxSteps) { status = 'limit'; break; }
      }
    } catch (e) { status = 'error'; error = e; }
    if (skipped > 0 || status !== 'done') {
      const note = status === 'limit' ? `${steps.toLocaleString()} ステップを超えても終わりません（無限ループの可能性）`
        : status === 'error' ? 'エラー：' + error.message
        : `…途中の ${skipped.toLocaleString()} ステップは省略…　実行終了`;
      events.push({ line: status === 'error' ? error.line : null, note, snap: snapshot(R.env), outLen: R.env.out.length, end: true, error: status === 'error' });
    } else {
      events.push({ line: null, note: '実行終了', snap: snapshot(R.env), outLen: R.env.out.length, end: true });
    }
    return { events, out: R.env.out, status, error, steps };
  }

  G.DNCL = { parseProgram, trace, fmt, tokenize, DError };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

const UNITS = [

const QUESTIONS = [
// ===================== 順次・分岐 =====================
{ id: 'k1', unit: 'kihon', lv: 1, type: 'output',

{ id: 'k2', unit: 'kihon', lv: 1, type: 'blank',

  src: `n = 14

  expect: '14は偶数' },

{ id: 'k3', unit: 'kihon', lv: 1, type: 'output',
  title: '成績の判定',
  text: '次のプログラムを実行したとき、表示されるものを選びなさい。',
  src: `tensu = 68
もし tensu >= 80 ならば:
  hyoka = "A"
そうでなくもし tensu >= 60 ならば:
  hyoka = "B"
そうでなくもし tensu >= 40 ならば:
  hyoka = "C"
そうでなければ:

<script>

// ---------------- コード表示 ----------------
const KW_RE = /("[^"]*"|「[^」]*」)|(\d+(?:\.\d+)?)|(そうでなくもし|そうでなければ|もし|ならば|の間繰り返す|ずつ増やしながら繰り返す|ずつ減らしながら繰り返す|を|から|まで|\b(?:and|or|not)\b)|([A-Za-z_぀-ヿ㐀-鿿][A-Za-z0-9_぀-ヿ㐀-鿿]*(?=\())|([A-Za-z_][A-Za-z0-9_]*)/g;
function hl(t) {
  let out = '', last = 0, m;
  KW_RE.lastIndex = 0;
  while ((m = KW_RE.exec(t))) {
    out += esc(t.slice(last, m.index));
    const cls = m[1] ? 's' : m[2] ? 'nmb' : m[3] ? 'k' : m[4] ? 'fn' : 'v';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = KW_RE.lastIndex;
  }
  return out + esc(t.slice(last));
}
function lineHTML(text, opt) {
  // 空欄 [[ア]] の処理
  return text.split(/(\[\[[^\]]+\]\])/).map(part => {
    const m = part.match(/^\[\[(.+)\]\]$/);
    if (!m) return hl(part);
    const label = m[1];
    const bi = (opt.blanks || []).findIndex(b => b.label === label);
    const b = opt.blanks && opt.blanks[bi];
    const pk = opt.picks ? opt.picks[bi] : null;
    if (b && pk != null) {
      let st = '';
      if (opt.checked) st = pk === b.answer ? ' ok' : ' ng';
      return `<span class="blank filled${st}"><span class="bl">${esc(label)}</span>${hl(b.options[pk])}</span>`;
    }
    return `<span class="blank">${esc(label)}</span>`;
  }).join('');
}
function renderCode(src, opt) {
  opt = opt || {};
  const lines = src.split('\n').map(s => { const m = s.match(/^( *)(.*)$/); return { ind: Math.floor(m[1].length / 2), text: m[2] }; });
  return '<div class="code' + (opt.cls ? ' ' + opt.cls : '') + '">' + lines.map((L, i) => {
    const n = i + 1;
    const next = lines[i + 1];
    let g = '';
    for (let k = 1; k <= L.ind; k++) {
      const end = !next || next.ind < k;
      g += `<span class="g${end ? ' end' : ''}"></span>`;
    }
    let cls = 'cl';
    if (opt.select) cls += ' sel';
    if (opt.pick === n) cls += ' pick';
    if (opt.right === n) cls += ' right';
    if (opt.wrong === n) cls += ' wrong';
    if (opt.hl === n) cls += opt.err ? ' errl' : ' hl';
    const act = opt.select ? ` data-act="pickline" data-n="${n}" role="button" tabindex="0"` : '';
    return `<div class="${cls}" data-line="${n}"${act}><span class="no">(${String(n).padStart(2, '0')})</span>${g}<span class="tx">${lineHTML(L.text, opt)}</span></div>`;
  }).join('') + '</div>';
}
function filledSrc(q) {
  if (q.type === 'line') return q.fixed;
  let s = q.src;
  (q.blanks || []).forEach(b => { s = s.split('[[' + b.label + ']]').join(b.options[b.answer]); });
  return s;
}

function newCur(q) {

}
function record(id, ok) {

function vQuiz() {

function answerUI(q, c) {
  const dis = c.checked ? 'disabled' : '';
  if (q.type === 'blank') {
    return `<p class="alabel">空欄に入るものをえらぼう${q.blanks.length > 1 ? '（' + q.blanks.map(b => b.label).join('・') + '）' : ''}</p>` +
      q.blanks.map((b, bi) => `<div class="bgroup"><div class="bhead"><span class="bx">${esc(b.label)}</span></div><div class="opts">` +
        c.bord[bi].map((oi, pos) => {
          let cls = 'opt';
          if (c.checked) { if (oi === b.answer) cls += ' ok'; else if (c.picks[bi] === oi) cls += ' ng'; }
          else if (c.picks[bi] === oi) cls += ' on';
          const res = c.checked ? (oi === b.answer ? '<span class="res">⭕</span>' : c.picks[bi] === oi ? '<span class="res">❌</span>' : '') : '';
          return `<button class="${cls}" data-act="pickblank" data-b="${bi}" data-o="${oi}" ${dis}><span class="mk">${MARK[pos]}</span><span class="ot mono">${hl(b.options[oi])}</span>${res}</button>`;
        }).join('') + '</div></div>').join('');
  }
  if (q.type === 'purpose' || q.type === 'output') {
    const isMono = q.type === 'output';
    return `<p class="alabel">${q.type === 'output' ? '表示されるものをえらぼう' : 'あてはまるものをえらぼう'}</p><div class="opts">` +
      c.order.map((oi, pos) => {
        let cls = 'opt';
        if (c.checked) { if (oi === q.answer) cls += ' ok'; else if (c.choice === oi) cls += ' ng'; }
        else if (c.choice === oi) cls += ' on';
        const res = c.checked ? (oi === q.answer ? '<span class="res">⭕</span>' : c.choice === oi ? '<span class="res">❌</span>' : '') : '';
        return `<button class="${cls}" data-act="pickopt" data-o="${oi}" ${dis}><span class="mk">${MARK[pos]}</span><span class="ot${isMono ? ' mono' : ''}">${esc(q.options[oi])}</span>${res}</button>`;
      }).join('') + '</div>';
  }
  if (q.type === 'input') {
    const st = c.checked ? (c.ok ? 'ok' : 'ng') : '';
    return `<p class="alabel">表示される値を入力しよう</p>
      <div class="inbox"><input id="ans" class="${st}" type="text" inputmode="numeric" autocomplete="off" placeholder="ここに入力" value="${esc(c.input)}" ${dis}></div>`;
  }
  if (q.type === 'line') {
    return `<p class="alabel">左のプログラムで、誤っている行をタップしよう</p>

  }
  return '';
}
const PRAISE = ['正解！', 'すばらしい！', 'よく読めたね！', 'バッチリ！', 'その調子！'];
const ENC = ['おしい！', 'もう一歩！', 'ここで覚えよう！', 'トレースで確かめよう！'];
function feedback(q, c) {
  const ok = c.ok;
  let ans = '';
  if (!ok) {
    if (q.type === 'blank') ans = '正解：' + q.blanks.map(b => `${b.label} <code class="mono">${esc(b.options[b.answer])}</code>`).join('　');
    else if (q.type === 'input') ans = `正解：<code class="mono">${esc(q.accept[0])}</code>`;
    else if (q.type === 'line') ans = `正解：(${String(q.lineAnswer).padStart(2, '0')}) 行目`;
    else ans = `正解：${esc(q.options[q.answer])}`;
  }
  const last = Q.i === Q.ids.length - 1;
  return `<div class="fb ${ok ? 'ok' : 'ng'} pop" id="fb">
    <div class="fbhead">${owl(ok ? 'happy' : 'sad', 54)}<div>${ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : ENC[Math.floor(Math.random() * ENC.length)]}<small>${ok ? (needReview(q.id) ? 'あと1回正解で復習リストから卒業' : '') : 'この問題は「復習」に追加されました'}</small></div></div>
    ${ans ? `<div class="correct-ans">${ans}</div>` : ''}
    <div class="exp"><span class="lb">📝 解説</span>${esc(q.explain)}</div>
  </div>
  <div class="btnrow">
    ${q.noTrace === true ? '' : '<button class="btn mint" data-act="trace">▶ トレースで確かめる</button>'}
    <button class="btn nav" data-act="next">${last ? '結果を見る' : '次の問題へ →'}</button>
  </div>`;
}
function check() {
  const q = QMAP[Q.ids[Q.i]], c = Q.cur;
  let ok;
  if (q.type === 'blank') {
    if (c.picks.some(p => p == null)) { toast('すべての空欄をえらんでね'); return; }
    ok = q.blanks.every((b, i) => c.picks[i] === b.answer);
  } else if (q.type === 'purpose' || q.type === 'output') {
    if (c.choice == null) { toast('選択肢をえらんでね'); return; }
    ok = c.choice === q.answer;
  } else if (q.type === 'input') {
    const el = $('#ans'); if (el) c.input = el.value;
    const v = c.input.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[−ー－]/g, '-').replace(/\s/g, '');
    if (!v) { toast('答えを入力してね'); return; }
    ok = q.accept.includes(v);
  } else if (q.type === 'line') {
    if (c.line == null) { toast('行をタップしてえらんでね'); return; }
    ok = c.line === q.lineAnswer;
  }
  c.checked = true; c.ok = ok;
  record(q.id, ok);
  Q.results.push({ id: q.id, ok });
  render();
  requestAnimationFrame(() => { const fb = $('#fb'); if (fb && window.innerWidth <= 900) fb.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}
function next() {
  if (Q.i >= Q.ids.length - 1) { go('result'); return; }
  Q.i++; Q.cur = newCur(QMAP[Q.ids[Q.i]]);
  render(); window.scrollTo(0, 0);
}

function encodeSave() {
  const data = JSON.stringify({ v: 1, rec: S.rec, star: S.star, days: S.days });
  return 'YMD1-' + btoa(unescape(encodeURIComponent(data)));
}
function decodeSave(s) {
  s = s.trim().replace(/\s/g, '');
  if (!s.startsWith('YMD1-')) throw new Error('セーブコードの形式がちがいます');
  const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(5)))));
  if (!d.rec) throw new Error('読みこめませんでした');
  return d;
}

    ['添字と値を区別する', 'i は「何番目か」、Data[i] は「そこに入っている値」。最大値の「場所」を求めるのか「値」を求めるのかに注意。'],
    ['小さい例でためす', '要素が多いときは、2〜3個の小さい例で動きを確かめると目的が見えてきます。'],
    ['関数は説明を信じる', '問題文で「〜を返す」と説明された関数は、中身を考えずに返す値に置きかえて読もう。'],
  ];
  return `<div class="fade">
  <div class="qtop"><button class="xbtn" data-act="home" aria-label="もどる">←</button><b style="color:var(--navy);font-size:1.1rem">表記ガイド・読むコツ</b></div>
  <section class="card" style="padding:16px 18px">
    <div style="display:flex;gap:12px;align-items:center">${owl('normal', 60)}<div class="bubble">このアプリのプログラムは、大学入学共通テスト「情報」で使われるプログラム表記にそろえて書いているよ。Pythonとくらべて読んでみよう。</div></div>
    <p class="note" style="margin-top:10px">※ このアプリでは、配列の添字はすべて 0 から始まるものとします。関数（要素数・整数・乱数など）のはたらきは、各問題の問題文の説明にしたがってください。</p>
  </section>
  <h2 class="sec">表記の対応表</h2>
  <section class="card gwrap"><table class="gtable"><thead><tr><th>項目</th><th>共通テスト用プログラム表記</th><th>Python</th><th>ポイント</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td style="font-weight:900;white-space:nowrap">${r[0]}</td><td><code class="mono">${hl(r[1])}</code></td><td class="py"><code class="mono">${esc(r[2])}</code></td><td style="font-size:.85rem">${esc(r[3])}</td></tr>`).join('')}
  </tbody></table></section>
  <h2 class="sec">字下げの見方</h2>
  <section class="card" style="padding:16px 18px">
    <p style="margin:0 0 8px;font-size:.92rem">ブロック（繰り返しや「もし」の中身）は、左の縦線で表されます。縦線が └ で終わったところでブロックも終わり。下の例で (04) は繰り返しの<b>外</b>なので、1回だけ実行されます。</p>
    ${renderCode('goukei = 0\ni を 1 から 3 まで 1 ずつ増やしながら繰り返す:\n  goukei = goukei + i\n表示する(goukei)')}
  </section>
  <h2 class="sec">プログラムを読む6つのコツ</h2>
  <div class="tips">${tips.map((t, i) => `<div class="card tip"><h3><span class="tn">${i + 1}</span>${esc(t[0])}</h3><p>${esc(t[1])}</p></div>`).join('')}</div>
  </div>`;
}

// ---------------- トレース ----------------
let T = null;
function openTrace() {
  const q = QMAP[Q.ids[Q.i]];
  T = { q, which: 'fixed', i: 0, playing: false, timer: null, speed: 700 };
  runTrace();
  document.body.style.overflow = 'hidden';
  renderTrace();
}
function runTrace() {
  const q = T.q;
  T.src = (q.type === 'line' && T.which === 'orig') ? q.src : filledSrc(q);
  T.res = DNCL.trace(T.src, q.funcs);
  T.i = 0;
}
function closeTrace() { stopPlay(); T = null; $('#ov').innerHTML = ''; document.body.style.overflow = ''; }
function stopPlay() { if (T && T.timer) { clearInterval(T.timer); T.timer = null; } if (T) T.playing = false; }
function togglePlay() {
  if (T.playing) { stopPlay(); renderTrace(); return; }
  if (T.i >= T.res.events.length - 1) T.i = 0;
  T.playing = true;
  T.timer = setInterval(() => { if (T.i < T.res.events.length - 1) { T.i++; renderTrace(); } else { stopPlay(); renderTrace(); } }, T.speed);
  renderTrace();
}
function varHTML(name, v, pv) {
  const fv = x => typeof x === 'string' ? '"' + esc(x) + '"' : esc(DNCL.fmt(x));
  const changed = JSON.stringify(v) !== JSON.stringify(pv);
  if (Array.isArray(v) && v.length && Array.isArray(v[0])) {
    const cols = Math.max(...v.map(r => r.length));
    let h = `<table class="grid2"><tr><th></th>${Array.from({ length: cols }, (_, j) => `<th>${j}</th>`).join('')}</tr>`;
    v.forEach((row, i) => { h += `<tr><th>${i}</th>` + row.map((x, j) => `<td class="${pv && pv[i] && pv[i][j] !== x ? 'chg' : ''}">${fv(x)}</td>`).join('') + '</tr>'; });
    return `<div class="var${changed ? ' chg' : ''}"><span class="vn">${esc(name)}</span>${h}</table></div>`;
  }
  if (Array.isArray(v)) {
    return `<div class="var${changed ? ' chg' : ''}"><span class="vn">${esc(name)}</span><span class="arr">${v.map((x, i) => `<span class="cell"><span class="ix">${i}</span><span class="cv${pv && pv[i] !== x ? ' chg' : ''}">${fv(x)}</span></span>`).join('')}</span></div>`;
  }
  return `<div class="var${changed ? ' chg' : ''}"><span class="vn">${esc(name)}</span><span class="vv">${fv(v)}</span></div>`;
}
function renderTrace() {
  if (!T) return;
  const ev = T.res.events[T.i], prev = T.i > 0 ? T.res.events[T.i - 1] : null;
  const N = T.res.events.length;
  const q = T.q;
  const out = T.res.out.slice(0, ev.outLen);
  const noteCls = ev.error ? 'e' : ev.cond === true ? 't' : ev.cond === false ? 'f' : '';
  const sw = q.type === 'line' ? `<div class="tswitch"><button class="chip ${T.which === 'fixed' ? 'on' : ''}" data-act="tsw" data-w="fixed">✅ 修正後のプログラム</button><button class="chip ${T.which === 'orig' ? 'on' : ''}" data-act="tsw" data-w="orig">🐞 修正前（問題のまま）</button></div>` : '';
  $('#ov').innerHTML = `<div class="ov" data-act="ovbg"><div class="tr" role="dialog" aria-label="トレース">
    <div class="tr-h"><div class="tt">▶ トレース：${esc(q.title)}<small>1行ずつ実行して、変数と表示の変化を確かめよう${q.random ? '（乱数を使うので実行するたびに結果が変わります）' : ''}</small></div><button class="xbtn" style="background:transparent;border-color:#46618f" data-act="tclose" aria-label="閉じる">✕</button></div>
    <div class="tr-b">
      <div>${sw}<div class="tr-code" id="trcode">${renderCode(T.src, { hl: ev.line, err: ev.error })}</div></div>
      <div>
        <div class="tnote ${noteCls}"><span class="stp">${ev.end ? '終了' : (T.i + 1) + '/' + (N - 1)}</span><span>${ev.line ? `(${String(ev.line).padStart(2, '0')}) ` : ''}${esc(ev.note)}</span></div>
        <div class="vh">📦 変数</div>
        <div class="vlist">${ev.snap.order.length ? ev.snap.order.map(k => varHTML(k, ev.snap.vars[k], prev ? prev.snap.vars[k] : undefined)).join('') : '<div class="empty-state" style="padding:8px">まだ変数はありません</div>'}</div>
        <div class="vh">🖥️ 表示</div>
        <div class="console">${out.length ? out.map((l, i) => `<div class="ln${ev.show && i === out.length - 1 ? ' new' : ''}">${esc(l)}</div>`).join('') : '<span class="empty">（まだ何も表示されていません）</span>'}</div>
      </div>
    </div>
    <div class="tr-c">
      <button class="cb" data-act="tfirst" title="最初へ">⏮</button>
      <button class="cb" data-act="tprev" title="1つもどる">◀</button>
      <button class="cb main" data-act="tnext">1行すすむ ▶</button>
      <button class="cb play ${T.playing ? 'on' : ''}" data-act="tplay" title="自動再生">${T.playing ? '⏸' : '⏵'}</button>
      <button class="cb" data-act="tlast" title="最後へ">⏭</button>
      ${q.random ? '<button class="cb" data-act="trerun" title="もう一度実行（乱数が変わる）">🎲</button>' : ''}
      <input type="range" min="0" max="${N - 1}" value="${T.i}" id="tslider" aria-label="ステップ">
    </div>
  </div></div>`;
  const hlEl = document.querySelector('#trcode .cl.hl, #trcode .cl.errl');
  if (hlEl) hlEl.scrollIntoView({ block: 'nearest' });
}

// ---------------- 描画 ----------------
function render() {
  const app = $('#app');
  if (view === 'home') app.innerHTML = vHome();
  else if (view === 'select') app.innerHTML = vSelect();
  else if (view === 'quiz') app.innerHTML = vQuiz();
  else if (view === 'result') app.innerHTML = vResult();
  else if (view === 'records') app.innerHTML = vRecords();
  else if (view === 'guide') app.innerHTML = vGuide();
  else if (view === 'savepage') app.innerHTML = vSave();
}

// ---------------- 操作 ----------------
const ACT = {
  home: () => { Q = null; go('home'); },
  guide: () => go('guide'),
  records: () => go('records'),
  savepage: () => { pendingRestore = null; S._askReset = false; go('savepage'); },
  font: () => {
    const steps = [0.9, 1, 1.12, 1.25];
    const i = steps.indexOf(S.font || 1);
    S.font = steps[(i + 1) % steps.length]; save();
    document.documentElement.style.setProperty('--fs', S.font);
    toast('文字の大きさ：' + ['小', '標準', '大', '特大'][steps.indexOf(S.font)]);
  },
  omakase: () => omakase(),
  select: () => go('select'),
  review: () => startSession(shuffle(reviewIds()), '復習', 'review'),
  stars: () => startSession(shuffle(starIds()), 'チェックした問題'),
  unit: el => { const u = UMAP[el.dataset.u]; startSession(QUESTIONS.filter(q => q.unit === u.id).map(q => q.id), u.name); },
  one: el => startSession([el.dataset.id], QMAP[el.dataset.id].title),
  selchip: el => {
    const set = SEL[el.dataset.set]; const k = el.dataset.set === 'lv' ? Number(el.dataset.k) : el.dataset.k;
    if (set.has(k)) set.delete(k); else set.add(k); render();
  },
  selall: el => {
    const key = el.dataset.set; const all = key === 'units' ? UNITS.map(u => u.id) : Object.keys(TYPES);
    if (SEL[key].size === all.length) SEL[key].clear(); else SEL[key] = new Set(all);
    render();
  },
  selshuf: el => { SEL.shuffle = el.dataset.v === '1'; render(); },
  selstart: () => { const ids = selIds(); startSession(SEL.shuffle ? shuffle(ids) : ids, 'えらんで練習'); },
  quit: () => { if (Q.results.length) go('result'); else ACT.home(); },
  star: () => { const id = Q.ids[Q.i]; if (S.star[id]) delete S.star[id]; else S.star[id] = 1; save(); render(); toast(S.star[id] ? '★ チェックしました' : 'チェックをはずしました'); },
  hint: () => { Q.cur.hint = true; render(); },
  pickblank: el => { if (Q.cur.checked) return; Q.cur.picks[+el.dataset.b] = +el.dataset.o; render(); },
  pickopt: el => { if (Q.cur.checked) return; Q.cur.choice = +el.dataset.o; render(); },
  pickline: el => { if (Q.cur.checked) return; Q.cur.line = +el.dataset.n; render(); },
  check: () => check(),
  next: () => next(),
  retrywrong: () => { const ids = Q.results.filter(r => !r.ok).map(r => r.id); startSession([...new Set(ids)], 'まちがえた問題'); },
  trace: () => openTrace(),
  tclose: () => closeTrace(),
  ovbg: (el, e) => { if (e.target === el) closeTrace(); },
  tnext: () => { stopPlay(); if (T.i < T.res.events.length - 1) T.i++; renderTrace(); },
  tprev: () => { stopPlay(); if (T.i > 0) T.i--; renderTrace(); },
  tfirst: () => { stopPlay(); T.i = 0; renderTrace(); },
  tlast: () => { stopPlay(); T.i = T.res.events.length - 1; renderTrace(); },
  tplay: () => togglePlay(),
  trerun: () => { stopPlay(); runTrace(); renderTrace(); toast('🎲 もう一度実行しました'); },
  tsw: el => { stopPlay(); T.which = el.dataset.w; runTrace(); renderTrace(); },
  copysave: async () => {
    const ta = $('#savecode');
    try { await navigator.clipboard.writeText(ta.value); toast('📋 コピーしました'); }
    catch (e) { ta.focus(); ta.select(); toast('選択しました。Ctrl+C（長押し→コピー）でコピーしてね'); }
  },
  loadsave: () => {
    try { pendingRestore = decodeSave($('#loadcode').value); render(); }
    catch (e) { toast('⚠ ' + e.message); }
  },
  restore: el => {
    const m = el.dataset.m, d = pendingRestore;
    if (m === 'cancel' || !d) { pendingRestore = null; render(); return; }
    if (m === 'replace') { S.rec = d.rec || {}; S.star = d.star || {}; S.days = d.days || {}; }
    else {
      Object.entries(d.rec || {}).forEach(([id, r]) => { const a = S.rec[id]; if (!a || (r.t || 0) > (a.t || 0)) S.rec[id] = r; });
      Object.assign(S.star, d.star || {});
      Object.entries(d.days || {}).forEach(([k, v]) => { S.days[k] = Math.max(S.days[k] || 0, v); });
    }
    save(); pendingRestore = null; toast('✅ 記録を読みこみました'); go('home');
  },
  reset: el => {
    const m = el.dataset.m;
    if (m === 'ask') S._askReset = true;
    else if (m === 'no') S._askReset = false;
    else { S.rec = {}; S.star = {}; S.days = {}; S._askReset = false; save(); toast('記録を消しました'); }
    render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans' && Q) Q.cur.input = e.target.value;
  if (e.target.id === 'tslider' && T) { stopPlay(); T.i = +e.target.value; renderTrace(); const s = $('#tslider'); if (s) s.focus(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'loadfile') {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { pendingRestore = decodeSave(String(rd.result)); render(); } catch (err) { toast('⚠ ' + err.message); } };
    rd.readAsText(f);
  }
});
document.addEventListener('keydown', e => {
  if (T) {
    if (e.key === 'ArrowRight') { e.preventDefault(); ACT.tnext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); ACT.tprev(); }
    else if (e.key === 'Escape') closeTrace();
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'ans') { e.preventDefault(); check(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sel')) { e.preventDefault(); ACT.pickline(e.target); }
});

render();
})();

</script>
